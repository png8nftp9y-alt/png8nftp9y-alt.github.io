<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CourtWatch</title>
<link rel="stylesheet" href="styles.css"></head><body><main class="shell">
<header class="top"><div class="brand"><div class="logo">CW</div><div><h1>CourtWatch</h1><p>Calendario tornei e partite</p></div></div><div class="status"><i class="dot"></i><span id="syncStatus">Monitor attivo</span></div></header>
<section id="homeView" class="view active"><div class="toolbar"><div class="title"><h2 id="monthTitle">Calendario</h2><p>Partite pubblicate e giocatori impegnati nei tornei.</p></div><div class="nav"><button class="btn icon" id="prevMonth">‹</button><button class="btn" id="todayBtn">Oggi</button><button class="btn icon" id="nextMonth">›</button></div></div><div class="layout"><div class="card calendar"><div class="filters"><div class="filterLabel"><span>Filtra giocatori</span><button class="btn" id="toggleAll">Deseleziona tutti</button></div><div class="chips" id="playerFilters"></div></div><div class="calendarWeek"><div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mer</div><div class="weekday">Gio</div><div class="weekday">Ven</div><div class="weekday">Sab</div><div class="weekday">Dom</div></div><div class="calendarGrid" id="calendar"></div></div><aside class="sidebar"><div class="card"><div class="weekCard"><div class="weekTop"><div class="weekTitle"><div class="trophy">♜</div><div><h3>Impegnati questa settimana</h3><p id="weekRange"></p></div></div><div class="weekNav"><button id="prevWeek">‹</button><button id="nextWeek">›</button></div></div><div id="weeklyActive"></div></div></div><div class="card"><div class="cardHead"><h3>Giocatori monitorati</h3><span id="playerTotal">0</span></div><div class="playersList" id="playersList"></div></div><div class="card"><div class="cardHead"><h3>Stato fonti</h3><span id="lastSync">—</span></div><div id="sourceList"></div></div></aside></div></section>
<section id="profileView" class="view"><button class="btn back" id="backHome">← Calendario</button><div id="profileContent"></div></section>
</main><script src="app.js"></script></body></html>
