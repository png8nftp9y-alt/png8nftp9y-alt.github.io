name: Court Watch v3 FITP player profile clubs

on:
  workflow_dispatch:
  push:
    paths:
      - 'courtwatch-v3-fitp-player-profile-clubs-trigger.json'
      - 'src/v3/diagnose-fitp-player-profile-clubs.mjs'
      - '.github/workflows/courtwatch-v3-fitp-player-profile-clubs.yml'

permissions:
  contents: write

concurrency:
  group: courtwatch-v3-fitp-player-profile-clubs
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch FITP profile clubs
        run: |
          set +e
          node src/v3/diagnose-fitp-player-profile-clubs.mjs > courtwatch-v3-fitp-player-profile-clubs-run.log 2>&1
          echo "profileClubsExit=$?" >> courtwatch-v3-fitp-player-profile-clubs-run.log
      - name: Commit profile club data
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/fitp_player_profile_clubs.json courtwatch-v3-fitp-player-profile-clubs-run.log
          git commit -m "Run Court Watch v3 FITP profile club diagnostic" || echo "No changes"
          git push
