name: Inspect FITP tournament pagination
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [puc-list-debug.mjs, .github/workflows/puc-list-debug.yml]
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node puc-list-debug.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add puc-list-debug.json
          if ! git diff --cached --quiet; then git commit -m 'Capture FITP tournament pagination'; git pull --rebase origin main; git push; fi
