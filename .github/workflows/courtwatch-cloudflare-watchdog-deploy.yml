name: Court Watch Cloudflare watchdog deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/watchdog/**'
      - '.github/workflows/courtwatch-cloudflare-watchdog-deploy.yml'

permissions:
  contents: read

concurrency:
  group: courtwatch-cloudflare-watchdog-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/watchdog/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - name: Validate Worker
        run: npx wrangler deploy --dry-run
      - name: Deploy Worker and cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: npx wrangler deploy --minify --keep-vars
      - name: Configure GitHub dispatch token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          COURTWATCH_WATCHDOG_GITHUB_TOKEN: ${{ secrets.COURTWATCH_WATCHDOG_GITHUB_TOKEN }}
        run: printf '%s' "$COURTWATCH_WATCHDOG_GITHUB_TOKEN" | npx wrangler secret put COURTWATCH_GITHUB_TOKEN
