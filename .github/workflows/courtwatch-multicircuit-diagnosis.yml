name: Court Watch Pizzi Arginelli multicircuit diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/scripts/inspect-multicircuit-players.mjs'
      - '.github/workflows/courtwatch-multicircuit-diagnosis.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-multicircuit-diagnosis
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect real identity and tournament projections without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node cloudflare/app-api/scripts/inspect-multicircuit-players.mjs
