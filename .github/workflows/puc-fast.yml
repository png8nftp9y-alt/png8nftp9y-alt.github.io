name: Fast FITP PUC schedule scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [puc-direct.mjs, puc-importer-v2.mjs, courtwatch-cleanup.mjs, build-surname-aliases.mjs, .github/workflows/puc-fast.yml]
  schedule:
    - cron: '*/15 * * * *'
permissions: { contents: write, issues: write }
concurrency: { group: court-watch-puc-fast, cancel-in-progress: false }
jobs:
  puc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: node build-surname-aliases.mjs
      - name: Download official P.U.C. documents
        run: |
          date -u +%FT%TZ > puc-run-start.txt
          node puc-direct.mjs 2>&1 | tee puc-diagnostics.log
      - name: Import and validate singles and doubles
        run: |
          node puc-importer-v2.mjs --inbox puc-inbox --data data.json --players players.json --alerts alerts.json 2>&1 | tee -a puc-diagnostics.log
          node courtwatch-cleanup.mjs
      - name: Notify Federico on new matches
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          node <<'NODE'
          const fs=require('fs'),a=JSON.parse(fs.readFileSync('alerts.json','utf8'));if(!a.notifications?.length)process.exit(0);fs.writeFileSync('/tmp/alert.md',['@png8nftp9y-alt **nuovo aggiornamento Court Watch**','',...a.notifications.map(n=>`- **${n.playerName}** — ${n.message}`)].join('\n'));
          NODE
          if [ -s /tmp/alert.md ]; then gh issue comment 7 --body-file /tmp/alert.md; fi
      - name: Remove processed PDFs
        if: always()
        run: find puc-inbox -type f -iname '*.pdf' -delete 2>/dev/null || true
      - name: Save updates
        if: always()
        run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add -A puc-inbox puc-run-start.txt puc-diagnostics.log puc-discovery.json puc-api.json data.json alerts.json players.json cleanup-report.json
          if ! git diff --cached --quiet; then git commit -m 'Import validated FITP P.U.C. schedules'; git pull --rebase origin main; git push; fi
