name: Fast FITP PUC schedule scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [puc-monitor.mjs, .github/workflows/puc-fast.yml]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: court-watch-puc
  cancel-in-progress: true
jobs:
  puc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Read PUC orders of play
        run: node puc-monitor.mjs
      - name: Save PUC schedules
        run: |
          git config user.name "courtwatch-bot"
          git config user.email "courtwatch-bot@users.noreply.github.com"
          git add data.json alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FITP PUC match times"
            git pull --rebase origin main
            git push
          fi
      - name: Publish new alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('alerts.json','utf8'));if(!a.notifications?.length)process.exit(0);fs.writeFileSync('/tmp/puc.md',['## 🎾 Aggiornamento P.U.C. FITP','',...a.notifications.map(n=>`- **${n.playerName}** — ${n.message}\n  ${n.url||''}`)].join('\n'));
          NODE
          if [ -s /tmp/puc.md ]; then gh issue comment 7 --body-file /tmp/puc.md; fi
