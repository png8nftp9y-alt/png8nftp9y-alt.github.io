name: Fast FITP PUC schedule scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [puc-direct.mjs, puc-importer-v2.mjs, .github/workflows/puc-fast.yml]
  schedule:
    - cron: '*/15 * * * *'
permissions: { contents: write, issues: write }
concurrency: { group: court-watch-puc-fast, cancel-in-progress: false }
jobs:
  puc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Download official P.U.C. documents
        run: |
          date -u +%FT%TZ > puc-run-start.txt
          node puc-direct.mjs 2>&1 | tee puc-diagnostics.log
      - name: Import singles and doubles
        run: node puc-importer-v2.mjs --inbox puc-inbox --data data.json --players players.json --alerts alerts.json 2>&1 | tee -a puc-diagnostics.log
      - name: Remove processed PDFs
        if: always()
        run: find puc-inbox -type f -iname '*.pdf' -delete 2>/dev/null || true
      - name: Save updates
        if: always()
        run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add -A puc-inbox puc-run-start.txt puc-diagnostics.log puc-discovery.json puc-api.json data.json alerts.json
          if ! git diff --cached --quiet; then git commit -m 'Import FITP P.U.C. schedules'; git pull --rebase origin main; git push; fi
