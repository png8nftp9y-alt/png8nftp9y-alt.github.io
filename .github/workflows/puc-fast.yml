name: Fast FITP PUC schedule scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [puc-direct.mjs, puc-detail-probe.mjs, puc-importer.mjs, .github/workflows/puc-fast.yml]
  schedule:
    - cron: '*/15 * * * *'
permissions: { contents: write, issues: write }
concurrency: { group: court-watch-puc, cancel-in-progress: false }
jobs:
  puc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Mark scanner start
        run: |
          date -u +%FT%TZ > puc-run-start.txt
          echo "Court Watch P.U.C. run: $(date -u +%FT%TZ)" > puc-diagnostics.log
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install browser and PDF tools
        continue-on-error: true
        run: |
          npm ci 2>&1 | tee -a puc-diagnostics.log
          npx playwright install --with-deps chromium 2>&1 | tee -a puc-diagnostics.log
          sudo apt-get update 2>&1 | tee -a puc-diagnostics.log
          sudo apt-get install -y poppler-utils 2>&1 | tee -a puc-diagnostics.log
      - name: Discover official P.U.C. documents
        if: always()
        continue-on-error: true
        run: |
          node puc-detail-probe.mjs 2>&1 | tee -a puc-diagnostics.log
          node --check puc-direct.mjs 2>&1 | tee -a puc-diagnostics.log
          node puc-direct.mjs 2>&1 | tee -a puc-diagnostics.log
      - name: Import downloaded orders of play
        if: always()
        continue-on-error: true
        run: node puc-importer.mjs --inbox puc-inbox --data data.json --players players.json --alerts alerts.json 2>&1 | tee -a puc-diagnostics.log
      - name: Remove processed binary files
        if: always()
        run: find puc-inbox -type f -iname '*.pdf' -delete 2>/dev/null || true
      - name: Save Court Watch updates
        if: always()
        run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add -A puc-inbox puc-run-start.txt puc-diagnostics.log puc-discovery.json puc-api.json puc-js-context.json data.json alerts.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'Import FITP P.U.C. schedules'; git pull --rebase origin main; git push; fi
      - name: Publish new alerts
        if: always()
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          node <<'NODE'
          const fs=require('fs'); if(!fs.existsSync('alerts.json')) process.exit(0); const a=JSON.parse(fs.readFileSync('alerts.json','utf8')); if(!a.notifications?.length) process.exit(0); fs.writeFileSync('/tmp/puc.md',['## 🎾 Aggiornamento P.U.C. FITP','',...a.notifications.map(n=>`- **${n.playerName}** — ${n.message}\n  ${n.url||''}`)].join('\n'));
          NODE
          if [ -s /tmp/puc.md ]; then gh issue comment 7 --body-file /tmp/puc.md; fi
