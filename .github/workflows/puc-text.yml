name: Extract FITP order text
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/puc-text.yml]
permissions: {contents: write}
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: |
          node puc-direct.mjs
          mkdir -p puc-text
          for f in puc-inbox/*.pdf; do [ -f "$f" ] || continue; pdftotext -layout "$f" "puc-text/$(basename "$f" .pdf).txt"; done
          rm -f puc-inbox/*.pdf
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add puc-text puc-api.json puc-discovery.json
          if ! git diff --cached --quiet; then git commit -m 'Extract official FITP order text'; git pull --rebase origin main; git push; fi
