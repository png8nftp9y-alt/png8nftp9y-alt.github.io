name: Court Watch v3 FITP player search audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/audit-fitp-player-search.mjs'
      - 'courtwatch-v3-fitp-player-search-audit-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-player-search-audit.yml'
      - 'players.json'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-player-search-audit,cancel-in-progress: true}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run FITP player-driven discovery audit
        run: |
          set +e
          node src/v3/audit-fitp-player-search.mjs > courtwatch-v3-fitp-player-search-audit-run.log 2>&1
          code=$?
          echo "exitCode=$code" >> courtwatch-v3-fitp-player-search-audit-run.log
          cat courtwatch-v3-fitp-player-search-audit-run.log
          exit $code
      - name: Commit player search audit
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_player_search_audit.json courtwatch-v3-fitp-player-search-audit-run.log .github/workflows/courtwatch-v3-fitp-player-search-audit.yml
          git commit -m "Build Court Watch v3 FITP player search audit" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
