name: Court Watch residual profile provenance once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-residual-profile-provenance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - run: node scripts/inspect-residual-profile-provenance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-profile-provenance
          path: cloudflare/app-api/tmp/residual-profile-provenance/
          retention-days: 7
