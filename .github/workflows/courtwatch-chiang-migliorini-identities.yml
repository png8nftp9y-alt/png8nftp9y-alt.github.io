name: Court Watch Chiang and Migliorini identity decisions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-chiang-migliorini-identities.yml'
      - 'cloudflare/app-api/scripts/apply-chiang-migliorini-identities.mjs'
      - 'cloudflare/app-api/data/user-approved-chiang-migliorini-20261119.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact merges, exclusions, separation, closure and zero-write replay
        run: node --test test/chiang-migliorini-identities.test.mjs test/player-identity-mapping.test.mjs test/identity-review-queue.test.mjs
      - run: node scripts/configure-d1.mjs
      - name: Apply the two explicit user decisions and verify D1
        run: node scripts/apply-chiang-migliorini-identities.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chiang-migliorini-identities-readback
          path: cloudflare/app-api/tmp/chiang-migliorini-identities.json
          retention-days: 30
