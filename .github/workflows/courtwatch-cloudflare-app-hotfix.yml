name: Court Watch Cloudflare app Worker hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/src/index.js'
      - 'cloudflare/app-api/lib/**'
      - '!cloudflare/app-api/lib/read-only-d1-client.mjs'
      - '!cloudflare/app-api/lib/tournament-seed-statements.mjs'
      - '!cloudflare/app-api/lib/seed-statement-plan.mjs'
      - 'cloudflare/app-api/test/**'
      - '!cloudflare/app-api/test/read-only-d1-client.test.mjs'
      - '!cloudflare/app-api/test/sync-fitp-player-metadata.test.mjs'
      - 'cloudflare/app-api/scripts/prepare-runtime-assets.mjs'
      - 'cloudflare/app-api/scripts/verify-static-flags.mjs'
      - 'flags/**'
      - '.github/workflows/courtwatch-cloudflare-app-hotfix.yml'
      - 'v3.js'
      - 'v3.css'
      - 'v3.html'

permissions:
  contents: read

concurrency:
  group: courtwatch-app-hotfix
  cancel-in-progress: false
  queue: single

jobs:
  check-source:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check source outside the D1 writer queue
        working-directory: cloudflare/app-api
        run: npm run check && node --test test/app-worker-r2-binding.test.mjs
  deploy-worker:
    needs: check-source
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Recheck source only when code advanced during the wait
        env:
          CHECKED_SHA: ${{ needs.check-source.outputs.source_sha }}
        run: |
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CHECKED_SHA"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$CHECKED_SHA" HEAD -- cloudflare/app-api src/v3 tools/tests v3.js v3.html v3.css .github/workflows; then
            npm run check && node --test test/app-worker-r2-binding.test.mjs
          fi
      - name: Require archive binding before configuring Worker
        run: test -n "$R2_BUCKET"
      - run: npm run configure
      - name: Verify generated archive binding before deploy
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.generated.jsonc','utf8')); if(!c.r2_buckets?.some(b=>b.binding==='ARCHIVE' && b.bucket_name===process.env.R2_BUCKET)) throw Error('Missing ARCHIVE binding; deploy blocked');"
      - name: Verify fresh D1 runtime release before deployment
        run: node scripts/sync-runtime-documents-d1.mjs
      - name: Deploy Worker only
        run: npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc
      - name: Verify deployed nationality flags
        run: node scripts/verify-static-flags.mjs
      - name: Verify protected app no Worker exception
        working-directory: .
        run: |
          status=$(curl -sS -o /tmp/courtwatch-app.html -w '%{http_code}' https://courtwatch-app-api.ckrk9ggvrb.workers.dev/app)
          test "$status" = "200" || test "$status" = "302"
          ! grep -q 'error code: 1101' /tmp/courtwatch-app.html
