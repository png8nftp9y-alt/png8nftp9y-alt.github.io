name: Court Watch ITF live data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['itf-entries.mjs','courtwatch-finalize.mjs','players.json','former-players.json','.github/workflows/courtwatch-itf-live.yml']
  schedule:
    - cron: '*/10 * * * *'
permissions: {contents: write}
concurrency: {group: court-watch-itf-live,cancel-in-progress: true}
jobs:
  itf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - run: npm ci || true
      - name: Sync ITF official only
        run: |
          set +e
          : > /tmp/itf-live.log
          timeout 360 node run-with-former.mjs itf-entries.mjs >> /tmp/itf-live.log 2>&1; ITF=$?
          timeout 60 node run-with-former.mjs courtwatch-finalize.mjs >> /tmp/itf-live.log 2>&1; FINALIZE=$?
          exit 0
      - name: Publish ITF data
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json itf-sync.json
          git commit -m 'Update Court Watch ITF live data' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
