name: Court Watch v3 FITP map gap diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/diagnose-fitp-map-gap.mjs'
      - 'courtwatch-v3-fitp-map-gap-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-map-gap-diagnostic.yml'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-fitp-map-gap
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose Anna FITP map gap
        run: |
          set +e
          : > courtwatch-v3-fitp-map-gap-run.log
          node src/v3/diagnose-fitp-map-gap.mjs >> courtwatch-v3-fitp-map-gap-run.log 2>&1
          code=$?
          echo "mapGapExit=$code" >> courtwatch-v3-fitp-map-gap-run.log
          cat courtwatch-v3-fitp-map-gap-run.log
          exit $code
      - name: Commit FITP map gap diagnostic
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/fitp_map_gap_diagnostic.json courtwatch-v3-fitp-map-gap-run.log src/v3/diagnose-fitp-map-gap.mjs .github/workflows/courtwatch-v3-fitp-map-gap-diagnostic.yml
          git commit -m "Build FITP Anna map gap diagnostic" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
