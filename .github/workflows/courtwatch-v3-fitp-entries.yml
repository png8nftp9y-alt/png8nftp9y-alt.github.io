name: Court Watch v3 FITP player entries

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'players.json'
      - 'src/v3/discover-fitp.mjs'
      - 'src/v3/entries-engine.mjs'
      - 'src/v3/maintain-fitp-calendar-history.mjs'
      - '.github/workflows/courtwatch-v3-fitp-entries.yml'

permissions:
  contents: write

concurrency:
  group: court-watch-v3-fitp-player-entries
  cancel-in-progress: false

jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match players against validated provincial catalog
        run: node src/v3/discover-fitp.mjs
      - name: Rebuild calendar from independent entry engines
        run: node src/v3/entries-engine.mjs
      - name: Update last-known-good FITP calendar history
        run: node src/v3/maintain-fitp-calendar-history.mjs
      - name: Publish validated player entries atomically
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add \
            dist/v3/source_fitp_entries.json \
            dist/v3/source_fitp_entries_audit.json \
            dist/v3/players.json \
            dist/v3/tournament_entries.json \
            dist/v3/tournaments.json \
            dist/v3/entries_fitp.json \
            dist/v3/entries_tennis_europe.json \
            dist/v3/entries_itf.json \
            dist/v3/sync_status.json \
            dist/v3/diagnostics.json \
            dist/v3/entries_log.json \
            history/player_tournaments.json \
            history/audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Update validated player entries and calendar"
          git pull --rebase origin main
          git push origin HEAD:main
