name: Court Watch v3 FITP-only entries
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp-tournaments.mjs'
      - 'src/v3/discover-fitp.mjs'
      - 'src/v3/entries-engine.mjs'
      - 'courtwatch-v3-fitp-entries-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-entries.yml'
      - 'players.json'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-entries,cancel-in-progress: true}
jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run FITP-only discovery, entries and calendar merge
        run: |
          set +e
          tmpLog="courtwatch-v3-fitp-entries-run.tmp.log"
          : > "$tmpLog"
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          node src/v3/discover-fitp-tournaments.mjs >> "$tmpLog" 2>&1
          fitpTournamentsCode=$?
          echo "fitpTournamentsExit=$fitpTournamentsCode" >> "$tmpLog"
          if [ "$fitpTournamentsCode" -ne 0 ]; then
            cat "$tmpLog"
            cp "$tmpLog" courtwatch-v3-fitp-entries-run.log
            exit "$fitpTournamentsCode"
          fi
          node src/v3/discover-fitp.mjs >> "$tmpLog" 2>&1
          fitpCode=$?
          echo "fitpEntriesExit=$fitpCode" >> "$tmpLog"
          if [ "$fitpCode" -ne 0 ]; then
            cat "$tmpLog"
            cp "$tmpLog" courtwatch-v3-fitp-entries-run.log
            exit "$fitpCode"
          fi
          node src/v3/entries-engine.mjs >> "$tmpLog" 2>&1
          mergeCode=$?
          echo "calendarMergeExit=$mergeCode" >> "$tmpLog"
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          cat "$tmpLog"
          cp "$tmpLog" courtwatch-v3-fitp-entries-run.log
          exit "$mergeCode"
      - name: Commit FITP-only entries and calendar output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          if [ ! -s courtwatch-v3-fitp-entries-run.log ]; then
            echo "No non-empty FITP run log produced; skipping commit to avoid deleting diagnostics."
            exit 0
          fi
          git add dist/v3/source_fitp_tournaments.json dist/v3/source_fitp_tournaments_audit.json dist/v3/source_fitp_entries.json dist/v3/source_fitp_entries_audit.json dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/entries_fitp.json dist/v3/entries_tennis_europe.json dist/v3/entries_itf.json dist/v3/sync_status.json dist/v3/entries_log.json courtwatch-v3-fitp-entries-run.log .github/workflows/courtwatch-v3-fitp-entries.yml
          git commit -m "Build Court Watch v3 FITP entries and calendar" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
