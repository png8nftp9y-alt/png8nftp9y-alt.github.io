name: Court Watch v3 FITP-only entries
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp-tournaments.mjs'
      - 'src/v3/discover-fitp.mjs'
      - 'courtwatch-v3-fitp-entries-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-entries.yml'
      - 'players.json'
permissions: {contents: write}
concurrency:
  group: court-watch-v3-fitp-entries-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run FITP-only discovery
        run: |
          set +e
          tmpLog="courtwatch-v3-fitp-entries-run.tmp.log"
          : > "$tmpLog"
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          echo "sourceSha=${GITHUB_SHA}" >> "$tmpLog"
          echo "runId=${GITHUB_RUN_ID}" >> "$tmpLog"
          echo "mode=fitp-source-only-no-global-calendar-merge" >> "$tmpLog"
          node src/v3/discover-fitp-tournaments.mjs >> "$tmpLog" 2>&1
          fitpTournamentsCode=$?
          echo "fitpTournamentsExit=$fitpTournamentsCode" >> "$tmpLog"
          if [ "$fitpTournamentsCode" -ne 0 ]; then
            cat "$tmpLog"
            cp "$tmpLog" courtwatch-v3-fitp-entries-run.log
            exit "$fitpTournamentsCode"
          fi
          node src/v3/discover-fitp.mjs >> "$tmpLog" 2>&1
          fitpCode=$?
          echo "fitpEntriesExit=$fitpCode" >> "$tmpLog"
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          cat "$tmpLog"
          cp "$tmpLog" courtwatch-v3-fitp-entries-run.log
          exit "$fitpCode"
      - name: Commit FITP source outputs only
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          if [ ! -s courtwatch-v3-fitp-entries-run.log ]; then
            echo "No non-empty FITP run log produced; skipping commit to avoid deleting diagnostics."
            exit 0
          fi
          git add dist/v3/source_fitp_tournaments.json dist/v3/source_fitp_tournaments_audit.json dist/v3/source_fitp_entries.json dist/v3/source_fitp_entries_audit.json courtwatch-v3-fitp-entries-run.log .github/workflows/courtwatch-v3-fitp-entries.yml src/v3/discover-fitp-tournaments.mjs src/v3/discover-fitp.mjs || true
          git commit --allow-empty -m "Build Court Watch v3 FITP source data" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
