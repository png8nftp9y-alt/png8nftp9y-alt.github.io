name: Court Watch v3 FITP-only entries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp-tournaments.mjs'
      - 'src/v3/discover-fitp.mjs'
      - 'courtwatch-v3-fitp-entries-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-entries.yml'
      - 'players.json'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-entries,cancel-in-progress: true}
jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run FITP-only tournament and entries discovery
        run: |
          set +e
          : > courtwatch-v3-fitp-entries-run.log
          node src/v3/discover-fitp-tournaments.mjs >> courtwatch-v3-fitp-entries-run.log 2>&1
          echo "fitpTournamentsExit=$?" >> courtwatch-v3-fitp-entries-run.log
          node src/v3/discover-fitp.mjs >> courtwatch-v3-fitp-entries-run.log 2>&1
          code=$?
          echo "fitpEntriesExit=$code" >> courtwatch-v3-fitp-entries-run.log
          cat courtwatch-v3-fitp-entries-run.log
          exit $code
      - name: Commit FITP-only entries output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_tournaments.json dist/v3/source_fitp_tournaments_audit.json dist/v3/source_fitp_entries.json dist/v3/source_fitp_entries_audit.json courtwatch-v3-fitp-entries-run.log .github/workflows/courtwatch-v3-fitp-entries.yml
          git commit -m "Build Court Watch v3 FITP-only entries" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
