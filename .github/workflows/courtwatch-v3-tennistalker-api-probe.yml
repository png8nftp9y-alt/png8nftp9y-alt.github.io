name: Court Watch v3 TennisTalker API probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/probe-tennistalker-api-anna.mjs'
      - 'courtwatch-v3-tennistalker-api-trigger.json'
      - '.github/workflows/courtwatch-v3-tennistalker-api-probe.yml'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-tennistalker-api-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe TennisTalker public API for Anna
        run: |
          set +e
          : > courtwatch-v3-tennistalker-api-run.log
          node src/v3/probe-tennistalker-api-anna.mjs >> courtwatch-v3-tennistalker-api-run.log 2>&1
          code=$?
          echo "tennistalkerApiExit=$code" >> courtwatch-v3-tennistalker-api-run.log
          cat courtwatch-v3-tennistalker-api-run.log
          exit $code
      - name: Commit TennisTalker API probe
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/tennistalker_anna_api_probe.json courtwatch-v3-tennistalker-api-run.log src/v3/probe-tennistalker-api-anna.mjs .github/workflows/courtwatch-v3-tennistalker-api-probe.yml
          git commit -m "Build TennisTalker Anna API probe" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
