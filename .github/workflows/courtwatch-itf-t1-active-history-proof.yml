name: Court Watch ITF T-1 active historical-method proof
on:
  push:
    branches: ['test/itf-t1-active-history-engine']
    paths:
      - 'src/v3/acquire-itf-history-draw-task.mjs'
      - 'src/v3/build-itf-t1-section-matrix.mjs'
      - 'src/v3/merge-itf-t1-history-method.mjs'
      - '.github/workflows/courtwatch-itf-t1-active-history-proof.yml'
permissions: {contents: read}
concurrency: {group: courtwatch-itf-t1-active-history-proof,cancel-in-progress: false}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      competition_id: ${{ steps.inventory.outputs.competition_id }}
      declared: ${{ steps.inventory.outputs.declared }}
      requested: ${{ steps.inventory.outputs.requested }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: inventory
        env:
          ITF_T1_COMPETITION_ID: J-J30-ARG-2026-003
          ITF_REQUEST_DELAY_MS: 1800
        run: node src/v3/build-itf-t1-section-matrix.mjs
      - uses: actions/upload-artifact@v4
        with: {name: itf-t1-active-inventory, path: dist/v3/itf_t1_section_inventory.json, if-no-files-found: error, retention-days: 14}
  acquire:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 11
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Acquire one unresolved active draw exactly as history
        continue-on-error: true
        env:
          ITF_DRAW_TASK_B64: ${{ matrix.task }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUIRE_POPULATED_DRAW: 1
        run: |
          export ITF_DRAW_TASK_JSON="$(printf '%s' "$ITF_DRAW_TASK_B64" | base64 --decode)"
          node src/v3/acquire-itf-history-draw-task.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-t1-active-draw-${{ matrix.index }}
          path: dist/v3/shards/itf/draw-tasks/*.json.gz
          if-no-files-found: error
          retention-days: 14
  review:
    needs: [inventory, acquire]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: itf-t1-active-inventory, path: dist/v3}
      - uses: actions/download-artifact@v4
        with: {pattern: 'itf-t1-active-draw-*', path: draw-tasks, merge-multiple: true}
      - name: Verify preservation and failure classification
        env:
          ITF_FAIL_ON_TECHNICAL: 1
        run: node src/v3/merge-itf-t1-history-method.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-t1-active-history-proof
          path: |
            dist/v3/itf_t1_section_inventory.json
            dist/v3/source_itf_draw_audit.json
            history/itf_draw_target_db.json
          if-no-files-found: error
          retention-days: 14
