name: Court Watch targeted historical D1 storage proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-targeted-d1-storage.yml'
      - 'tools/verify-d1-targeted-storage.mjs'
      - 'tools/tests/targeted-d1-storage.test.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: courtwatch-targeted-d1-storage-readonly
  cancel-in-progress: false
  queue: single
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test exact-content proof and read-only guard
        run: node --test tools/tests/targeted-d1-storage.test.mjs cloudflare/app-api/test/read-only-d1-client.test.mjs
      - name: Download the fixed original acquisition, never the latest run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/courtwatch-four-originals
          gh run download 38935714222 --repo "$GITHUB_REPOSITORY" --name itf-t1-draw-0 --dir /tmp/courtwatch-four-originals/ltu
          gh run download 38935714222 --repo "$GITHUB_REPOSITORY" --name itf-t1-draw-1 --dir /tmp/courtwatch-four-originals/esp
      - name: Read D1 catalogues and the four exact documents without writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
        run: node tools/verify-d1-targeted-storage.mjs /tmp/courtwatch-four-originals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-d1-storage-proof
          path: dist/v3/audits/targeted-d1-storage.json
          if-no-files-found: warn
          retention-days: 30
