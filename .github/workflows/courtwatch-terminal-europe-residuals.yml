name: Court Watch terminal Europe residual inspection once
# Inspect biographies, public activity and the exact retained federation membership alias.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-terminal-europe-residuals.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: terminal-europe-residuals
          run-id: 38053975265
          github-token: ${{ github.token }}
          path: tmp/terminal-europe-residuals
      - run: node src/v3/inspect-terminal-europe-residuals.mjs
        env:
          DETAILS_ONLY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-europe-residuals
          path: tmp/terminal-europe-residuals/
          retention-days: 7
