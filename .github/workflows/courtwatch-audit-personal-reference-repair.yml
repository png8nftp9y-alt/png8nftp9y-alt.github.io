# D1_WRITE_POLICY: incremental; exact approved native evidence, zero-write replay.
name: Court Watch daily audit personal reference repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-audit-personal-reference-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact reference guards and retained legacy exclusion
        run: node --test test/audit-personal-reference-repair.test.mjs test/all-player-id-audit.test.mjs test/player-id-audit-scope.test.mjs
      - name: Repair only the previously approved native association
        run: node scripts/repair-audit-personal-reference.mjs
      - name: Verify complete native ID coverage
        run: node scripts/all-player-id-audit.mjs
      - name: Verify own-circuit coverage independently
        if: ${{ !cancelled() }}
        run: node scripts/per-circuit-player-id-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-personal-reference-repair
          path: cloudflare/app-api/tmp/audit-personal-reference.json
          retention-days: 30
