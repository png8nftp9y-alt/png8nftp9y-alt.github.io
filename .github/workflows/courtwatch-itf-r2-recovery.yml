name: Court Watch ITF R2 recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-itf-r2-recovery.yml'
      - 'src/v3/itf-r2-cache.sh'
permissions:
  contents: read
concurrency:
  group: courtwatch-v3-itf-publish
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install --quiet awscli
      - name: Inspect ITF pointers and archive counts without changing storage
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p /tmp/itf-r2-check
          aws --endpoint-url "$endpoint" s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix itf/database/pointers/ --query 'Contents[].{key:Key,size:Size,modified:LastModified}'
          for slot in current backup-1 backup-2; do
            pointer="/tmp/itf-r2-check/$slot.json"
            if ! aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/itf/database/pointers/$slot.json" "$pointer" --only-show-errors; then
              echo "READ FAILED: $slot"
              continue
            fi
            generation=$(jq -er .generation "$pointer")
            echo "POINTER $slot generation=$generation"
            for file in itf_participant_cache.json.gz itf_players_database.json.gz itf_results_database.json.gz; do
              dest="/tmp/itf-r2-check/$slot-$file"
              if aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/itf/database/generations/$generation/$file" "$dest" --only-show-errors; then
                gzip -cd "$dest" | jq -c --arg slot "$slot" --arg file "$file" '{slot:$slot,file:$file,generatedAt,status,participants:(.participants|length),players:(.players|length),matches:(.matches|length)}'
              fi
            done
          done
      - name: Recover retained acceptance cache without replacing newer tournament snapshots
        run: |
          set -euo pipefail
          bash src/v3/itf-r2-cache.sh restore
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/itf/database/generations/cb8dcf33c760fb7864fce61f0038dfd6cf4c598298ad1aaa63cec66285c35edf/itf_participant_cache.json.gz" /tmp/itf-cache-retained.gz --only-show-errors
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {gunzipSync,gzipSync} from 'node:zlib';
          const read=p=>JSON.parse(gunzipSync(fs.readFileSync(p)));
          const current=read('history/itf_participant_cache.json.gz');
          const retained=read('/tmp/itf-cache-retained.gz');
          if(retained.participants.length<30000)throw new Error('Retained acceptance generation unexpectedly incomplete');
          const existing=new Set(current.participants.map(p=>p.competitionId));
          const added=retained.participants.filter(p=>!existing.has(p.competitionId));
          fs.writeFileSync('history/itf_participant_cache.json.gz',gzipSync(JSON.stringify({...current,generatedAt:new Date().toISOString(),participants:[...current.participants,...added]})));
          console.log(JSON.stringify({current:current.participants.length,recovered:added.length,total:current.participants.length+added.length}));
          JS
          bash src/v3/itf-r2-cache.sh publish
      - name: Identify retained permanent archives
        run: |
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix itf/database/generations/ --output json > /tmp/itf-generations.json
          jq '[.Contents[] | select(.Key | endswith("itf_players_database.json.gz") or endswith("itf_results_database.json.gz"))] | sort_by(.Size) | reverse | .[:12] | map({Key,Size,LastModified})' /tmp/itf-generations.json
