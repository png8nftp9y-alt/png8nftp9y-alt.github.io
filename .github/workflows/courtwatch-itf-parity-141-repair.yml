name: Court Watch ITF repair 141 versions and verify 4892
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-itf-parity-141-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore original verified R2 source selection
        uses: actions/download-artifact@v4
        with:
          name: itf-resolved-863-r2-d1-parity
          run-id: 37696656152
          github-token: ${{ github.token }}
          path: /tmp/itf-original-audit
      - name: Restore exact 141 failures from completed D1 audit
        uses: actions/download-artifact@v4
        with:
          name: itf-resolved-863-d1-parity-resumed
          run-id: 37702531693
          github-token: ${{ github.token }}
          path: /tmp/itf-failed-audit
      - name: Freeze only original failed versions; keep two user exclusions
        run: node src/v3/repair-itf-parity-141.mjs prepare /tmp/itf-original-audit /tmp/itf-failed-audit
      - name: Download original pinned archive (no live manifest scan)
        run: |
          set -euo pipefail
          python -m pip install --quiet awscli boto3
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          generation="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/itf-manifest.json')).generation")"
          mkdir -p /tmp/itf-blocks /tmp/itf-draw-archive /tmp/itf-parity-repair-live
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/itf/history-draws/generations/$generation/blocks/" /tmp/itf-blocks --recursive --exclude "*" --include "*.tar.gz" --only-show-errors
          python3 src/v3/extract-itf-draw-archive.py
      - name: Fetch only exact target versions absent from pinned archive
        run: |
          node src/v3/repair-itf-parity-141.mjs missing-sources /tmp/itf-draw-archive
          python3 -u src/v3/download-itf-parity-repair-live.py
      - name: Locate existing D1 and install import CLI (no migrations)
        working-directory: cloudflare/app-api
        run: |
          npm install
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database?name=courtwatch-app&per_page=100`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const body=await response.json();if(!response.ok||body.success!==true)throw new Error('Cannot locate existing D1');
          const db=(body.result||[]).find(d=>d.name==='courtwatch-app');if(!db)throw new Error('Existing D1 not found');
          await fs.writeFile('wrangler.generated.jsonc',JSON.stringify({name:'courtwatch-app-api',compatibility_date:'2026-09-01',d1_databases:[{binding:'DB',database_name:'courtwatch-app',database_id:db.uuid||db.id}]}));
          JS
      - name: Diagnose existing versions and preflight all source hashes before writing
        run: node src/v3/repair-itf-parity-141.mjs stage /tmp/itf-draw-archive /tmp/itf-parity-repair-live
      - name: Insert only missing chunks and immutable versions (conflict DO NOTHING)
        working-directory: cloudflare/app-api
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(../../seed-itf-parity-repair/*.sql)
          for file in "${files[@]}"; do
            npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$file"
          done
      - name: Verify exact content of all 4892 documents after repair
        run: node src/v3/verify-itf-draw-documents-d1.mjs
      - name: Certify full frozen parity with two explicit exclusions
        run: node src/v3/prepare-itf-resolved-parity.mjs finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-141-repair-and-4892-parity
          path: dist/v3/audits/itf-*.json
          retention-days: 30
