name: Court Watch PUC import agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'puc-inbox/**/*.pdf'
      - puc-importer.mjs
      - .github/workflows/puc-import-agent.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: court-watch-puc-importer
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF parser
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Parse official orders of play
        run: |
          node --check puc-importer.mjs
          node puc-importer.mjs --inbox puc-inbox --data data.json --players players.json --alerts alerts.json | tee puc-import-agent.log
      - name: Remove processed binary files
        run: find puc-inbox -type f -iname '*.pdf' -delete 2>/dev/null || true
      - name: Save imported schedules
        run: |
          git config user.name 'courtwatch-importer'
          git config user.email 'courtwatch-importer@users.noreply.github.com'
          git add -A puc-inbox data.json alerts.json puc-import-agent.log
          if ! git diff --cached --quiet; then
            git commit -m 'Import P.U.C. order of play'
            git pull --rebase origin main
            git push
          fi
      - name: Publish new alerts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('alerts.json','utf8'));
          if(!a.notifications?.length) process.exit(0);
          fs.writeFileSync('/tmp/puc.md',['## 🎾 Orari importati dal P.U.C.','',...a.notifications.map(n=>`- **${n.playerName}** — ${n.message}`)].join('\n'));
          NODE
          if [ -s /tmp/puc.md ]; then gh issue comment 7 --body-file /tmp/puc.md; fi
