name: Court Watch acquired player search index
on:
  workflow_dispatch:
    inputs:
      repair_missing_profiles:
        description: 'Run the one-time missing official profile recovery'
        type: boolean
        default: false
      allow_bulk_identity_writes:
        description: 'Authorize more than 5000 identity record changes in this run'
        type: boolean
        default: false
  # Dispatched hourly at minute 17 by the existing Cloudflare watchdog.
permissions:
  contents: read
concurrency:
  group: courtwatch-acquired-search
  cancel-in-progress: false
  queue: single
jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check source outside the D1 writer queue
        run: |
          node --test test/courtwatch-acquired-player-search.test.mjs
          (cd cloudflare/app-api && node --test test/identity-review-queue.test.mjs test/acquired-player-index.test.mjs test/sync-acquired-player-search.test.mjs test/player-identity-mapping.test.mjs test/player-profile-evidence.test.mjs test/player-identity-write-budget.test.mjs test/player-native-profile-recovery.test.mjs test/europe-match-profile-recovery.test.mjs test/circuit-native-source-recovery.test.mjs test/sync-new-fitp-player-metadata.test.mjs)
  index:
    needs: check-source
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPAIR_MISSING_PROFILES: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_missing_profiles || false }}
      ALLOW_BULK_IDENTITY_WRITES: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_bulk_identity_writes || false }}
      # D1_WRITE_POLICY: incremental
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recheck source only when code advanced during the wait
        env:
          CHECKED_SHA: ${{ needs.check-source.outputs.source_sha }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "$CHECKED_SHA"
          if ! git diff --quiet "$CHECKED_SHA" HEAD -- cloudflare/app-api src/v3 tools/tests test .github/workflows; then
            node --test test/courtwatch-acquired-player-search.test.mjs
            (cd cloudflare/app-api && node --test test/identity-review-queue.test.mjs test/acquired-player-index.test.mjs test/sync-acquired-player-search.test.mjs test/player-identity-mapping.test.mjs test/player-profile-evidence.test.mjs test/player-identity-write-budget.test.mjs test/player-native-profile-recovery.test.mjs test/europe-match-profile-recovery.test.mjs test/circuit-native-source-recovery.test.mjs test/sync-new-fitp-player-metadata.test.mjs)
          fi
      - name: Configure database and apply additive migrations
        working-directory: cloudflare/app-api
        run: |
          npm install
          node scripts/configure-d1.mjs
          npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Index only unprocessed complete documents and changed matches
        working-directory: cloudflare/app-api
        run: node scripts/sync-acquired-player-search.mjs
      - name: Link acquired players to persistent circuit identities
        id: identity_mapping
        working-directory: cloudflare/app-api
        run: node scripts/sync-player-identities.mjs
      - name: Resolve missing Europe match IDs through their official tournament profiles
        working-directory: cloudflare/app-api
        run: node scripts/recover-europe-match-profiles.mjs
      - name: Resolve missing FITP and ITF IDs from original participant references
        if: ${{ !cancelled() && steps.identity_mapping.outcome == 'success' }}
        working-directory: cloudflare/app-api
        run: node scripts/recover-circuit-native-profiles.mjs
      - name: Acquire clubs and rankings for newly acquired FITP identities only
        if: ${{ !cancelled() && steps.identity_mapping.outcome == 'success' }}
        working-directory: cloudflare/app-api
        run: node scripts/sync-new-fitp-player-metadata.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acquired-player-search-sync
          path: |
            cloudflare/app-api/tmp/acquired-search-sync.json
            cloudflare/app-api/tmp/fitp-new-player-metadata.json
            cloudflare/app-api/tmp/player-identity-sync.json
            cloudflare/app-api/tmp/player-identity-d1-metrics.json
            cloudflare/app-api/tmp/player-profile-unresolved.json
            cloudflare/app-api/tmp/europe-match-profile-recovery.json
            cloudflare/app-api/tmp/circuit-native-profile-recovery.json
          retention-days: 30
