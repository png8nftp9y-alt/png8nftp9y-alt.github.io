name: Court Watch Tennis Europe OOP historical merge
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful backfill workflow run ID
        required: false
        default: '33324600811'
  workflow_run:
    workflows: ['Court Watch Tennis Europe OOP historical backfill']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-tennis-europe-oop-merge.yml'
permissions:
  actions: read
  contents: read
concurrency:
  group: courtwatch-tennis-europe-oop-merge
  cancel-in-progress: true
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve successful backfill run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "Upstream backfill did not succeed: $UPSTREAM_CONCLUSION" >&2
            exit 1
          fi
          source_run_id="$UPSTREAM_RUN_ID"
          if [ -z "$source_run_id" ]; then source_run_id="$REQUESTED_RUN_ID"; fi
          if [ -z "$source_run_id" ]; then
            source_run_id="$(gh run list --repo "${{ github.repository }}" --workflow courtwatch-tennis-europe-oop-backfill.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          test -n "$source_run_id"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
      - name: Configure private R2 historical archive
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "R2_BUCKET=$R2_BUCKET" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --quiet awscli
      - name: Download every validated backfill shard
        run: |
          mkdir -p dist/v3/downloaded-tennis-europe-oop
          gh run download "${{ steps.source.outputs.source_run_id }}" --repo "${{ github.repository }}" --dir dist/v3/downloaded-tennis-europe-oop --pattern 'tennis-europe-oop-backfill-*'
      - name: Merge and certify the complete historical archive
        env:
          TE_OOP_SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: node src/v3/merge-tennis-europe-oop-backfill.mjs
      - name: Publish verified historical generation to R2
        run: bash src/v3/tennis-europe-oop-history-r2.sh publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-europe-oop-historical-merged
          path: dist/v3/tennis_europe_oop_historical.json
          if-no-files-found: error
          retention-days: 14
