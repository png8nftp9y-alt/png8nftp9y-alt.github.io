name: Court Watch v3 FITP team detail endpoint probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/audit-fitp-team-detail-endpoints.mjs'
      - 'courtwatch-v3-fitp-team-detail-probe-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-team-detail-probe.yml'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-team-detail-probe,cancel-in-progress: true}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node src/v3/audit-fitp-team-detail-endpoints.mjs > courtwatch-v3-fitp-team-detail-probe-run.log 2>&1
          cat courtwatch-v3-fitp-team-detail-probe-run.log
      - if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_team_detail_endpoint_probe.json courtwatch-v3-fitp-team-detail-probe-run.log
          git commit -m "Build Court Watch v3 FITP team detail endpoint probe" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
