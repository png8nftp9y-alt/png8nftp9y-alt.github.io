name: Court Watch v3 entries merge only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/entries-engine.mjs'
      - 'courtwatch-v3-entries-merge-only-trigger.json'
      - '.github/workflows/courtwatch-v3-entries-merge-only.yml'
      - 'dist/v3/source_fitp_entries.json'
      - 'dist/v3/source_tennis_europe_entries.json'
      - 'dist/v3/source_itf_entries.json'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-entries-merge-only
  cancel-in-progress: true
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge existing v3 source entries
        run: |
          set +e
          : > courtwatch-v3-entries-merge-only-run.log
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-entries-merge-only-run.log
          echo "sourceSha=${GITHUB_SHA}" >> courtwatch-v3-entries-merge-only-run.log
          echo "runId=${GITHUB_RUN_ID}" >> courtwatch-v3-entries-merge-only-run.log
          node src/v3/entries-engine.mjs >> courtwatch-v3-entries-merge-only-run.log 2>&1
          code=$?
          echo "entriesMergeOnlyExit=$code" >> courtwatch-v3-entries-merge-only-run.log
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-entries-merge-only-run.log
          cat courtwatch-v3-entries-merge-only-run.log
          exit $code
      - name: Commit v3 merged entries output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/entries_fitp.json dist/v3/entries_tennis_europe.json dist/v3/entries_itf.json dist/v3/sync_status.json dist/v3/diagnostics.json dist/v3/entries_log.json courtwatch-v3-entries-merge-only-run.log .github/workflows/courtwatch-v3-entries-merge-only.yml
          git commit -m "Merge Court Watch v3 entries outputs" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
