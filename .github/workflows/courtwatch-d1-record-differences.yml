name: Court Watch 515 entries and two tournament field comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-d1-record-differences.yml'
      - 'tools/verify-d1-record-differences.mjs'
      - 'tools/tests/d1-record-differences.test.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: courtwatch-d1-record-differences-readonly
  cancel-in-progress: false
  queue: single
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tools/tests/d1-record-differences.test.mjs
      - name: Download the report identifying the exact 515 records
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39168670150 --repo "$GITHUB_REPOSITORY" --name github-d1-historical-reconciliation --dir /tmp/courtwatch-515-baseline
      - name: Compare current values without writing D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
        run: node tools/verify-d1-record-differences.mjs /tmp/courtwatch-515-baseline/github-d1-completeness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-record-field-differences
          path: dist/v3/audits/d1-record-differences.json
          if-no-files-found: warn
          retention-days: 30
