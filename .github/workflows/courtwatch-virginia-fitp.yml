name: Court Watch Virginia FITP only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['puc-virginia-fitp.mjs','.github/workflows/courtwatch-virginia-fitp.yml','players.json','courtwatch-virginia-fitp-trigger.json']
permissions: {contents: write}
concurrency: {group: court-watch-virginia-fitp,cancel-in-progress: true}
jobs:
  virginia-fitp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild Virginia Cereghini FITP tournaments only
        run: |
          set -e
          node puc-virginia-fitp.mjs | tee virginia-fitp.log
          node run-with-former.mjs courtwatch-finalize.mjs >> virginia-fitp.log 2>&1 || true
          node courtwatch-audit.mjs >> virginia-fitp.log 2>&1 || true
          node src/build-courtwatch-v2.mjs >> virginia-fitp.log 2>&1 || true
          node src/audit-courtwatch-v2.mjs >> virginia-fitp.log 2>&1 || true
      - name: Publish Virginia FITP data
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json virginia-fitp-discovery.json virginia-fitp.log courtwatch-data-audit.json dist/ || true
          git commit -m 'Rebuild Virginia Cereghini FITP tournaments' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
