name: Court Watch v3 ITF historical block summary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-v3-itf-history-block-summary.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: courtwatch-v3-itf-history-block-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download 00 from run 2 and 01-16 from run 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/v3/shards/itf/draw-tasks /tmp/itf-bundles
          : > /tmp/bundles.tsv
          for spec in "32901751658|itf-history-draw-bundle-00|1" "32901539830|itf-history-draw-bundle-|16"; do
            IFS='|' read -r source prefix expected <<< "$spec"
            for attempt in $(seq 1 90); do
              if gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${source}/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name | startswith(\"${prefix}\")) | [.id,.name] | @tsv" \
                > /tmp/source.tsv; then break; fi
              test "$attempt" -lt 90
              sleep 60
            done
            count=$(wc -l < /tmp/source.tsv)
            test "$count" -eq "$expected"
            cat /tmp/source.tsv >> /tmp/bundles.tsv
          done
          test "$(wc -l < /tmp/bundles.tsv)" -eq 17
          while IFS=$'\t' read -r id name; do
            ok=0
            for attempt in $(seq 1 90); do
              if gh api -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/itf-bundles/${id}.zip"; then
                ok=1
                break
              fi
              sleep 60
            done
            test "$ok" -eq 1
            unzip -q "/tmp/itf-bundles/${id}.zip" -d dist/v3/shards/itf/draw-tasks
          done < /tmp/bundles.tsv
      - name: Match players by block and deduplicate tournaments
        env:
          ITF_EXPECTED_TASKS: '4291'
        run: node src/v3/summarize-itf-history-blocks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-history-player-tournament-summary
          path: dist/v3/audits/itf-history-player-tournaments.json
          retention-days: 14
