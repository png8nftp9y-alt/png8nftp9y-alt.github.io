name: Court Watch v3 ITF historical block summary
on:
  workflow_run:
    workflows: ["Court Watch v3 ITF historical draws final merge"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  summarize:
    if: github.event.workflow_run.id == 32902770858
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download successful bundles 00-03
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32901751658
          pattern: 'itf-history-draw-bundle-0[0-3]'
          path: dist/v3/shards/itf/draw-tasks
          merge-multiple: true
      - name: Download serial bundles 04-16
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: 'itf-history-draw-bundle-*'
          path: dist/v3/shards/itf/draw-tasks
          merge-multiple: true
      - name: Match players per block and deduplicate tournaments
        env:
          ITF_EXPECTED_TASKS: '4291'
        run: node src/v3/summarize-itf-history-blocks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-history-player-tournament-summary
          path: dist/v3/audits/itf-history-player-tournaments.json
          retention-days: 14
