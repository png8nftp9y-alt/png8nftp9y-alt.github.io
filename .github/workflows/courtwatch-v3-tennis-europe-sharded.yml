name: Court Watch v3 Tennis Europe tournament map
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'src/v3/discover-tennis-europe-tournaments-shard.mjs'
      - 'src/v3/merge-tennis-europe-tournament-shards.mjs'
      - '.github/workflows/courtwatch-v3-tennis-europe-sharded.yml'
permissions:
  contents: write
concurrency:
  group: courtwatch-v3-tennis-europe-map
  cancel-in-progress: false
jobs:
  tournament-shards:
    name: Tournament shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [core, west, east, north]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: TE_SHARD=${{ matrix.shard }} node src/v3/discover-tennis-europe-tournaments-shard.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: te-tournaments-${{ matrix.shard }}
          path: dist/v3/shards/tennis-europe/tournaments-${{ matrix.shard }}.json
  publish-map:
    runs-on: ubuntu-latest
    needs: tournament-shards
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          path: dist/v3/shards/tennis-europe
          merge-multiple: true
      - name: Merge and validate complete map
        run: node src/v3/merge-tennis-europe-tournament-shards.mjs
      - name: Publish atomically, preserving last known good
        run: |
          set -euo pipefail
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          cp dist/v3/source_tennis_europe_tournaments_sharded.json /tmp/te-map.json
          cp dist/v3/source_tennis_europe_tournaments_sharded_audit.json /tmp/te-map-audit.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/te-map.json dist/v3/source_tennis_europe_tournaments_sharded.json
            cp /tmp/te-map-audit.json dist/v3/source_tennis_europe_tournaments_sharded_audit.json
            git add dist/v3/source_tennis_europe_tournaments_sharded.json dist/v3/source_tennis_europe_tournaments_sharded_audit.json
            git commit -m 'Publish validated Tennis Europe tournament map' || exit 0
            git push origin HEAD:main && exit 0
          done
          exit 1
