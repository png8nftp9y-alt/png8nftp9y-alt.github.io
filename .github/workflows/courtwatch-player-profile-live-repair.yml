name: Court Watch targeted official player profile recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-player-profile-live-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # D1_WRITE_POLICY: incremental; explicitly authorized historical delta repair.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloudflare/app-api
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify native evidence and retained-source delta guards
        run: node --test test/repair-live-player-profiles.test.mjs test/courtwatch-player-profile-live-repair.test.mjs
      - name: Configure database
        run: |
          npm install
          node scripts/configure-d1.mjs
      - name: Apply verified profile evidence and inspect official directory
        run: node scripts/repair-live-player-profiles.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-player-profile-recovery
          path: cloudflare/app-api/tmp/live-profile-recovery/
          retention-days: 30
