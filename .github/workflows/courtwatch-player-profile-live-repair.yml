name: Court Watch targeted official player profile recovery
# Recover from the verified current acceptance cache, including blank native profile icons.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-player-profile-live-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # D1_WRITE_POLICY: incremental; explicitly authorized historical delta repair.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    defaults:
      run:
        working-directory: cloudflare/app-api
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify native evidence and retained-source delta guards
        run: node --test test/repair-live-player-profiles.test.mjs test/courtwatch-player-profile-live-repair.test.mjs test/native-acceptance-profile-evidence.test.mjs
      - name: Configure database
        run: |
          npm install
          node scripts/configure-d1.mjs
      - name: Read verified current Tennis Europe native acceptance IDs
        run: |
          set -euo pipefail
          mkdir -p tmp/native-acceptance
          npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/pointers/current.json" --remote --config wrangler.generated.jsonc --file tmp/native-acceptance/pointer.json
          generation=$(jq -er .generation tmp/native-acceptance/pointer.json)
          [[ "$generation" =~ ^[a-f0-9]{64}$ ]]
          npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/generations/$generation/tennis_europe_participant_cache.json.gz" --remote --config wrangler.generated.jsonc --file tmp/native-acceptance/cache.json.gz
          test "$(sha256sum tmp/native-acceptance/cache.json.gz | cut -d' ' -f1)" = "$(jq -er .files.participantCache.sha256 tmp/native-acceptance/pointer.json)"
          gzip -t tmp/native-acceptance/cache.json.gz
          echo "TE_NATIVE_ACCEPTANCE_CACHE=tmp/native-acceptance/cache.json.gz" >> "$GITHUB_ENV"
      - name: Apply verified profile evidence and inspect official directory
        run: node scripts/repair-live-player-profiles.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-player-profile-recovery
          path: cloudflare/app-api/tmp/live-profile-recovery/
          retention-days: 30
      - name: Continue verified residual recovery from this job
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../../src/v3/continue-profile-recovery.mjs
