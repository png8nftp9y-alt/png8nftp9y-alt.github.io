          const counts={multiple:0,single:0,withoutCategory:0,notReturned:0};
          for(const id of ids){
            const row=byId.get(id), grades=(row?.tournamentCategory||'').split(' / ').filter(Boolean);
            const status=!row?'notReturned':grades.length>1?'multiple':grades.length?'single':'withoutCategory';
            counts[status]++;
            console.log('TE_CATEGORY_CASE '+JSON.stringify({id,status,grades}));
          }
          console.log('TE_CATEGORY_AUDIT '+JSON.stringify({from:FROM,until:UNTIL,...counts}));
          ''')
          PY
          node src/v3/discover-tennis-europe-tournaments-shard.mjs
