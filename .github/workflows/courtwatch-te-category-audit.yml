name: CourtWatch Tennis Europe missing categories audit
on:
  push:
    branches: [codex/te-official-category-patch]
    paths: [.github/workflows/courtwatch-te-category-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f21b634ee5bdaa19aa73270bf3c22960fe137c4f
          fetch-depth: 1
      - name: Inspect official search cards for the 80 historical IDs
        env:
          TE_HORIZON_DAYS: '0'
          TE_CATEGORY_BACKFILL: 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/v3/tennis-europe-metadata.mjs')
          s = p.read_text()
          old = 'if (unique.length === 1) categories.set(id, unique[0]);'
          assert s.count(old) == 1
          p.write_text(s.replace(old, "if (unique.length) categories.set(id, unique.join(' / '));"))
          p = Path('src/v3/discover-tennis-europe-tournaments-shard.mjs')
          s = p.read_text()
          old = "SHARDS=['core','west','east','north']"
          assert s.count(old) == 1
          s = s.replace(old, "SHARDS=['core']")
          cutoff = 'const discovered=[...byId.values()]'
          assert s.count(cutoff) == 1
          p.write_text(s.split(cutoff)[0] + '''
          if(errors.length)throw Error(JSON.stringify(errors));
          const ids=["7C8760FE-AA24-4A52-8E2F-605A342AA4E3","994FCDE2-399F-4B5B-BFD6-360716402E21","3219E342-A60B-4790-ABAE-401A3FF19F15","C8D81527-B88C-440B-B22C-EEAA1F0038A7","798A8F48-2A4A-458D-832A-5F757AF991B5","D98FE01C-0879-43EB-94FD-19825856DD47","9E5DDBEE-B771-48BA-AB2C-B014192369B4","B21A651F-02C9-4B37-BBD2-BC4C6B1BFB9F","73E37325-FF54-4539-8503-7B985AE89B35","4FB67506-AD46-4BC2-B2E8-53F1426320A0","C6A80E34-4404-428C-9D3A-C8A81562BD1B","A3A69866-5375-490F-A5CD-9888987AC39C","E4341794-05EF-4BCF-9E8D-29A9F1FD29D4","189CA599-1009-45F0-984F-D213436A2E9A","51086132-9B22-4627-A321-18196AE205E2","DBC14FEB-D941-46DA-8391-8E1E33BD5BD2","B1B32533-F65D-45B7-9B82-A0A4AA4D9985","26E87C9D-E1D9-4541-B184-9A32A40339A3","813A2EBF-2DA8-45BA-8A9D-52CC339AB549","DC72AFCC-803F-4ED7-B712-3FBCB040FF92","70122FAA-9110-4D1A-9B95-944ED70A6E13","4B2C9AED-7B71-43F6-A276-339B92BF6E6C","709A8036-D907-4164-AF69-E704610B688D","37BD4933-AA50-43D0-A97B-B185EA503A94","344D25FC-69D5-4F29-B919-41DC410E60CB","1DE1B7EE-ED53-4BAF-AC84-DD3336C9F1B7","E6C27FE1-A487-440E-9C38-AE8717B4FDE5","DA0ADDCF-CCC0-4437-A7AF-4BD7A4196244","8CDCBCE4-422E-4F5F-A75B-8798C70F6A0F","542FE35B-319C-407F-B98B-A695FC337382","E1BD6598-4954-4F46-9494-1FF453BAA3B7","4120A62D-908D-4D9A-ACEF-EBD0E59B41C2","422BCB8C-525F-4CE0-A798-C833EEF6FD8F","4F8DB737-D813-473C-BC8D-6C8AA2628B33","0D036290-EB46-4468-BBDE-83930797F3F2","7E0C1C78-EBE2-4199-A638-3A7274D47D73","E371BB26-50B1-461C-9ADF-A147ADBE272E","3C0AF834-73F8-43FF-9CEF-388CB15B3084","B31780CF-F2DC-4FB6-9F76-CE85C56A8D40","89D9BFC6-49CB-4F95-9D97-4BC32F6959E4","A2A5CA48-FC12-4D20-B49B-8A4B197F3E8B","F0710E94-D403-4F2C-9653-859483F38683","F3FB64C2-0BB4-40B1-B86E-215E9C8CDF4D","3CEEA31D-DDF9-4F34-B3F1-7F241A77F441","CC8BCD25-EB39-418B-A352-5AF24DB68B05","FB2EB43B-864C-43F6-918A-D23C00FDB65E","72B85BEB-F56D-48F3-AA67-88C1F293C970","24A98317-DA1A-495A-8932-850DC18287C3","B4D4F4FD-12F3-4AF2-8B8C-060B2A52DB4B","82725C50-9513-4F09-BC75-D78290A62F38","16831B48-A822-40D5-A543-2808