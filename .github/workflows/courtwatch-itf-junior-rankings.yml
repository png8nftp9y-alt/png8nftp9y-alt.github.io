# D1_WRITE_POLICY: incremental
name: Court Watch ITF Junior rankings
on:
  workflow_dispatch:
    inputs:
      force:
        description: Reacquire both categories even if already complete
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-itf-junior-rankings.yml'
      - 'cloudflare/app-api/lib/itf-junior-*.mjs'
      - 'cloudflare/app-api/lib/itf-junior-ranking-schema.sql'
      - 'cloudflare/app-api/test/itf-junior-recovery.test.mjs'
      - 'cloudflare/app-api/scripts/*itf-junior*.mjs'
      - 'infra/itf-acquirer/junior-ranking.mjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: courtwatch-itf-junior-rankings
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.plan.outputs.due }}
      pending: ${{ steps.plan.outputs.pending }}
      categories: ${{ steps.plan.outputs.categories }}
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      ITF_FORCE: ${{ inputs.force || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        working-directory: cloudflare/app-api
        run: node scripts/plan-itf-junior-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.due == 'true'
        with:
          name: itf-junior-plan
          path: cloudflare/app-api/itf-junior-work/plan.json
          retention-days: 7
  check-source:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: cloudflare/app-api
        run: |
          node --test test/itf-junior-recovery.test.mjs
          npm run check
  release-safety:
    needs: [plan, check-source]
    uses: ./.github/workflows/courtwatch-release-safety.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  acquire:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.plan.outputs.categories) }}
    env:
      ITF_CATEGORY: ${{ matrix.category }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: itf-junior-plan
          path: cloudflare/app-api/itf-junior-work
      - working-directory: cloudflare/app-api
        run: node scripts/acquire-itf-junior-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-junior-acquired-${{ matrix.category }}
          path: cloudflare/app-api/itf-junior-work/${{ matrix.category }}.json
          retention-days: 90
  publish:
    needs: [plan, acquire, release-safety]
    if: always() && !cancelled() && needs.plan.outputs.due == 'true' && needs.release-safety.result == 'success'
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: {working-directory: cloudflare/app-api}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require checked code before writes
        working-directory: .
        run: node tools/ensure-release-safety.mjs --expect "${{ needs.release-safety.outputs.code_fingerprint }}"
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - uses: actions/download-artifact@v4
        with:
          name: itf-junior-plan
          path: cloudflare/app-api/itf-junior-work
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: itf-junior-acquired-*
          merge-multiple: true
          path: cloudflare/app-api/itf-junior-work
      - name: Initialize versioned archive and recovery checkpoints
        run: npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file lib/itf-junior-ranking-schema.sql
      - name: Publish valid categories and retain failed recovery work
        run: node scripts/publish-itf-junior-recovery.mjs
  pending-status:
    needs: plan
    if: needs.plan.outputs.due != 'true' && needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep missing acquisition explicit during cooldown
        run: |
          echo '::error::ITF Junior recovery remains pending; the next eligible hourly slot will retry it.'
          exit 1
