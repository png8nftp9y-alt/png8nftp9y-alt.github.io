name: Court Watch acceptance player profiles
on:
  workflow_run:
    workflows:
      - Court Watch v3 FITP player entries
      - Court Watch v3 Tennis Europe live entries
      - Court Watch v3 ITF acceptance discovery 42d
      - Court Watch v3 ITF known labels fast
      - Court Watch v3 ITF acceptance safety 120d
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  profiles:
    # A verified R2 pointer can be published before a later Git step fails.
    # Reading current is safe on failed/no-op runs too; unchanged lists write nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      # D1_WRITE_POLICY: incremental
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify incremental acceptance registration
        run: node --test test/sync-acceptance-player-profiles.test.mjs test/courtwatch-acceptance-player-profiles.test.mjs
      - name: Configure D1
        run: |
          npm install
          node scripts/configure-d1.mjs
          npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Read the latest published acceptance cache for this circuit
        run: |
          set -euo pipefail
          case "$SOURCE_WORKFLOW" in
            *FITP*) circuit=fitp; prefix=fitp/cache; file=fitp_participant_cache.json.gz ;;
            *Europe*) circuit=tennis-europe; prefix=tennis-europe/cache; file=tennis_europe_participant_cache.json.gz ;;
            *ITF*) circuit=itf; prefix=itf/database; file=itf_participant_cache.json.gz ;;
            *) exit 1 ;;
          esac
          mkdir -p tmp/acceptance
          npx wrangler r2 object get "$R2_BUCKET/$prefix/pointers/current.json" --remote --config wrangler.generated.jsonc --file tmp/acceptance/pointer.json
          generation=$(jq -er .generation tmp/acceptance/pointer.json)
          npx wrangler r2 object get "$R2_BUCKET/$prefix/generations/$generation/$file" --remote --config wrangler.generated.jsonc --file "tmp/acceptance/$file"
          gzip -t "tmp/acceptance/$file"
          echo "ACCEPTANCE_CIRCUIT=$circuit" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_CACHE_FILE=tmp/acceptance/$file" >> "$GITHUB_ENV"
      - name: Register changed acceptance players and associate app profiles
        run: node scripts/sync-acceptance-player-profiles.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-player-profiles
          path: cloudflare/app-api/tmp/acceptance-player-profiles.json
          retention-days: 30
