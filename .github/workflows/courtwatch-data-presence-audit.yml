name: CourtWatch data presence audit (read only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-data-presence-audit.yml'
      - 'tools/cw_data_audit.py'
      - 'tools/tests/test_cw_data_audit.py'
      - 'tools/cw_data_audit_requirements.txt'
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, d1, r2]
        default: all
        description: 'Audit scope; no FITP requests'
      resume_run_id:
        type: string
        default: ''
        description: 'Optional previous audit run ID for manual R2 continuation'
      minutes:
        type: string
        default: '300'
        description: 'Per-scope budget, 1..315 minutes; gaps are reported'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet -r tools/cw_data_audit_requirements.txt
      - run: python -m unittest discover -s tools/tests -p 'test_cw_data_audit.py'
  audit:
    concurrency:
      group: courtwatch-data-presence-audit-${{ matrix.scope }}
      cancel-in-progress: false
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scope: ${{ fromJSON(github.event_name == 'push' && '["d1"]' || inputs.scope == 'd1' && '["d1"]' || inputs.scope == 'r2' && '["r2"]' || '["d1","r2"]') }}
    env:
      AUDIT_SCOPE: ${{ matrix.scope }}
      AUDIT_MINUTES: ${{ inputs.minutes || '300' }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ matrix.scope == 'd1' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      R2_ACCOUNT_ID: ${{ matrix.scope != 'github' && secrets.R2_ACCOUNT_ID || '' }}
      R2_BUCKET: ${{ matrix.scope == 'r2' && secrets.R2_BUCKET || '' }}
      AWS_ACCESS_KEY_ID: ${{ matrix.scope == 'r2' && secrets.R2_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ matrix.scope == 'r2' && secrets.R2_SECRET_ACCESS_KEY || '' }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet -r tools/cw_data_audit_requirements.txt
      - name: Audit retained data without source requests
        run: >-
          python tools/cw_data_audit.py --scope "$AUDIT_SCOPE"
          --output "audit-public/$AUDIT_SCOPE"
          --minutes "$AUDIT_MINUTES" --resume-run "$RESUME_RUN_ID"
      - name: Save aggregate report and manual continuation checkpoint only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw-presence-${{ matrix.scope }}
          path: |
            audit-public/${{ matrix.scope }}/report.json
            audit-public/${{ matrix.scope }}/checkpoint.json
          if-no-files-found: error
          retention-days: 30
