name: Court Watch global D1 incremental policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.sh'
      - '**/*.py'
      - '**/*.sql'
      - '**/*.yml'
      - '**/*.yaml'
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.sh'
      - '**/*.py'
      - '**/*.sql'
      - '**/*.yml'
      - '**/*.yaml'

permissions:
  contents: read

concurrency:
  group: courtwatch-global-d1-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-new-d1-features:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify global incremental D1 policy
        run: |
          node --test cloudflare/app-api/test/d1-incremental-sync.test.mjs
          node cloudflare/app-api/scripts/verify-d1-new-feature-policy.mjs
