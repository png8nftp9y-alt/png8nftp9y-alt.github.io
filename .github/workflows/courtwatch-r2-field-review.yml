name: CourtWatch R2 three-object field review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-r2-field-review.yml'
      - 'tools/cw_r2_field_review.py'
      - 'tools/tests/test_cw_r2_field_review.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: courtwatch-r2-three-object-field-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet -r tools/cw_data_audit_requirements.txt
      - run: python -m unittest discover -s tools/tests -p 'test_cw_r2_field_review.py'
      - name: Read only the three existing candidate objects
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python tools/cw_r2_field_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cw-three-object-field-review
          path: field-review-public/report.json
          if-no-files-found: error
          retention-days: 14
