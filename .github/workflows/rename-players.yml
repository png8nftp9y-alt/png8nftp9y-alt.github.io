name: Apply corrected player names
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [rename-players.mjs, .github/workflows/rename-players.yml]
permissions: {contents: write}
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node rename-players.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add players.json data.json
          if ! git diff --cached --quiet; then git commit -m 'Apply corrected player names'; git pull --rebase origin main; git push; fi
