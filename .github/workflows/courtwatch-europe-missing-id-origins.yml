name: Court Watch Europe missing ID origins
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-europe-missing-id-origins.yml', 'cloudflare/app-api/lib/europe-missing-id-origins.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify read-only provenance audit
        run: node --test test/europe-missing-id-origins.test.mjs
      - name: Explain missing Europe IDs without changing D1
        run: node scripts/europe-missing-id-origins.mjs
