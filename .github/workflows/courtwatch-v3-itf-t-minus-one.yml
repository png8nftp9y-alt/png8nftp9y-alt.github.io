name: Court Watch v3 ITF T-1 complete draws
on:
  workflow_dispatch:
    inputs:
      competition_id:
        description: Optional comma-separated pending competition IDs
        required: false
        type: string
  schedule:
    - cron: '0,15,30,45 * * * *'
  push:
    branches: [main]
    paths: ['players.json','former-players.json','dist/v3/source_itf_tournaments.json','src/v3/itf-common.mjs','src/v3/itf-known-unused-draws.mjs','src/v3/gate-itf-t1-run.mjs','src/v3/build-itf-t1-tournament-matrix.mjs','src/v3/build-itf-t1-draw-batch.mjs','src/v3/inventory-itf-history-tournament.mjs','src/v3/acquire-itf-history-draw-task.mjs','src/v3/merge-itf-t1-history-method.mjs','.github/workflows/courtwatch-v3-itf-known-fast.yml','.github/workflows/courtwatch-v3-itf-live.yml','.github/workflows/courtwatch-v3-itf-safety-120d.yml','.github/workflows/courtwatch-v3-itf-t-minus-one.yml']
permissions: {contents: write}
concurrency: {group: courtwatch-v3-itf-t-minus-one,cancel-in-progress: false}
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: select
        name: Select up to eight pending or newly due tournaments
        env:
          ITF_T1_TOURNAMENT_BATCH: 8
          ITF_T1_COMPETITION_IDS: ${{ inputs.competition_id || '' }}
        run: node src/v3/build-itf-t1-tournament-matrix.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t1-tournament-batch
          path: dist/v3/itf_t1_tournament_batch.json
          retention-days: 14
  inventory:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inventory one tournament exactly as history
        if: matrix.skip != true
        continue-on-error: true
        env:
          ITF_COMPETITION_ID: ${{ matrix.competitionId }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 1800
        run: node src/v3/inventory-itf-history-tournament.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true
        with:
          name: itf-t1-inventory-${{ matrix.index }}
          path: dist/v3/shards/itf/inventory/*.json
          if-no-files-found: error
          retention-days: 7
  queue:
    needs: [select, inventory]
    if: always() && needs.select.outputs.selected != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      tasks: ${{ steps.queue.outputs.tasks }}
      tournaments: ${{ steps.queue.outputs.tournaments }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'itf-t1-inventory-*', path: dist/v3/shards/itf/inventory, merge-multiple: true}
      - id: queue
        run: node src/v3/build-itf-t1-draw-batch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t1-draw-batch
          path: |
            dist/v3/itf_t1_draw_batch.json
            dist/v3/shards/itf/t1-inventory/*.json
          if-no-files-found: error
          retention-days: 14
  acquire:
    needs: queue
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.queue.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Acquire exactly one missing draw with the historical engine
        if: matrix.skip != true
        continue-on-error: true
        env:
          ITF_DRAW_TASK_B64: ${{ matrix.task }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUIRE_POPULATED_DRAW: 1
        run: |
          export ITF_DRAW_TASK_JSON="$(printf '%s' "$ITF_DRAW_TASK_B64" | base64 --decode)"
          node src/v3/acquire-itf-history-draw-task.mjs
      - id: upload_draw
        continue-on-error: true
        uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true
        with:
          name: itf-t1-draw-${{ matrix.index }}
          path: dist/v3/shards/itf/draw-tasks/*.json.gz
          if-no-files-found: error
          retention-days: 7
      - name: Retry transient artifact upload
        uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true && steps.upload_draw.outcome == 'failure'
        with:
          name: itf-t1-draw-retry-${{ matrix.index }}
          path: dist/v3/shards/itf/draw-tasks/*.json.gz
          if-no-files-found: error
          retention-days: 7
  review:
    needs: [queue, acquire]
    if: always() && needs.queue.outputs.tournaments != '0'
    concurrency: {group: courtwatch-v3-itf-publish,cancel-in-progress: false}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: 'itf-t1-draw-batch', path: dist/v3}
      - uses: actions/download-artifact@v4
        if: needs.queue.outputs.tasks != '0'
        with: {pattern: 'itf-t1-draw-*', path: draw-tasks, merge-multiple: true}
      - name: Configure R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" >> "$GITHUB_ENV"; echo "R2_BUCKET=$R2_BUCKET" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"; echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"; echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          python -m pip install --quiet awscli
          bash src/v3/itf-r2-cache.sh restore
      - name: Merge isolated acquisitions and validate decisions
        run: |
          set -euo pipefail
          mkdir -p dist/v3/audits/itf-t1-batch
          for inventory in dist/v3/shards/itf/t1-inventory/*.json; do
            cp "$inventory" dist/v3/itf_t1_section_inventory.json
            node src/v3/merge-itf-t1-history-method.mjs
            id="$(jq -r .competitionId "$inventory")"
            cp dist/v3/source_itf_draw_audit.json "dist/v3/audits/itf-t1-batch/$id.json"
          done
          node src/v3/maintain-itf-database.mjs
          node src/v3/validate-itf-system.mjs
          node src/v3/entries-engine.mjs
      - name: Publish changed database generation to R2
        run: bash src/v3/itf-r2-cache.sh publish
      - name: Commit validated T-1 decisions and map
        run: |
          set -euo pipefail
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          snapshot=/tmp/courtwatch-itf-publish
          rm -rf "$snapshot"; mkdir -p "$snapshot"
          files=("dist/v3/source_itf_entries.json" "dist/v3/source_itf_draw_audit.json" "dist/v3/itf_system_diagnostics.json" "history/itf_draw_target_db.json" "history/itf_player_tournament_db.json" "history/itf_database_audit.json")
          for file in "${files[@]}"; do test -f "$file" || continue; mkdir -p "$snapshot/$(dirname "$file")"; cp "$file" "$snapshot/$file"; done
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            cp history/itf_draw_target_db.json /tmp/itf-current-state.json
            cp "$snapshot/history/itf_draw_target_db.json" /tmp/itf-incoming-state.json
            cp -R "$snapshot"/* ./
            node src/v3/merge-itf-draw-target-ownership.mjs t-minus-one /tmp/itf-current-state.json /tmp/itf-incoming-state.json history/itf_draw_target_db.json
            node src/v3/entries-engine.mjs
            git add dist/v3/source_itf_entries.json dist/v3/source_itf_draw_audit.json dist/v3/itf_system_diagnostics.json history/itf_draw_target_db.json history/itf_player_tournament_db.json history/itf_database_audit.json dist/v3/entries_itf.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/sync_status.json dist/v3/diagnostics.json dist/v3/entries_log.json
            if git diff --cached --quiet; then echo "No validated ITF T-1 changes"; exit 0; fi
            git commit -m "Publish validated ITF T-1 decisions"
            git push origin HEAD:main && exit 0
          done
          exit 1
      - name: Gate the complete run after preserving successful draws
        run: node src/v3/gate-itf-t1-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-t-minus-one-validated
          path: |
            dist/v3/source_itf_draw_audit.json
            dist/v3/audits/itf-t1-batch/*.json
            dist/v3/itf_system_diagnostics.json
            dist/v3/itf_t1_run_gate.json
            history/itf_database_audit.json
          retention-days: 14
