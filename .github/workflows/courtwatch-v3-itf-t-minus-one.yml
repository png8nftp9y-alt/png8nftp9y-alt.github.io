# Manual verification trigger: recover final persisted technical pending
name: Court Watch v3 ITF T-1 complete draws
run-name: ITF T-1 ${{ inputs.chain_lane || 'ordinary' }}
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      chain_lane:
        description: ordinary, extraordinary-a or extraordinary-b
        required: false
        type: string
        default: ordinary
      ordinary_previous_ids:
        description: Ordinary tournament IDs already attempted in this cycle
        required: false
        type: string
        default: ''
      competition_id:
        description: Optional comma-separated pending competition IDs
        required: false
        type: string
      extraordinary_chain:
        description: Continue the bounded extraordinary chain after success
        required: false
        type: boolean
        default: false
      extraordinary_remaining:
        description: Remaining extraordinary batches allowed
        required: false
        type: string
        default: '0'
      extraordinary_previous_ids:
        description: IDs processed by this extraordinary batch
        required: false
        type: string
        default: ''

permissions: {contents: write, actions: write}
concurrency:
  group: courtwatch-v3-itf-t-minus-one-${{ inputs.chain_lane || 'ordinary' }}
  cancel-in-progress: false
  queue: max
jobs:
  select:
    if: ${{ vars.ITF_T1_COVERAGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
      next_previous_ids: ${{ steps.select.outputs.next_previous_ids }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore the authoritative coverage audit
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --quiet awscli
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" /tmp/itf-audit-state.json --only-show-errors
          node src/v3/synchronize-itf-coverage-catalog.mjs /tmp/itf-audit-state.json
          echo "ITF_AUDIT_STATE_FILE=/tmp/itf-audit-state.json" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t1-coverage-input
          path: /tmp/itf-audit-state.json
          retention-days: 7
      - id: select
        name: Select up to eight pending or newly due tournaments
        env:
          ITF_T1_TOURNAMENT_BATCH: 8
          ITF_T1_COMPETITION_IDS: ${{ inputs.competition_id || '' }}
          ITF_EXCLUDE_IDS: ${{ (inputs.chain_lane == 'ordinary' || inputs.chain_lane == '') && inputs.ordinary_previous_ids || '' }}
        run: node src/v3/build-itf-t1-tournament-matrix.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t1-tournament-batch
          path: dist/v3/itf_t1_tournament_batch.json
          retention-days: 14
  inventory:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        if: matrix.skip != true
        with: {name: itf-t1-coverage-input, path: /tmp}
      - name: Inventory one tournament exactly as history
        if: matrix.skip != true
        continue-on-error: true
        env:
          ITF_AUDIT_STATE_FILE: /tmp/itf-audit-state.json
          ITF_COMPETITION_ID: ${{ matrix.competitionId }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 1800
          ITF_ACQUISITION_URL: ${{ secrets.ITF_ACQUISITION_URL }}
          ITF_ACQUIRER_TOKEN: ${{ secrets.ITF_ACQUIRER_TOKEN }}
        run: node src/v3/inventory-itf-history-tournament.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true
        with:
          name: itf-t1-inventory-${{ matrix.index }}
          path: dist/v3/shards/itf/inventory/*.json
          if-no-files-found: error
          retention-days: 7
  queue:
    needs: [select, inventory]
    if: always() && needs.select.result == 'success' && needs.select.outputs.selected != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      tasks: ${{ steps.queue.outputs.tasks }}
      tournaments: ${{ steps.queue.outputs.tournaments }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'itf-t1-inventory-*', path: dist/v3/shards/itf/inventory, merge-multiple: true}
      - name: Restore coverage missing-draw audit
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null || python -m pip install --quiet awscli
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" /tmp/itf-audit-state.json --only-show-errors
          node src/v3/synchronize-itf-coverage-catalog.mjs /tmp/itf-audit-state.json
      - id: queue
        env:
          ITF_AUDIT_STATE_FILE: /tmp/itf-audit-state.json
        run: node src/v3/build-itf-t1-draw-batch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t1-draw-batch
          path: |
            dist/v3/itf_t1_draw_batch.json
            dist/v3/shards/itf/t1-inventory/*.json
          if-no-files-found: error
          retention-days: 14
  acquire:
    needs: queue
    if: always() && needs.queue.result == 'success' && needs.queue.outputs.tasks != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.queue.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Acquire all missing draws for one tournament in one session
        if: matrix.skip != true
        continue-on-error: true
        env:
          ITF_DRAW_TASK_B64: ${{ matrix.task }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 1800
          ITF_REQUIRE_POPULATED_DRAW: 1
          ITF_ACQUISITION_URL: ${{ secrets.ITF_ACQUISITION_URL }}
          ITF_ACQUIRER_TOKEN: ${{ secrets.ITF_ACQUIRER_TOKEN }}
        run: |
          export ITF_TOURNAMENT_TASKS_JSON="$(printf '%s' "$ITF_DRAW_TASK_B64" | base64 --decode)"
          node src/v3/acquire-itf-history-tournament-tasks.mjs
      - id: upload_draw
        continue-on-error: true
        uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true
        with:
          name: itf-t1-draw-${{ matrix.index }}
          path: dist/v3/shards/itf/draw-tasks/*.json.gz
          if-no-files-found: error
          retention-days: 7
      - name: Retry transient artifact upload
        uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true && steps.upload_draw.outcome == 'failure'
        with:
          name: itf-t1-draw-retry-${{ matrix.index }}
          path: dist/v3/shards/itf/draw-tasks/*.json.gz
          if-no-files-found: error
          retention-days: 7
  review:
    needs: [queue, acquire]
    if: always() && needs.queue.result == 'success' && needs.queue.outputs.tournaments != '0'
    concurrency: {group: courtwatch-v3-itf-publish,cancel-in-progress: false,queue: max}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: 'itf-t1-draw-batch', path: dist/v3}
      - uses: actions/download-artifact@v4
        if: needs.queue.outputs.tasks != '0'
        with: {pattern: 'itf-t1-draw-*', path: draw-tasks, merge-multiple: true}
      - name: Configure R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" >> "$GITHUB_ENV"; echo "R2_BUCKET=$R2_BUCKET" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"; echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"; echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          python -m pip install --quiet awscli
          bash src/v3/itf-r2-cache.sh restore
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" /tmp/itf-audit-state.json --only-show-errors
          node src/v3/synchronize-itf-coverage-catalog.mjs /tmp/itf-audit-state.json
          echo "ITF_AUDIT_STATE_FILE=/tmp/itf-audit-state.json" >> "$GITHUB_ENV"
      - name: Persist complete draw documents to R2 and project incremental D1 rows
        if: needs.queue.outputs.tasks != '0'
        run: |
          set -euo pipefail
          node src/v3/persist-itf-t1-draws.mjs draw-tasks
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 sync dist/v3/itf-t1-r2-stage "s3://$R2_BUCKET/itf/live-draws" --size-only --only-show-errors
      - name: Merge isolated acquisitions and validate decisions
        run: |
          set -euo pipefail
          mkdir -p dist/v3/audits/itf-t1-batch
          for inventory in dist/v3/shards/itf/t1-inventory/*.json; do
            cp "$inventory" dist/v3/itf_t1_section_inventory.json
            node src/v3/merge-itf-t1-history-method.mjs
            id="$(jq -r .competitionId "$inventory")"
            cp dist/v3/source_itf_draw_audit.json "dist/v3/audits/itf-t1-batch/$id.json"
          done
          node src/v3/maintain-itf-database.mjs
          node src/v3/validate-itf-system.mjs
          node src/v3/entries-engine.mjs
          node src/v3/reconcile-itf-t1-strict-audit.mjs /tmp/itf-audit-state.json draw-tasks /tmp/itf-audit-state.json
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 cp /tmp/itf-audit-state.json "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" --only-show-errors
          node src/v3/build-itf-t1-extraordinary-batch.mjs
          node src/v3/build-itf-t1-admin-status.mjs
      - name: Publish changed database generation to R2
        run: bash src/v3/itf-r2-cache.sh publish
      - name: Commit validated T-1 decisions and map
        run: |
          set -euo pipefail
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          snapshot=/tmp/courtwatch-itf-publish
          rm -rf "$snapshot"; mkdir -p "$snapshot"
          files=("dist/v3/source_itf_entries.json" "dist/v3/source_itf_draw_audit.json" "dist/v3/itf_system_diagnostics.json" "history/itf_draw_target_db.json" "history/itf_player_tournament_db.json" "history/itf_database_audit.json" "dist/v3/universal/tournaments.json" "dist/v3/universal/matches.json" "dist/v3/universal/results.json" "dist/v3/itf_t1_queue_status.json" "dist/v3/itf_t1_extraordinary_batch.json")
          for file in "${files[@]}"; do test -f "$file" || continue; mkdir -p "$snapshot/$(dirname "$file")"; cp "$file" "$snapshot/$file"; done
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            cp history/itf_draw_target_db.json /tmp/itf-current-state.json
            cp "$snapshot/history/itf_draw_target_db.json" /tmp/itf-incoming-state.json
            cp -R "$snapshot"/* ./
            node src/v3/merge-itf-draw-target-ownership.mjs t-minus-one /tmp/itf-current-state.json /tmp/itf-incoming-state.json history/itf_draw_target_db.json
            node src/v3/entries-engine.mjs
            aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" /tmp/itf-audit-state.json --only-show-errors
            node src/v3/synchronize-itf-coverage-catalog.mjs /tmp/itf-audit-state.json
            aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp /tmp/itf-audit-state.json "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" --only-show-errors
            node src/v3/build-itf-t1-extraordinary-batch.mjs
            node src/v3/build-itf-t1-admin-status.mjs
            git add dist/v3/source_itf_entries.json dist/v3/source_itf_draw_audit.json dist/v3/itf_system_diagnostics.json history/itf_draw_target_db.json history/itf_player_tournament_db.json history/itf_database_audit.json dist/v3/entries_itf.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/sync_status.json dist/v3/diagnostics.json dist/v3/entries_log.json dist/v3/universal/tournaments.json dist/v3/universal/matches.json dist/v3/universal/results.json dist/v3/itf_t1_queue_status.json dist/v3/itf_t1_extraordinary_batch.json
            if git diff --cached --quiet; then echo "No validated ITF T-1 changes"; exit 0; fi
            git commit -m "Publish validated ITF T-1 decisions"
            git push origin HEAD:main && exit 0
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t-minus-one-validated
          path: |
            dist/v3/source_itf_draw_audit.json
            dist/v3/audits/itf-t1-batch/*.json
            dist/v3/itf_system_diagnostics.json
            history/itf_database_audit.json
            dist/v3/audits/itf-t1-persistence.json
          retention-days: 14


  continue-ordinary:
    needs: [select, review]
    if: ${{ success() && needs.select.outputs.selected != '0' && inputs.extraordinary_chain != true && (inputs.chain_lane == 'ordinary' || inputs.chain_lane == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next ordinary batch
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_IDS: ${{ needs.select.outputs.next_previous_ids }}
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/courtwatch-v3-itf-t-minus-one.yml/dispatches" \
            -d "$(jq -n --arg ref main --arg previous "$PREVIOUS_IDS" '{ref:$ref,inputs:{chain_lane:"ordinary",ordinary_previous_ids:$previous}}')"
          echo "Next ordinary ITF T-1 batch dispatched"

  continue-extraordinary:
    needs: review
    if: ${{ success() && inputs.extraordinary_chain == true && fromJSON(inputs.extraordinary_remaining) > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next bounded extraordinary selector
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ inputs.extraordinary_remaining }}
          PREVIOUS_IDS: ${{ inputs.extraordinary_previous_ids }}
          LANE: ${{ inputs.chain_lane == 'extraordinary-b' && 'b' || 'a' }}
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/courtwatch-itf-t1-extraordinary.yml/dispatches" \
            -d "$(jq -n --arg ref main --arg lane "$LANE" --arg remaining "$REMAINING" --arg previous "$PREVIOUS_IDS" '{ref:$ref,inputs:{lane:$lane,remaining:$remaining,previous_ids:$previous}}')"
          echo "Next extraordinary selector dispatched with remaining=$REMAINING"

  refresh-diagnostics:
    needs: [select, review]
    if: ${{ always() && needs.select.result == 'success' }}
    uses: ./.github/workflows/courtwatch-itf-incremental-status.yml
    secrets: inherit
