name: Discover Tennis Europe profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [te-profile-discovery.mjs, .github/workflows/te-profile-discovery.yml]
permissions: {contents: write}
concurrency: {group: court-watch-te-profile-discovery,cancel-in-progress: true}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node te-profile-discovery.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add te-profiles-report.json
          if ! git diff --cached --quiet; then git commit -m 'Map Tennis Europe player profiles'; git pull --rebase origin main; git push; fi
