name: Court Watch residual Tennis Europe ID recovery once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-residual-tennis-europe-profile-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      # D1_WRITE_POLICY: incremental; trace original observed sources through the two retained R2 backups.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify source-bound Tennis Europe recovery and identity mapping
        run: node --test test/player-id-audit-scope.test.mjs test/acceptance-source-profile-provenance.test.mjs test/legacy-acceptance-profile-migration.test.mjs test/archived-profile-evidence.test.mjs test/player-identity-mapping.test.mjs test/player-circuit-profiles.test.mjs
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - name: Load verified native Tennis Europe acceptance generation
        run: |
          set -euo pipefail
          mkdir -p tmp/native-acceptance
          npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/pointers/current.json" --remote --config wrangler.generated.jsonc --file tmp/native-acceptance/pointer.json
          generation=$(jq -er .generation tmp/native-acceptance/pointer.json)
          [[ "$generation" =~ ^[a-f0-9]{64}$ ]]
          npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/generations/$generation/tennis_europe_participant_cache.json.gz" --remote --config wrangler.generated.jsonc --file tmp/native-acceptance/cache.json.gz
          test "$(sha256sum tmp/native-acceptance/cache.json.gz | cut -d' ' -f1)" = "$(jq -er .files.participantCache.sha256 tmp/native-acceptance/pointer.json)"
          npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/generations/$generation/tennis_europe_participant_index.json.gz" --remote --config wrangler.generated.jsonc --file tmp/native-acceptance/index.json.gz
          test "$(sha256sum tmp/native-acceptance/index.json.gz | cut -d' ' -f1)" = "$(jq -er .files.participantIndex.sha256 tmp/native-acceptance/pointer.json)"
          gzip -t tmp/native-acceptance/index.json.gz
          echo "TE_NATIVE_PARTICIPANT_INDEX=tmp/native-acceptance/index.json.gz" >> "$GITHUB_ENV"
          gzip -t tmp/native-acceptance/cache.json.gz
          echo "TE_NATIVE_ACCEPTANCE_CACHE=tmp/native-acceptance/cache.json.gz" >> "$GITHUB_ENV"
      - name: Load the two retained original acceptance backups
        run: |
          set -euo pipefail
          dirs=()
          for slot in 1 2; do
            dir="tmp/native-acceptance/backup-$slot"
            mkdir -p "$dir"
            if ! npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/pointers/backup-$slot.json" --remote --config wrangler.generated.jsonc --file "$dir/pointer.json"; then
              continue
            fi
            generation=$(jq -er .generation "$dir/pointer.json")
            [[ "$generation" =~ ^[a-f0-9]{64}$ ]]
            npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/generations/$generation/tennis_europe_participant_cache.json.gz" --remote --config wrangler.generated.jsonc --file "$dir/cache.json.gz"
            npx wrangler r2 object get "$R2_BUCKET/tennis-europe/cache/generations/$generation/tennis_europe_participant_index.json.gz" --remote --config wrangler.generated.jsonc --file "$dir/index.json.gz"
            test "$(sha256sum "$dir/cache.json.gz" | cut -d' ' -f1)" = "$(jq -er .files.participantCache.sha256 "$dir/pointer.json")"
            test "$(sha256sum "$dir/index.json.gz" | cut -d' ' -f1)" = "$(jq -er .files.participantIndex.sha256 "$dir/pointer.json")"
            gzip -t "$dir/cache.json.gz"
            gzip -t "$dir/index.json.gz"
            dirs+=("$dir")
          done
          echo "TE_ACCEPTANCE_BACKUP_DIRS=$(jq -cn '$ARGS.positional' --args "${dirs[@]}")" >> "$GITHUB_ENV"
      - name: Recover residual Tennis Europe IDs from retained original participation
        run: node scripts/recover-legacy-tennis-europe-profiles.mjs
