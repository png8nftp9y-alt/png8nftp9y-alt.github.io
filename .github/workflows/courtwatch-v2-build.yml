name: Court Watch v2 build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/build-courtwatch-v2.mjs'
      - 'src/audit-courtwatch-v2.mjs'
      - 'src/schema.js'
      - 'courtwatch-v2-trigger.json'
      - '.github/workflows/courtwatch-v2-build.yml'
permissions: {contents: write}
concurrency: {group: court-watch-v2-build,cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build v2 separated data
        run: |
          node src/build-courtwatch-v2.mjs
          node src/audit-courtwatch-v2.mjs
      - name: Publish v2 files
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add src/build-courtwatch-v2.mjs src/audit-courtwatch-v2.mjs src/schema.js dist .github/workflows/courtwatch-v2-build.yml
          git commit -m 'Build Court Watch v2 separated data' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
