name: Court Watch v3 Tennis Europe route diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/diagnose-tennis-europe-routes.mjs'
      - '.github/workflows/courtwatch-v3-te-route-diagnostic.yml'
      - 'courtwatch-v3-te-route-diagnostic-trigger.json'
permissions: {contents: write}
concurrency: {group: court-watch-v3-te-route-diagnostic,cancel-in-progress: true}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run Tennis Europe route diagnostic
        run: |
          set +e
          node src/v3/diagnose-tennis-europe-routes.mjs > courtwatch-v3-te-route-diagnostic-run.log 2>&1
          code=$?
          echo "exitCode=$code" >> courtwatch-v3-te-route-diagnostic-run.log
          cat courtwatch-v3-te-route-diagnostic-run.log
          exit $code
      - name: Commit diagnostic
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/tennis_europe_route_diagnostic.json courtwatch-v3-te-route-diagnostic-run.log .github/workflows/courtwatch-v3-te-route-diagnostic.yml src/v3/diagnose-tennis-europe-routes.mjs
          git commit -m "Run Court Watch v3 Tennis Europe route diagnostic" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
