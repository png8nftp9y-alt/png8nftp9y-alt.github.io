name: Court Watch ITF acquired draws D1 sync
on:
  workflow_run:
    workflows:
      - Court Watch v3 ITF T-1 complete draws
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional completed T-1 run ID
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: download
        name: Download every draw document acquired by the T-1 run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          mkdir -p /tmp/itf-run-draws
          if gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'itf-t1-draw-*' --dir /tmp/itf-run-draws 2>/dev/null &&
             find /tmp/itf-run-draws -name '*.json.gz' -type f | grep -q .; then
            echo "has_draws=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_draws=false" >> "$GITHUB_OUTPUT"
            echo "No acquired draw artifacts: nothing to synchronize"
          fi
      - name: Build idempotent ITF-only D1 delta
        if: steps.download.outputs.has_draws == 'true'
        run: node src/v3/build-itf-draw-d1-seed.mjs /tmp/itf-run-draws
      - name: Configure and import D1 delta
        if: steps.download.outputs.has_draws == 'true'
        working-directory: cloudflare/app-api
        run: |
          set -euo pipefail
          shopt -s nullglob
          npm install
          node scripts/configure-d1.mjs
          sql_files=(../../seed-itf-draws/*.sql)
          if [ "${#sql_files[@]}" -eq 0 ]; then
            echo "No new or changed ITF draw rows; D1 is already synchronized"
            exit 0
          fi
          for sql_file in "${sql_files[@]}"; do
            imported=0
            for attempt in 1 2 3 4; do
              if npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"; then imported=1; break; fi
              sleep $((attempt * 5))
            done
            test "$imported" -eq 1
          done
      - uses: actions/upload-artifact@v4
        if: steps.download.outputs.has_draws == 'true'
        with:
          name: itf-acquired-draws-d1-sync-audit
          path: dist/v3/audits/itf-draw-d1-sync.json
          retention-days: 30
