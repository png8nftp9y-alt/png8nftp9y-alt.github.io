name: Court Watch ITF Round Robin live test
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/v3/itf-common.mjs'
      - 'src/v3/itf-incapsula-fallback.test.mjs'
      - 'src/v3/acquire-itf-history-tournament-tasks.mjs'
      - 'src/v3/verify-itf-t-minus-one-all-players.mjs'
      - 'src/v3/test-itf-round-robin-live.mjs'
      - 'src/v3/test-itf-round-robin-group.mjs'
      - 'src/v3/merge-itf-round-robin-groups.mjs'
      - '.github/workflows/courtwatch-itf-round-robin-test.yml'
permissions:
  contents: read
jobs:
  acquire-groups:
    strategy:
      fail-fast: false
      # Keep the eight group branches isolated but serial. Running all eight
      # sessions together triggers ITF Incapsula and produces false gaps.
      max-parallel: 1
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test src/v3/itf-incapsula-fallback.test.mjs
      - run: node src/v3/test-itf-round-robin-group.mjs
        env:
          ITF_RR_GROUP_INDEX: ${{ matrix.group }}
          ITF_REQUEST_DELAY_MS: 1800
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_ACQUISITION_URL: ${{ secrets.ITF_ACQUISITION_URL }}
          ITF_ACQUIRER_TOKEN: ${{ secrets.ITF_ACQUIRER_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-rr-group-${{ matrix.group }}
          path: dist/v3/audits/itf-rr-groups/group-${{ matrix.group }}.json
          retention-days: 7
  verify-round-robin:
    needs: acquire-groups
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          pattern: itf-rr-group-*
          path: /tmp/itf-rr-groups
          merge-multiple: true
      - run: node src/v3/merge-itf-round-robin-groups.mjs /tmp/itf-rr-groups
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-round-robin-8-branch-report
          path: dist/v3/audits/itf-round-robin-8-branch.json
          retention-days: 14
