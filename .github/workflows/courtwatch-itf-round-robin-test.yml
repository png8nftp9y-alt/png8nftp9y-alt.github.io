name: Court Watch ITF Round Robin live test
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/v3/itf-common.mjs'
      - 'src/v3/acquire-itf-history-tournament-tasks.mjs'
      - 'src/v3/verify-itf-t-minus-one-all-players.mjs'
      - 'src/v3/test-itf-round-robin-live.mjs'
      - '.github/workflows/courtwatch-itf-round-robin-test.yml'
permissions:
  contents: read
jobs:
  verify-round-robin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: node src/v3/test-itf-round-robin-live.mjs
        env:
          ITF_ACQUISITION_URL: ${{ secrets.ITF_ACQUISITION_URL }}
          ITF_ACQUIRER_TOKEN: ${{ secrets.ITF_ACQUIRER_TOKEN }}
