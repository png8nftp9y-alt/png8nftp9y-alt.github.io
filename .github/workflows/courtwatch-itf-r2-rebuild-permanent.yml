name: Court Watch rebuild ITF permanent R2 database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-itf-r2-rebuild-permanent.yml']
permissions: {contents: read}
concurrency:
  group: courtwatch-v3-itf-publish
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install --quiet awscli
      - name: Restore current ITF generation
        run: bash src/v3/itf-r2-cache.sh restore
      - name: Restore and certify all 4291 historical draw tasks
        run: |
          set -euo pipefail
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          prefix="itf/history-draws"
          mkdir -p /tmp/itf-blocks dist/v3/shards/itf/draw-tasks
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/pointers/current.json" /tmp/history-pointer.json --only-show-errors
          generation="$(jq -er .generation /tmp/history-pointer.json)"
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/generations/$generation/manifest.json" /tmp/history-manifest.json --only-show-errors
          jq -e '.status=="itf_history_draw_archive_complete" and .expected==4291 and .complete==4291 and .missing==0 and .retry==0 and .unreadable==0 and (.blocks|length)==17' /tmp/history-manifest.json
          while IFS=$'\t' read -r block sha count; do
            archive="/tmp/itf-blocks/block-$block.tar.gz"
            aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/generations/$generation/blocks/block-$block.tar.gz" "$archive" --only-show-errors
            test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$sha"
            actual_count="$(tar -tzf "$archive" | awk '/[.]json[.]gz$/{n++} END{print n+0}')"
            test "$actual_count" -eq "$count"
            mkdir -p "dist/v3/shards/itf/draw-tasks/$block"
            tar -xzf "$archive" -C "dist/v3/shards/itf/draw-tasks/$block"
          done < <(jq -r '.blocks[]|[.block,.sha256,.count]|@tsv' /tmp/history-manifest.json)
          test "$(find dist/v3/shards/itf/draw-tasks -type f -name '*.json.gz' | wc -l | tr -d ' ')" -eq 4291
          ITF_EXPECTED_TASKS=4291 node src/v3/merge-itf-history-draw-tasks.mjs
          jq -e '.status=="itf_history_draw_merge_complete" and .complete==4291 and .missing==0 and .retry==0 and .unreadable==0 and .players>0 and .matches>0' dist/v3/audits/itf-history-draw-merge.json
      - name: Rebuild, publish and verify permanent databases
        run: |
          set -euo pipefail
          node src/v3/maintain-itf-database.mjs
          jq -e '.status=="itf_database_update_complete" and .allPlayers>0 and .allResults>0' history/itf_database_audit.json
          bash src/v3/itf-r2-cache.sh publish
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/itf/database/pointers/current.json" /tmp/current.json --only-show-errors
          generation="$(jq -er .generation /tmp/current.json)"
          for file in itf_players_database.json.gz itf_results_database.json.gz; do
            aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/itf/database/generations/$generation/$file" "/tmp/$file" --only-show-errors
            gzip -t "/tmp/$file"
          done
          test "$(gzip -cd /tmp/itf_players_database.json.gz | jq '.players|length')" -gt 0
          test "$(gzip -cd /tmp/itf_results_database.json.gz | jq '.matches|length')" -gt 0
          echo "ITF permanent R2 generation $generation rebuilt and verified."
