name: Court Watch full circuit discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-circuit-discovery.yml'
      - 'apply-coverage-live.mjs'
      - 'former-players.json'
  schedule:
    - cron: '14,44 * * * *'
permissions:
  contents: write
concurrency:
  group: court-watch-full-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - name: Prepare scanner
        shell: bash
        run: |
          set +e
          npm ci > full-discovery.log 2>&1; NPM=$?
          npx playwright install --with-deps chromium >> full-discovery.log 2>&1; BROWSER=$?
          echo "NPM=$NPM" >> "$GITHUB_ENV"
          echo "BROWSER=$BROWSER" >> "$GITHUB_ENV"
          exit 0
      - name: Scan FITP, Tennis Europe and ITF from 20 June
        shell: bash
        run: |
          set +e
          node apply-coverage-live.mjs >> full-discovery.log 2>&1; PATCH=$?
          node run-with-former.mjs puc-entries-fast.mjs >> full-discovery.log 2>&1; FITP=$?
          node run-with-former.mjs te-entries.mjs >> full-discovery.log 2>&1; TE=$?
          node run-with-former.mjs itf-entries.mjs >> full-discovery.log 2>&1; ITF=$?
          node run-with-former.mjs puc-results.mjs >> full-discovery.log 2>&1; RESULTS=$?
          node mainetti-aug4-fix.mjs >> full-discovery.log 2>&1; MAINETTI=$?
          node run-with-former.mjs puc-opponent-meta.mjs >> full-discovery.log 2>&1; CLUBS=$?
          node puc-conditional-reconcile.mjs >> full-discovery.log 2>&1; CONDITIONAL=$?
          node run-with-former.mjs courtwatch-finalize.mjs >> full-discovery.log 2>&1; FINALIZE=$?
          node -e "require('fs').writeFileSync('full-discovery-heartbeat.json',JSON.stringify({status:'complete',at:new Date().toISOString(),coverageFrom:'2026-06-20',npm:+process.argv[1],browser:+process.argv[2],patch:+process.argv[3],fitp:+process.argv[4],tennisEurope:+process.argv[5],itf:+process.argv[6],results:+process.argv[7],mainetti:+process.argv[8],clubs:+process.argv[9],conditional:+process.argv[10],finalize:+process.argv[11]},null,2)+'\n')" "${NPM:-0}" "${BROWSER:-0}" "$PATCH" "$FITP" "$TE" "$ITF" "$RESULTS" "$MAINETTI" "$CLUBS" "$CONDITIONAL" "$FINALIZE"
          exit 0
      - name: Publish discovery safely
        shell: bash
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add -A ':!node_modules'
          git commit -m 'Discover Court Watch tournaments across all circuits' || exit 0
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main && continue
            git rebase --abort || true
            sleep $((attempt*10))
          done
          exit 1
