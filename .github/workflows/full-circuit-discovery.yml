name: Court Watch continuous official sync
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: court-watch-continuous-official-sync,cancel-in-progress: true}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - name: Prepare official scanners
        shell: bash
        run: |
          set -e
          npm ci
          npx playwright install --with-deps chromium
      - name: Continuous sync current and former players
        shell: bash
        run: |
          set +e
          : > full-discovery.log
          node run-with-former.mjs puc-entries-fast.mjs >> full-discovery.log 2>&1; FITP=$?
          node run-with-former.mjs te-entries.mjs >> full-discovery.log 2>&1; TE=$?
          node run-with-former.mjs itf-entries.mjs >> full-discovery.log 2>&1; ITF=$?
          node official-order-of-play.mjs >> full-discovery.log 2>&1; OOP=$?
          node run-with-former.mjs puc-results.mjs >> full-discovery.log 2>&1; RESULTS=$?
          node run-with-former.mjs puc-opponent-meta.mjs >> full-discovery.log 2>&1; CLUBS=$?
          node player-memberships.mjs >> full-discovery.log 2>&1; MEMBERS=$?
          node puc-conditional-reconcile.mjs >> full-discovery.log 2>&1; CONDITIONAL=$?
          node run-with-former.mjs courtwatch-finalize.mjs >> full-discovery.log 2>&1; FINALIZE=$?
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('data.json','utf8'));const hb={status:'complete',at:new Date().toISOString(),continuous:true,frequency:'*/5 * * * *',coverageFrom:'2025-12-18',players:'current+former',sources:'FITP/P.U.C. + official Tennis Europe + official ITF',fitp:+process.argv[1],tennisEurope:+process.argv[2],itf:+process.argv[3],orderOfPlay:+process.argv[4],results:+process.argv[5],opponentClubs:+process.argv[6],memberships:+process.argv[7],conditional:+process.argv[8],finalize:+process.argv[9],matches:(data.matches||[]).length,tournaments:(data.tournaments||[]).length,fitpTournaments:(data.tournaments||[]).filter(t=>t.sourceId==='fitp-puc').length,teTournaments:(data.tournaments||[]).filter(t=>t.sourceId==='tennis-europe').length,itfTournaments:(data.tournaments||[]).filter(t=>t.sourceId==='itf').length,generatedAt:data.generatedAt};fs.writeFileSync('full-discovery-heartbeat.json',JSON.stringify(hb,null,2)+'\n')" "$FITP" "$TE" "$ITF" "$OOP" "$RESULTS" "$CLUBS" "$MEMBERS" "$CONDITIONAL" "$FINALIZE"
          exit 0
      - name: Publish data atomically
        shell: bash
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add -A ':!node_modules'
          git commit -m 'Continuous Court Watch official sync' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt*8))
          done
          exit 1
