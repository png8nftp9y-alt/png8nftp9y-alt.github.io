name: Court Watch supervisor heartbeat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-circuit-discovery.yml'
      - 'courtwatch-supervisor.mjs'
      - 'data.json'
      - 'players.json'
      - 'former-players.json'
  schedule:
    - cron: '*/5 * * * *'
permissions: {contents: write}
concurrency: {group: court-watch-supervisor,cancel-in-progress: true}
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node courtwatch-supervisor.mjs
      - run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add courtwatch-supervisor.json full-discovery-heartbeat.json
          git commit -m 'Update Court Watch supervisor heartbeat' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
