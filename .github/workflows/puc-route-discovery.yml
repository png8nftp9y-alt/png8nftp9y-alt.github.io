name: Discover official FITP draw routes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [puc-route-discovery.mjs, .github/workflows/puc-route-discovery.yml]
permissions: {contents: write}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node puc-route-discovery.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add puc-route-discovery.json
          if ! git diff --cached --quiet; then git commit -m 'Capture official FITP draw routes'; git pull --rebase origin main; git push; fi
