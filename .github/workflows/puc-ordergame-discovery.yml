name: Discover FITP order of play routes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['puc-ordergame-discovery.mjs','.github/workflows/puc-ordergame-discovery.yml']
permissions: {contents: write}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node puc-ordergame-discovery.mjs
      - run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add puc-ordergame-discovery.json
          git commit -m 'Capture FITP order of play routes' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
