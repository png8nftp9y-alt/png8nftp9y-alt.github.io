name: Court Watch ITF archived acceptance lists
on:
  push:
    branches: [main]
    paths:
      - 'src/v3/itf-acceptance-archive.mjs'
      - 'src/v3/publish-itf-acceptance-archive.mjs'
      - '.github/workflows/courtwatch-itf-acceptance-archive.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test src/v3/itf-acceptance-archive.test.mjs cloudflare/app-api/test/itf-acceptance-list.test.mjs
  archive:
    needs: check
    concurrency: {group: courtwatch-v3-itf-publish,cancel-in-progress: false,queue: max}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install --quiet awscli
      - name: Verify current archive code inside the publisher queue
        run: node --test src/v3/itf-acceptance-archive.test.mjs cloudflare/app-api/test/itf-acceptance-list.test.mjs
      - name: Archive last acquired lists from the existing R2 cache
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_BUCKET" && test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          node src/v3/publish-itf-acceptance-archive.mjs --restore --bootstrap | tee itf-acceptance-archive-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-acceptance-archive-report
          path: itf-acceptance-archive-report.txt
          if-no-files-found: ignore
          retention-days: 14
