name: Court Watch search nationality diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/diagnose-search-nationalities.mjs'
      - '.github/workflows/courtwatch-search-nationality-diagnosis.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-search-nationality-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check tools/diagnose-search-nationalities.mjs
      - name: Inspect current search and source records read only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
        run: node tools/diagnose-search-nationalities.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-nationality-diagnosis
          path: artifacts/search-nationality-diagnosis.json
          if-no-files-found: error
