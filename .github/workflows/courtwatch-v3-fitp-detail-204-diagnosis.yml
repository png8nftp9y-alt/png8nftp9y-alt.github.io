name: Court Watch v3 FITP detail 204 diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/audit-fitp-detail-204-diagnosis.mjs'
      - 'courtwatch-v3-fitp-detail-204-diagnosis-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-detail-204-diagnosis.yml'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-detail-204-diagnosis,cancel-in-progress: true}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Diagnose FITP detail 204 cases
        run: |
          node src/v3/audit-fitp-detail-204-diagnosis.mjs > courtwatch-v3-fitp-detail-204-diagnosis-run.log 2>&1
          cat courtwatch-v3-fitp-detail-204-diagnosis-run.log
      - name: Commit diagnosis output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_detail_204_diagnosis.json courtwatch-v3-fitp-detail-204-diagnosis-run.log
          git commit -m "Build Court Watch v3 FITP detail 204 diagnosis" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
