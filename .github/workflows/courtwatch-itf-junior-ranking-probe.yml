name: CourtWatch ITF Junior ranking probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Ranking check
        type: choice
        default: diagnostic
        options: [diagnostic, full]

permissions:
  contents: read

concurrency:
  group: courtwatch-itf-junior-ranking-probe

jobs:
  check-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete official Boys and Girls rankings
        if: inputs.mode == 'full'
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          import { checkRanking } from './infra/itf-acquirer/junior-ranking.mjs';

          for (const [category, gender] of [['B', 'M'], ['G', 'F']]) {
            let pages = 0;
            try {
              const result = await checkRanking(category, async url => {
                const skip = Number(url.searchParams.get('skip'));
                try {
                  if (pages || category === 'G') await delay(1200);
                  async function readPage() {
                    const response = await fetch(url, {
                      headers: { accept: 'application/json' },
                      signal: AbortSignal.timeout(20000),
                    });
                    return { response, body: await response.text() };
                  }
                  let page;
                  try {
                    page = await readPage();
                  } catch (error) {
                    if (error.name !== 'TimeoutError') throw error;
                    console.log(JSON.stringify({ category, skip, retry: 'timeout' }));
                    await delay(3000);
                    page = await readPage();
                  }
                  const { response, body } = page;
                  if (/Incapsula|Additional security check|hCaptcha/i.test(body))
                    throw Error('incapsula_challenge');
                  if (!response.ok) throw Error('HTTP ' + response.status);
                  let json;
                  try { json = JSON.parse(body); }
                  catch { throw Error('non_json'); }
                  if (!Array.isArray(json?.items)) throw Error('items_missing_or_not_array');
                  if (!json.items.length) throw Error('items_empty');
                  if (skip === 0 && json.items[0]?.rank !== 1) throw Error('first_rank_not_1');
                  const wrongCategory = json.items.findIndex(row => row?.gender !== gender);
                  if (wrongCategory !== -1) {
                    const value = json.items[wrongCategory]?.gender;
                    const reason = value == null ? 'missing' : value === '' ? 'empty' : 'unexpected';
                    throw Error('gender_' + reason + ' at row ' + (skip + wrongCategory + 1));
                  }
                  pages++;
                  if (pages % 10 === 0) console.log(JSON.stringify({ category, pages, skip }));
                  return { ok: true, json };
                } catch (error) {
                  throw Error('skip=' + skip + ': ' + error.message);
                }
              });
              console.log(JSON.stringify(result));
            } catch (error) {
              console.error(JSON.stringify({ category, error: error.message }));
              process.exitCode = 1;
            }
          }
          JS
      - name: Diagnose ranking pages reported by run 42733011187
        if: inputs.mode == 'diagnostic'
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          import { rankingUrl } from './infra/itf-acquirer/junior-ranking.mjs';

          const seen = new Map();
          let previousRank;
          for (const [category, skip, gender] of [['B', 4400, 'M'], ['B', 4500, 'M'], ['G', 4300, 'F']]) {
            if (category === 'G') { seen.clear(); previousRank = undefined; }
            try {
              if (skip !== 4400) await delay(1200);
              async function read() {
                const response = await fetch(rankingUrl(category, 100, skip), {
                  headers: { accept: 'application/json' },
                  signal: AbortSignal.timeout(20000),
                });
                return { response, body: await response.text() };
              }
              let page;
              try { page = await read(); }
              catch (error) {
                if (error.name !== 'TimeoutError') throw error;
                await delay(3000);
                page = await read();
              }
              const { response, body } = page;
              if (/Incapsula|Additional security check|hCaptcha/i.test(body)) throw Error('incapsula_challenge');
              if (!response.ok) throw Error('HTTP ' + response.status);
              let data;
              try { data = JSON.parse(body); }
              catch { throw Error('non_json'); }
              if (!Array.isArray(data?.items) || !data.items.length) throw Error('items_missing_or_empty');

              const anomalies = [];
              for (const [index, item] of data.items.entries()) {
                const { playerId, rank, points, gender: actualGender, hiddenPlayer } = item ?? {};
                const row = skip + index + 1;
                const problems = [];
                const validId = Number.isSafeInteger(playerId) && playerId > 0;
                const validRank = Number.isInteger(rank) && rank > 0;
                if (!validId) problems.push('invalid_id');
                if (validId && seen.has(playerId)) problems.push('duplicate_id');
                if (!validRank) problems.push('invalid_rank');
                if (validRank && previousRank !== undefined && rank < previousRank) problems.push('rank_decreased');
                if (!Number.isFinite(points)) problems.push('invalid_points');
                if (actualGender !== gender) problems.push('unexpected_gender');
                if (problems.length) {
                  anomalies.push({
                    row, rank: validRank ? rank : null, previousRank,
                    gender: typeof actualGender === 'string' && /^[A-Za-z]{0,12}$/.test(actualGender)
                      ? actualGender : actualGender == null ? null : typeof actualGender,
                    hidden: hiddenPlayer === true, problems,
                    duplicateOfRow: validId ? seen.get(playerId) : undefined,
                  });
                }
                if (validId && !seen.has(playerId)) seen.set(playerId, row);
                if (validRank) previousRank = rank;
              }
              console.log(JSON.stringify({
                category, skip, rankDate: data.rankDate, totalItems: data.totalItems,
                rows: data.items.length, anomalyCount: anomalies.length, anomalies: anomalies.slice(0, 20),
              }));
              if (anomalies.length) process.exitCode = 1;
            } catch (error) {
              console.error(JSON.stringify({ category, skip, error: error.message }));
              process.exitCode = 1;
            }
          }
          JS
