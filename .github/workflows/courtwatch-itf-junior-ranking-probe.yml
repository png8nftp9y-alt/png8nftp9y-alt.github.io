name: CourtWatch ITF Junior ranking probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtwatch-itf-junior-ranking-probe

jobs:
  check-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete official Boys and Girls rankings
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          import { checkRanking } from './infra/itf-acquirer/junior-ranking.mjs';

          for (const [category, gender] of [['B', 'M'], ['G', 'F']]) {
            let pages = 0;
            try {
              const result = await checkRanking(category, async url => {
                const skip = Number(url.searchParams.get('skip'));
                try {
                  if (pages || category === 'G') await delay(1200);
                  async function readPage() {
                    const response = await fetch(url, {
                      headers: { accept: 'application/json' },
                      signal: AbortSignal.timeout(20000),
                    });
                    return { response, body: await response.text() };
                  }
                  let page;
                  try {
                    page = await readPage();
                  } catch (error) {
                    if (error.name !== 'TimeoutError') throw error;
                    console.log(JSON.stringify({ category, skip, retry: 'timeout' }));
                    await delay(3000);
                    page = await readPage();
                  }
                  const { response, body } = page;
                  if (/Incapsula|Additional security check|hCaptcha/i.test(body))
                    throw Error('incapsula_challenge');
                  if (!response.ok) throw Error('HTTP ' + response.status);
                  let json;
                  try { json = JSON.parse(body); }
                  catch { throw Error('non_json'); }
                  if (!Array.isArray(json?.items)) throw Error('items_missing_or_not_array');
                  if (!json.items.length) throw Error('items_empty');
                  if (skip === 0 && json.items[0]?.rank !== 1) throw Error('first_rank_not_1');
                  const wrongCategory = json.items.findIndex(row => row?.gender !== gender);
                  if (wrongCategory !== -1) {
                    const value = json.items[wrongCategory]?.gender;
                    const reason = value == null ? 'missing' : value === '' ? 'empty' : 'unexpected';
                    throw Error('gender_' + reason + ' at row ' + (skip + wrongCategory + 1));
                  }
                  pages++;
                  if (pages % 10 === 0) console.log(JSON.stringify({ category, pages, skip }));
                  return { ok: true, json };
                } catch (error) {
                  throw Error('skip=' + skip + ': ' + error.message);
                }
              });
              console.log(JSON.stringify(result));
            } catch (error) {
              console.error(JSON.stringify({ category, error: error.message }));
              process.exitCode = 1;
            }
          }
          JS
