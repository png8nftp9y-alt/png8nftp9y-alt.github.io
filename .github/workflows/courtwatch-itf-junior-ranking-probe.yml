name: CourtWatch ITF Junior ranking probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Ranking check
        type: choice
        default: diagnostic
        options: [diagnostic, full]

permissions:
  contents: read

concurrency:
  group: courtwatch-itf-junior-ranking-probe

jobs:
  check-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete official Boys and Girls rankings
        if: inputs.mode == 'full'
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          import { checkRanking } from './infra/itf-acquirer/junior-ranking.mjs';

          for (const [category, gender] of [['B', 'M'], ['G', 'F']]) {
            let pages = 0;
            try {
              const result = await checkRanking(category, async url => {
                const skip = Number(url.searchParams.get('skip'));
                try {
                  if (pages || category === 'G') await delay(1200);
                  async function readPage() {
                    const response = await fetch(url, {
                      headers: { accept: 'application/json' },
                      signal: AbortSignal.timeout(20000),
                    });
                    return { response, body: await response.text() };
                  }
                  let page;
                  try {
                    page = await readPage();
                  } catch (error) {
                    if (error.name !== 'TimeoutError') throw error;
                    console.log(JSON.stringify({ category, skip, retry: 'timeout' }));
                    await delay(3000);
                    page = await readPage();
                  }
                  const { response, body } = page;
                  if (/Incapsula|Additional security check|hCaptcha/i.test(body))
                    throw Error('incapsula_challenge');
                  if (!response.ok) throw Error('HTTP ' + response.status);
                  let json;
                  try { json = JSON.parse(body); }
                  catch { throw Error('non_json'); }
                  if (!Array.isArray(json?.items)) throw Error('items_missing_or_not_array');
                  if (!json.items.length) throw Error('items_empty');
                  if (skip === 0 && json.items[0]?.rank !== 1) throw Error('first_rank_not_1');
                  const wrongCategory = json.items.findIndex(row => row?.gender !== gender);
                  if (wrongCategory !== -1) {
                    const value = json.items[wrongCategory]?.gender;
                    const reason = value == null ? 'missing' : value === '' ? 'empty' : 'unexpected';
                    throw Error('gender_' + reason + ' at row ' + (skip + wrongCategory + 1));
                  }
                  pages++;
                  if (pages % 10 === 0) console.log(JSON.stringify({ category, pages, skip }));
                  return { ok: true, json };
                } catch (error) {
                  throw Error('skip=' + skip + ': ' + error.message);
                }
              });
              console.log(JSON.stringify(result));
            } catch (error) {
              console.error(JSON.stringify({ category, error: error.message }));
              process.exitCode = 1;
            }
          }
          JS
      - name: Test one response per official ranking
        if: inputs.mode == 'diagnostic'
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises';
          import { rankingUrl } from './infra/itf-acquirer/junior-ranking.mjs';

          const snapshots = new Map();
          const take = 6000;
          for (const [category, gender] of [['B', 'M'], ['G', 'F']]) {
            try {
              if (category === 'G') await delay(1200);
              const response = await fetch(rankingUrl(category, take, 0), {
                headers: { accept: 'application/json' },
                signal: AbortSignal.timeout(60000),
              });
              const body = await response.text();
              if (/Incapsula|Additional security check|hCaptcha/i.test(body)) throw Error('incapsula_challenge');
              if (!response.ok) throw Error('HTTP ' + response.status);
              const { rankDate, totalItems, items } = JSON.parse(body) ?? {};
              if (typeof rankDate !== 'string' || !Number.isFinite(Date.parse(rankDate + ' UTC')) ||
                  !Number.isInteger(totalItems) || totalItems < 1 ||
                  !Array.isArray(items) || !items.length || items.length > Math.min(take, totalItems) ||
                  items[0]?.rank !== 1) throw Error('invalid_ranking_response');

              const ids = new Set();
              const genderMismatches = [];
              let duplicates = 0, invalidRows = 0, previousRank = 0;
              for (const [index, item] of items.entries()) {
                const { playerId, rank, points, gender: actualGender } = item ?? {};
                if (Number.isSafeInteger(playerId) && playerId > 0) {
                  if (ids.has(playerId)) duplicates++;
                  ids.add(playerId);
                }
                if (!Number.isSafeInteger(playerId) || playerId < 1 ||
                    !Number.isInteger(rank) || rank < 1 || rank < previousRank ||
                    !Number.isFinite(points)) invalidRows++;
                if (Number.isInteger(rank) && rank > 0) previousRank = rank;
                if (actualGender !== gender) genderMismatches.push({ playerId, row: index + 1, rank });
              }
              const complete = ids.size === totalItems && !duplicates && !invalidRows;
              snapshots.set(category, { rankDate, ids, genderMismatches, complete });
              console.log(JSON.stringify({
                category, rankDate, take, totalItems, rows: items.length, uniqueIds: ids.size,
                duplicates, invalidRows, genderMismatches: genderMismatches.length, complete,
              }));
              if (!complete || genderMismatches.length) process.exitCode = 1;
            } catch (error) {
              console.error(JSON.stringify({ category, error: error.message }));
              process.exitCode = 1;
            }
          }

          const boys = snapshots.get('B'), girls = snapshots.get('G');
          if (boys?.complete && girls && boys.rankDate === girls.rankDate) {
            for (const { playerId, row, rank } of girls.genderMismatches.slice(0, 20)) {
              console.log(JSON.stringify({ category: 'G', row, rank, appearsInBoys: boys.ids.has(playerId) }));
            }
          }
          JS
