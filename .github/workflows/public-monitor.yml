name: Monitor official tennis portals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [players.json, monitor.mjs, package.json, package-lock.json, .github/workflows/public-monitor.yml]
  schedule:
    - cron: '*/15 * * * *'
permissions: {contents: write,issues: write,pages: write,id-token: write}
concurrency: {group: court-watch-data,cancel-in-progress: false}
jobs:
  monitor:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Scan FITP, Tennis Europe and ITF
        run: |
          sed -i 's/seen.size < 45/seen.size < 35/g; s/waitForTimeout(5000)/waitForTimeout(1500)/g; s/item.depth < 2/item.depth < 1/g' monitor.mjs
          npm run monitor
          node merge-confirmed.mjs
      - name: Save updates
        run: |
          git checkout -- monitor.mjs
          if ! git diff --quiet -- data.json alerts.json; then
            git config user.name 'courtwatch-bot'
            git config user.email 'courtwatch-bot@users.noreply.github.com'
            git add data.json alerts.json
            git commit -m 'Update official tournament schedules'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - id: deployment
        uses: actions/deploy-pages@v4
