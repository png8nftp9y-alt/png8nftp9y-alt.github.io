name: Court Watch FITP recover eight profiles and inspect stored IDs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/courtwatch-fitp-targeted-profile-recovery.yml
      - tools/fitp-targeted-profile-recovery.mjs
      - tools/fitp-targeted-profile-recovery.json
      - cloudflare/app-api/test/fitp-targeted-profile-recovery.test.mjs
permissions:
  contents: read
concurrency:
  group: courtwatch-fitp-player-metadata
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metadata safeguards and targeted recovery
        run: node --test cloudflare/app-api/test/fitp-player-metadata.test.mjs cloudflare/app-api/test/sync-fitp-player-metadata.test.mjs cloudflare/app-api/test/fitp-targeted-profile-recovery.test.mjs
      - name: Recover eight current profiles and inspect stored identity origins
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
        run: node tools/fitp-targeted-profile-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitp-targeted-profile-recovery-report
          path: fitp-targeted-profile-recovery-report.json
          if-no-files-found: warn
          retention-days: 30
