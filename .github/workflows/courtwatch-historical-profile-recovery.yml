name: Court Watch historical nationality profile recovery once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-historical-profile-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      # D1_WRITE_POLICY: incremental; verified delta recovery requested by the user.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify historical proof and source delta guards
        run: node --test test/historical-ranking-profile-evidence.test.mjs test/archived-profile-evidence.test.mjs test/retained-tournament-profile-evidence.test.mjs
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - name: Recover only verified historical and native source profiles
        run: node scripts/recover-historical-ranking-profiles.mjs
