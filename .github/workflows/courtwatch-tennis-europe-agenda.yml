# D1_WRITE_POLICY: incremental; plan, guarded import, parity, then verified receipts.
name: Court Watch Tennis Europe agenda D1

on:
  workflow_dispatch:
    inputs:
      full_archive:
        description: Verifica tutto lo storico Europe e importa soltanto le differenze
        type: boolean
        default: false
  workflow_run:
    workflows: ['Court Watch Tennis Europe OOP and results live', 'Court Watch Tennis Europe OOP historical merge']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/scripts/generate-tennis-europe-oop-seed.mjs'
      - 'cloudflare/app-api/scripts/generate-tennis-europe-app-candidates.mjs'
      - 'cloudflare/app-api/scripts/generate-tennis-europe-import-hash.mjs'
      - 'cloudflare/app-api/scripts/import-tennis-europe-query.mjs'
      - 'cloudflare/app-api/scripts/prepare-tennis-europe-delta.mjs'
      - 'cloudflare/app-api/lib/tennis-europe-import-delta.mjs'
      - 'cloudflare/app-api/test/tennis-europe-query-import.test.mjs'
      - 'cloudflare/app-api/test/tennis-europe-historical-sync.test.mjs'
      - 'dist/v3/manual_matches.json'
      - 'cloudflare/app-api/scripts/restore-tennis-europe-oop.sh'
      - 'cloudflare/app-api/scripts/verify-tennis-europe-agenda-d1.mjs'
      - 'cloudflare/app-api/migrations/0006_tennis_europe_oop.sql'
      - 'cloudflare/app-api/migrations/0007_app_match_candidates.sql'
      - 'cloudflare/app-api/migrations/0018_app_match_candidates_match_index.sql'
      - 'cloudflare/app-api/migrations/0021_tennis_europe_identity_indexes.sql'
      - 'src/v3/verify-cloudflare-api-parity.mjs'
      - '.github/workflows/courtwatch-tennis-europe-agenda.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: courtwatch-te-agenda-${{ github.event.workflow_run.name == 'Court Watch Tennis Europe OOP historical merge' && 'historical' || 'live' }}-${{ github.event.workflow_run.conclusion || 'success' }}
  cancel-in-progress: false
  queue: single

jobs:
  check-source:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  release-safety:
    needs: check-source
    uses: ./.github/workflows/courtwatch-release-safety.yml
    with:
      source_sha: ${{ needs.check-source.outputs.source_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  import-verify-deploy:
    needs: [check-source, release-safety]
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Historical merge considers the full source locally; D1 receives only the delta.
      TE_INCREMENTAL: '1'
      TE_DELTA_FULL_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.full_archive && '1' || '0' }}
      TE_SYNC_HISTORICAL: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Court Watch Tennis Europe OOP historical merge') || (github.event_name == 'workflow_dispatch' && inputs.full_archive)) && '1' || '0' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Block deployment unless exact code passed required safety
        working-directory: .
        run: node tools/ensure-release-safety.mjs --expect "${{ needs.release-safety.outputs.code_fingerprint }}"
      - name: Configure Tennis Europe R2 reads
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --quiet awscli
      - run: npm install
      - name: Check Tennis Europe sources
        run: |
          node --test test/tennis-europe-query-import.test.mjs test/tennis-europe-historical-sync.test.mjs
          node --check scripts/generate-tennis-europe-oop-seed.mjs
          node --check scripts/generate-tennis-europe-app-candidates.mjs
          node --check scripts/verify-tennis-europe-agenda-d1.mjs
      - name: Create or reuse Court Watch D1
        run: node scripts/configure-d1.mjs
      - name: Apply shared schema migrations
        if: github.event_name != 'workflow_run'
        run: npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Restore verified Tennis Europe archives only
        run: bash scripts/restore-tennis-europe-oop.sh
      - name: Build Tennis Europe relational and agenda seeds
        run: |
          node scripts/generate-tennis-europe-oop-seed.mjs
          node scripts/generate-tennis-europe-app-candidates.mjs
          node scripts/generate-tennis-europe-import-hash.mjs
      - name: Select new, modified or incomplete Tennis Europe data
        id: delta
        run: node scripts/prepare-tennis-europe-delta.mjs plan
      - name: Import Tennis Europe rows only
        if: steps.delta.outputs.changed == 'true'
        run: |
          node scripts/guard-d1-import.mjs seed-tennis-europe-oop/delta/*.sql
          node scripts/prepare-tennis-europe-delta.mjs import
      - name: Verify Tennis Europe D1 parity
        if: steps.delta.outputs.verification_needed == 'true'
        run: node scripts/verify-tennis-europe-agenda-d1.mjs
      - name: Confirm verified Tennis Europe import hash
        if: steps.delta.outputs.verification_needed == 'true'
        run: |
          node scripts/prepare-tennis-europe-delta.mjs confirm
          LOCAL_IMPORT_HASH=$(tr -d '\r\n' < seed-tennis-europe-oop/import-hash.txt)
          test "${#LOCAL_IMPORT_HASH}" -eq 64
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc \
            --command "UPDATE generations SET counts_json=json_set(COALESCE(counts_json,'{}'),'$.teImportHash','$LOCAL_IMPORT_HASH') WHERE id='current'"
      - name: Verify fresh D1 runtime release before deployment
        run: node scripts/sync-runtime-documents-d1.mjs
      - name: Validate Worker API
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc
      - name: Deploy Worker API
        id: deploy
        run: |
          npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc 2>&1 | tee deploy-output.txt
          API_URL=$(sed -n 's/.*\(https:\/\/[^[:space:]]*\.workers\.dev\).*/\1/p' deploy-output.txt | tail -1)
          test -n "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Verify Europe API and daily agenda
        env:
          API_BASE: ${{ steps.deploy.outputs.api_url }}
          VERIFY_SCOPE: tennis-europe
        working-directory: .
        run: node src/v3/verify-cloudflare-api-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-europe-draw-walkover-audit
          path: |
            cloudflare/app-api/seed-tennis-europe-oop/draw-walkover-audit.json
            cloudflare/app-api/seed-tennis-europe-oop/delta/import-report.json
            cloudflare/app-api/seed-tennis-europe-oop/receipts/import-report.json
            cloudflare/app-api/seed-tennis-europe-oop/delta-plan.json
          if-no-files-found: warn
          retention-days: 14
