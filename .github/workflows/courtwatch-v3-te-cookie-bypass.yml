name: Court Watch v3 Tennis Europe cookie bypass

on:
  workflow_dispatch:
  push:
    paths:
      - 'courtwatch-v3-te-cookie-bypass-trigger.json'
      - 'src/v3/diagnose-tennis-europe-cookie-bypass.mjs'
      - '.github/workflows/courtwatch-v3-te-cookie-bypass.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set +e
          node src/v3/diagnose-tennis-europe-cookie-bypass.mjs > courtwatch-v3-te-cookie-bypass-run.log 2>&1
          echo "teCookieBypassExit=$?" >> courtwatch-v3-te-cookie-bypass-run.log
      - run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/tennis_europe_cookie_bypass_diagnostic.json courtwatch-v3-te-cookie-bypass-run.log
          git commit -m "Run Court Watch v3 Tennis Europe cookie bypass diagnostic" || echo "No changes"
          git push
