name: Court Watch v3 TennisTalker Anna diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/diagnose-tennistalker-anna.mjs'
      - 'courtwatch-v3-tennistalker-anna-trigger.json'
      - '.github/workflows/courtwatch-v3-tennistalker-anna-diagnostic.yml'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-tennistalker-anna
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose TennisTalker Anna data source
        run: |
          set +e
          : > courtwatch-v3-tennistalker-anna-run.log
          node src/v3/diagnose-tennistalker-anna.mjs >> courtwatch-v3-tennistalker-anna-run.log 2>&1
          code=$?
          echo "tennistalkerExit=$code" >> courtwatch-v3-tennistalker-anna-run.log
          cat courtwatch-v3-tennistalker-anna-run.log
          exit $code
      - name: Commit TennisTalker diagnostic
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/tennistalker_anna_diagnostic.json courtwatch-v3-tennistalker-anna-run.log src/v3/diagnose-tennistalker-anna.mjs .github/workflows/courtwatch-v3-tennistalker-anna-diagnostic.yml
          git commit -m "Build TennisTalker Anna diagnostic" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
