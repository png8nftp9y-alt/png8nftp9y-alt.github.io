name: Court Watch Liu and Calugar identity partitions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-liu-calugar-review.yml'
      - 'cloudflare/app-api/scripts/apply-liu-calugar-review.mjs'
      - 'cloudflare/app-api/data/user-approved-liu-calugar-20261108.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify identity mapping and review queue
        run: node --test test/player-identity-mapping.test.mjs test/identity-review-queue.test.mjs
      - run: node scripts/configure-d1.mjs
      - name: Apply the approved Liu and Calugar partitions and verify D1
        run: node scripts/apply-liu-calugar-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liu-calugar-review-readback
          path: cloudflare/app-api/tmp/liu-calugar-review.json
          retention-days: 30
