name: Court Watch Pietro Sala profile and acquired ITF history repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-pietro-sala-profile-repair.yml', 'cloudflare/app-api/scripts/repair-pietro-sala-profile.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      # D1_WRITE_POLICY: incremental; exact official source IDs, conditional writes.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test test/confirmed-pietro-sala-link.test.mjs test/pietro-sala-profile-repair.test.mjs
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - run: npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Save exact official profile metadata and index acquired ITF matches
        run: node scripts/repair-pietro-sala-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pietro-sala-profile-and-history-repair
          path: cloudflare/app-api/tmp/pietro-sala-profile-repair.json
          retention-days: 30
