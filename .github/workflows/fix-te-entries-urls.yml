name: Correct Tennis Europe scanner URLs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fix-te-entries-urls.mjs, .github/workflows/fix-te-entries-urls.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node fix-te-entries-urls.mjs && node --check te-entries.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add te-entries.mjs
          git commit -m 'Correct Tennis Europe scanner URLs'
          git pull --rebase origin main
          git push
