name: Court Watch v3 FITP player probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/probe-fitp-player-by-name.mjs'
      - 'courtwatch-v3-fitp-player-probe-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-player-probe.yml'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-fitp-player-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe FITP player by name
        run: |
          set +e
          : > courtwatch-v3-fitp-player-probe-run.log
          FITP_PLAYER_NAME='GARIBALDI MATTIA' FITP_PLAYER_TERMS='GARIBALDI MATTIA,MATTIA GARIBALDI,GARIBALDI' node src/v3/probe-fitp-player-by-name.mjs >> courtwatch-v3-fitp-player-probe-run.log 2>&1
          code=$?
          echo "probeExit=$code" >> courtwatch-v3-fitp-player-probe-run.log
          cat courtwatch-v3-fitp-player-probe-run.log
          exit $code
      - name: Commit FITP player probe output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/fitp_player_probe_mattia_garibaldi.json courtwatch-v3-fitp-player-probe-run.log .github/workflows/courtwatch-v3-fitp-player-probe.yml src/v3/probe-fitp-player-by-name.mjs
          git commit -m "Probe Mattia Garibaldi FITP profile" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
