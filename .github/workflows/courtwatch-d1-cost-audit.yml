name: Court Watch D1 cost audit
# Manual diagnostic trigger: 2026-09-19 (cost attribution for 2026-10-15 projection)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-d1-cost-audit.yml', 'cloudflare/app-api/lib/d1-cost-budget.mjs', 'cloudflare/app-api/test/d1-cost-budget.test.mjs']
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-cost-audit
  cancel-in-progress: false
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node --test test/d1-cost-budget.test.mjs
      - run: node scripts/configure-d1.mjs
      - name: Read-only D1 query attribution
        run: |
          npx wrangler d1 insights courtwatch-app --config wrangler.generated.jsonc --timePeriod=31d --sort-type=sum --sort-by=reads --sort-direction=DESC --limit=50 --json > /tmp/d1-reads.json
          npx wrangler d1 insights courtwatch-app --config wrangler.generated.jsonc --timePeriod=31d --sort-type=sum --sort-by=writes --sort-direction=DESC --limit=30 --json > /tmp/d1-writes.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {d1CostBudget} from './lib/d1-cost-budget.mjs';
          function load(path){const raw=fs.readFileSync(path,'utf8');const start=raw.indexOf('[');if(start<0)throw Error('No JSON from insights');return JSON.parse(raw.slice(start))}
          function sanitize(q){return String(q||'').replace(/'(?:''|[^'])*'/g,"'?'").replace(/\b\d+(?:\.\d+)?\b/g,'?').replace(/\s+/g,' ').trim().slice(0,500)}
          function view(rows){return rows.map(x=>({query:sanitize(x.query),totalRowsRead:x.totalRowsRead,avgRowsRead:x.avgRowsRead,totalRowsWritten:x.totalRowsWritten,avgRowsWritten:x.avgRowsWritten,numberOfTimesRun:x.numberOfTimesRun,queryEfficiency:x.queryEfficiency}))}
          const reads=view(load('/tmp/d1-reads.json')),writes=view(load('/tmp/d1-writes.json'));
          const budget=d1CostBudget(reads,writes);
          console.log('D1_COST_AUDIT_READS='+JSON.stringify(reads));
          console.log('D1_COST_AUDIT_WRITES='+JSON.stringify(writes));
          console.log('D1_COST_BUDGET='+JSON.stringify(budget));
          const message=`D1 Insights: ${budget.status}; projected reads ${budget.projectedMonthlyReads}, writes ${budget.projectedMonthlyWrites}. Selected top query groups only: this is a lower-bound estimate, not billing-cycle usage.`;
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,message+'\n');
          if(budget.status==='warning')console.log('::warning::'+message);
          if(budget.status==='exceeded'){console.error('::error::'+message);process.exit(1);}
          NODE
