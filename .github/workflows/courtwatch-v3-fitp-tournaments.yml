name: Court Watch v3 FITP tournament discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp-tournaments.mjs'
      - 'courtwatch-v3-fitp-tournaments-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-tournaments.yml'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-tournaments,cancel-in-progress: true}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run FITP tournament discovery only
        run: |
          set +e
          node src/v3/discover-fitp-tournaments.mjs > courtwatch-v3-fitp-tournaments-run.log 2>&1
          code=$?
          echo "exitCode=$code" >> courtwatch-v3-fitp-tournaments-run.log
          cat courtwatch-v3-fitp-tournaments-run.log
          exit $code
      - name: Commit FITP tournaments
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_tournaments.json courtwatch-v3-fitp-tournaments-run.log .github/workflows/courtwatch-v3-fitp-tournaments.yml
          git commit -m "Build Court Watch v3 FITP tournament discovery" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
