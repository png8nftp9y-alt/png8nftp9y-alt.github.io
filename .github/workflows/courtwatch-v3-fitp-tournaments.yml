name: Court Watch v3 FITP tournament discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp-tournaments.mjs'
      - 'courtwatch-v3-fitp-tournaments-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-tournaments.yml'
permissions: {contents: write}
concurrency:
  group: court-watch-v3-fitp-tournaments-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run reliable FITP tournament discovery only
        run: |
          set +e
          tmpLog="courtwatch-v3-fitp-tournaments-run.tmp.log"
          : > "$tmpLog"
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          echo "sourceSha=${GITHUB_SHA}" >> "$tmpLog"
          echo "runId=${GITHUB_RUN_ID}" >> "$tmpLog"
          node src/v3/discover-fitp-tournaments.mjs >> "$tmpLog" 2>&1
          code=$?
          echo "exitCode=$code" >> "$tmpLog"
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          cp "$tmpLog" courtwatch-v3-fitp-tournaments-run.log
          cat courtwatch-v3-fitp-tournaments-run.log
          exit $code
      - name: Commit FITP tournaments
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          if [ ! -s courtwatch-v3-fitp-tournaments-run.log ]; then
            echo "No non-empty tournament log produced; skipping commit."
            exit 0
          fi
          git add dist/v3/source_fitp_tournaments.json dist/v3/source_fitp_tournaments_audit.json courtwatch-v3-fitp-tournaments-run.log .github/workflows/courtwatch-v3-fitp-tournaments.yml
          git commit -m "Build Court Watch v3 reliable FITP tournament discovery" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
