name: Court Watch Brallo order of play force
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['oop-force-trigger.json','fitp-order-of-play.mjs','restore-brallo-opponents.mjs','.github/workflows/courtwatch-brallo-oop-force.yml']
permissions: {contents: write}
concurrency: {group: court-watch-brallo-oop-force,cancel-in-progress: true}
jobs:
  oop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Extract official order of play
        run: |
          set +e
          : > brallo-oop-force.log
          timeout 180 node fitp-order-of-play.mjs >> brallo-oop-force.log 2>&1; OOP=$?
          timeout 60 node restore-brallo-opponents.mjs >> brallo-oop-force.log 2>&1; RESTORE=$?
          timeout 30 node courtwatch-audit.mjs >> brallo-oop-force.log 2>&1; AUDIT=$?
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data.json','utf8'));fs.writeFileSync('brallo-oop-force-heartbeat.json',JSON.stringify({at:new Date().toISOString(),orderOfPlay:process.argv[1],restoreOpponents:process.argv[2],audit:process.argv[3],orderOfPlaySync:d.fitpOrderOfPlaySync||null,opponentRestore:d.bralloOpponentRestore||null,matches:(d.matches||[]).length},null,2)+'\n')" "$OOP" "$RESTORE" "$AUDIT"
          exit 0
      - name: Publish order of play
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json fitp-order-of-play.json fitp-order-of-play-text.txt courtwatch-data-audit.json brallo-oop-force-heartbeat.json brallo-oop-force.log brallo-opponent-restore.json
          git commit -m 'Update Brallo order of play times' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
