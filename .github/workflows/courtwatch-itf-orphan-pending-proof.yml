name: Court Watch ITF orphan pending contract
on:
  push:
    branches: ['test/itf-orphan-pending-selection']
    paths: ['.github/workflows/courtwatch-itf-orphan-pending-proof.yml']
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check src/v3/itf-t1-candidates.mjs
          node --check src/v3/build-itf-t1-tournament-matrix.mjs
          node --check src/v3/inventory-itf-history-tournament.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {persistedTournament,t1Candidates} from './src/v3/itf-t1-candidates.mjs';
          const orphan={competitionId:'J-ORPHAN',decision:'pending',eventInventory:[{combo:{sourceUrl:'https://www.itftennis.com/en/tournament/orphan/xx/2026/j-orphan/'}}]};
          assert.equal(persistedTournament(orphan).sourceUrl.includes('/orphan/'),true);
          const rows=t1Candidates([{competitionId:'J-CURRENT',startDate:'2026-09-01',endDate:'2026-09-02'}],{'J-ORPHAN':orphan,'J-DONE':{competitionId:'J-DONE',decision:'complete'}},'2026-09-01','2026-09-02',[]);
          assert.deepEqual(new Set(rows.map(x=>x.competitionId)),new Set(['J-CURRENT','J-ORPHAN']));
          assert.deepEqual(t1Candidates([],{'J-ORPHAN':orphan},'2026-09-01','2026-09-02',['J-ORPHAN']).map(x=>x.competitionId),['J-ORPHAN']);
          console.log('orphan pending contract: 3/3 passed');
          NODE
