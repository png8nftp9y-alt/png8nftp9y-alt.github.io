name: Fix official ITF position display
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fix-itf-position-display.mjs, .github/workflows/fix-itf-position-display.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          node fix-itf-position-display.mjs
          node courtwatch-live-hotfix-v2.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add itf-entries.mjs courtwatch-live-hotfix-v2.mjs data.json live-hotfix-v2.json
          git commit -m 'Use official ITF positionDisplay values'
          git pull --rebase origin main
          git push
