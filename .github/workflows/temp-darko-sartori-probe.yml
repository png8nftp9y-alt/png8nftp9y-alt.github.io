name: Temporary FITP Darko Sartori profile probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-darko-sartori-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Find official FITP profile
        env:
          FITP_PLAYER_NAME: Darko Sartori
          FITP_PLAYER_TERMS: Darko Sartori,Sartori Darko
        run: node src/v3/probe-fitp-player-by-name.mjs
      - name: Publish probe result
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/fitp_player_probe_darko-sartori.json
          git commit -m "Record temporary Darko Sartori FITP profile probe" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
