name: Court Watch Others database read-only snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-others-database-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Replay Others snapshot locally with SELECT-only remote database adapter
        run: node tools/inspect-others-database-readonly.mjs
