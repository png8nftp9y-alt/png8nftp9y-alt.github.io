name: Court Watch Rota Gelpi birth and Kowzan reviewed identities
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-rota-kowzan-review.yml'
      - 'cloudflare/app-api/scripts/apply-rota-kowzan-review.mjs'
      - 'cloudflare/app-api/data/user-approved-rota-kowzan-20261128.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact association, separate homonym and reviewed birth year
        run: node --test test/rota-kowzan-review.test.mjs test/apply-reviewed-player-birth.test.mjs
      - run: node scripts/configure-d1.mjs
      - name: Apply user decisions and verify D1 readback
        run: node scripts/apply-rota-kowzan-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rota-kowzan-review
          path: cloudflare/app-api/tmp/rota-kowzan-review.json
          retention-days: 30
