name: Enable direct live data source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [enable-live-source.mjs, .github/workflows/enable-live-source.yml]
permissions: {contents: write}
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node enable-live-source.mjs && node --check app.js
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add app.js index.html live-source-version.json
          git commit -m 'Read live data directly from synchronized source'
          git pull --rebase origin main
          git push
