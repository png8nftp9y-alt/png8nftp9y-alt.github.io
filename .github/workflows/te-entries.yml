name: Sync Tennis Europe tournament entries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [te-entries.mjs, players.json, .github/workflows/te-entries.yml]
  schedule:
    - cron: '17 */3 * * *'
permissions: {contents: write}
concurrency: {group: court-watch-te-entries,cancel-in-progress: true}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check te-entries.mjs && node te-entries.mjs
      - run: node courtwatch-finalize.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add data.json te-entries.json
          if ! git diff --cached --quiet; then git commit -m 'Sync verified Tennis Europe entries'; git pull --rebase origin main; git push; fi
