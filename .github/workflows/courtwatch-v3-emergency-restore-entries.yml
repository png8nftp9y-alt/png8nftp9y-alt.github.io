name: Court Watch v3 emergency restore entries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'courtwatch-v3-emergency-restore-entries-trigger.json'
      - '.github/workflows/courtwatch-v3-emergency-restore-entries.yml'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-emergency-restore-entries
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last valid V3 source files and Garibaldi ranking
        run: |
          set -e
          : > courtwatch-v3-emergency-restore-entries-run.log
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-emergency-restore-entries-run.log
          echo "sourceSha=${GITHUB_SHA}" >> courtwatch-v3-emergency-restore-entries-run.log
          GOOD=37347bdd0484d704c7762707f0e5fbb94f43c8a0
          git show $GOOD:players.json > players.json
          git show $GOOD:dist/v3/source_fitp_entries.json > dist/v3/source_fitp_entries.json
          git show $GOOD:dist/v3/source_tennis_europe_entries.json > dist/v3/source_tennis_europe_entries.json
          node - <<'NODE'
          const fs=require('fs');
          const p='players.json';
          const doc=JSON.parse(fs.readFileSync(p,'utf8'));
          const pl=doc.players.find(x=>x.id==='mattia-garibaldi');
          if(!pl) throw new Error('mattia-garibaldi missing');
          pl.ranking='4.1';
          doc.profileSyncUpdatedAt=new Date().toISOString();
          fs.writeFileSync(p, JSON.stringify(doc,null,2)+'\n');
          NODE
          node src/v3/entries-engine.mjs >> courtwatch-v3-emergency-restore-entries-run.log 2>&1
          echo "entriesMergeExit=0" >> courtwatch-v3-emergency-restore-entries-run.log
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-emergency-restore-entries-run.log
          cat courtwatch-v3-emergency-restore-entries-run.log
      - name: Commit restored outputs
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add players.json dist/v3/source_fitp_entries.json dist/v3/source_tennis_europe_entries.json dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/entries_fitp.json dist/v3/entries_tennis_europe.json dist/v3/entries_itf.json dist/v3/sync_status.json dist/v3/diagnostics.json dist/v3/entries_log.json courtwatch-v3-emergency-restore-entries-run.log .github/workflows/courtwatch-v3-emergency-restore-entries.yml
          git commit -m "Emergency restore V3 tournament entries" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
