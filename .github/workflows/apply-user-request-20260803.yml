name: Apply Court Watch tournament and bracket fixes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apply-user-request-20260803.mjs, courtwatch-finalize.mjs, puc-opponent-meta.mjs, .github/workflows/apply-user-request-20260803.yml]
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node apply-user-request-20260803.mjs
      - run: node --check puc-entries-fast.mjs && node --check te-profile-sync.mjs && node --check app.js && node --check courtwatch-finalize.mjs && node --check puc-opponent-meta.mjs
      - run: node courtwatch-finalize.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add puc-entries-fast.mjs te-profile-sync.mjs app.js data.json .github/workflows/puc-fast.yml .github/workflows/puc-results.yml .github/workflows/public-monitor.yml
          if ! git diff --cached --quiet; then git commit -m 'Apply bracket, duplicate and presentation fixes'; git pull --rebase origin main; git push; fi
