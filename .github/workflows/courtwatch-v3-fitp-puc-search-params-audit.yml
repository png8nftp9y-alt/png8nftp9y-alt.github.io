name: Court Watch v3 FITP PUC search params audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/audit-fitp-puc-search-params.mjs'
      - 'courtwatch-v3-fitp-puc-search-params-audit-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-puc-search-params-audit.yml'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-puc-search-params-audit,cancel-in-progress: true}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run FITP PUC search parameter audit
        run: |
          set +e
          node src/v3/audit-fitp-puc-search-params.mjs > courtwatch-v3-fitp-puc-search-params-audit-run.log 2>&1
          code=$?
          cat courtwatch-v3-fitp-puc-search-params-audit-run.log
          exit $code
      - name: Commit FITP PUC search parameter audit
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_puc_search_params_audit.json courtwatch-v3-fitp-puc-search-params-audit-run.log .github/workflows/courtwatch-v3-fitp-puc-search-params-audit.yml
          git commit -m "Build Court Watch v3 FITP PUC search parameter audit" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
