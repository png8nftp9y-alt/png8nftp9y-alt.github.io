name: Court Watch v3 ITF fresh-runner proof
# One tournament per isolated GitHub runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-v3-itf-fresh-runner-proof.yml']
permissions: {contents: read}
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        competition: [J-J30-POR-2026-001]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read one tournament on one fresh runner
        env:
          ITF_COMPETITION_ID: ${{ matrix.competition }}
          ITF_REQUEST_TIMEOUT_MS: '30000'
          ITF_REQUEST_DELAY_MS: '900'
          ITF_EVENT_KEY: 'G-D-M-KO'
        run: node src/v3/scan-itf-history-event.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-fresh-runner-${{ matrix.competition }}
          path: dist/v3/itf_event_proof.json.gz
