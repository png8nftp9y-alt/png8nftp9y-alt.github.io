# D1_WRITE_POLICY: incremental; source data is never rewritten by this audit.
name: Court Watch daily complete D1 verification
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-d1-daily-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts
      - name: Check native-ID audit SQL and failure diagnostics
        run: node --test test/all-player-id-audit.test.mjs test/player-id-audit-scope.test.mjs
      - name: Configure existing database and apply additive migrations
        run: |
          node scripts/configure-d1.mjs
          migration_log=$(mktemp)
          trap 'rm -f "$migration_log"' EXIT
          if npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc >"$migration_log" 2>&1; then
            cat "$migration_log"
          else
            status=$?
            cat "$migration_log"
            if ! grep -Eq 'code:[[:space:]]*7429([^0-9]|$)' "$migration_log"; then
              exit "$status"
            fi
            echo "D1 7429: attendo 11 secondi e riprovo le migrazioni una volta."
            sleep 11
            npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
          fi
      - name: Reconcile complete counts once per UTC date
        id: counts
        run: node scripts/daily-d1-verification.mjs
      - name: Check native ID coverage across all players
        run: node scripts/all-player-id-audit.mjs
      - name: Check circuit identity coverage
        if: ${{ !cancelled() && steps.counts.outcome == 'success' }}
        run: |
          # Keep the two scans outside the same 10-second D1 load window.
          sleep 11
          node scripts/per-circuit-player-id-audit.mjs
