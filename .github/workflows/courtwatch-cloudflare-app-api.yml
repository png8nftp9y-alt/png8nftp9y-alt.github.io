name: Court Watch Cloudflare D1 and app API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/**'
      - 'dist/v3/universal/**'
      - 'src/v3/verify-cloudflare-api-parity.mjs'
      - '.github/workflows/courtwatch-cloudflare-app-api.yml'

permissions:
  contents: read

concurrency:
  group: courtwatch-cloudflare-app-api
  cancel-in-progress: true

jobs:
  migrate-import-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Check source
        run: npm run check
      - name: Create or reuse Court Watch D1
        id: d1
        run: npm run configure
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Build and import universal generation
        run: |
          npm run seed
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file seed-universal.sql
      - name: Verify D1 parity with universal manifest
        run: npm run verify
      - name: Validate Worker API
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc
      - name: Deploy Worker API
        id: deploy
        run: |
          npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc 2>&1 | tee deploy-output.txt
          API_URL=$(sed -n 's/.*\(https:\/\/[^[:space:]]*\.workers\.dev\).*/\1/p' deploy-output.txt | tail -1)
          test -n "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Verify live API and legacy app parity
        env:
          API_BASE: ${{ steps.deploy.outputs.api_url }}
        working-directory: .
        run: node src/v3/verify-cloudflare-api-parity.mjs
