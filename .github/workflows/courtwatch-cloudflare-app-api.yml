# D1_WRITE_POLICY: incremental
name: Court Watch Cloudflare D1 and app API

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Rebuild the complete observed-player index
        type: boolean
        default: false
  workflow_run:
    # Preserve the original publication chain: Europe OOP -> Agenda D1 -> general D1.
    # Consolidate all producers from current main after the verified Agenda gate.
    workflows:
      - Court Watch Tennis Europe agenda D1
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/**'
      # Worker-only code/assets are published by the dedicated hotfix workflow.
      - '!cloudflare/app-api/src/**'
      - '!cloudflare/app-api/test/**'
      - '!cloudflare/app-api/scripts/prepare-runtime-assets.mjs'
      - '!cloudflare/app-api/scripts/verify-static-flags.mjs'
      - '!cloudflare/app-api/scripts/audit-github-d1-completeness.mjs'
      - '!cloudflare/app-api/scripts/github-d1-reconciliation.mjs'
      - '!cloudflare/app-api/scripts/github-d1-audit-scope.mjs'
      - '!cloudflare/app-api/scripts/read-audit-projection.mjs'
      # The FITP metadata acquisition has its own incremental writer.
      - '!cloudflare/app-api/scripts/sync-fitp-player-metadata.mjs'
      - '!cloudflare/app-api/lib/fitp-write-reconciliation.mjs'
      - '!cloudflare/app-api/scripts/generate-tennis-europe-oop-seed.mjs'
      - '!cloudflare/app-api/scripts/generate-tennis-europe-app-candidates.mjs'
      - '!cloudflare/app-api/scripts/restore-tennis-europe-oop.sh'
      - '!cloudflare/app-api/scripts/verify-tennis-europe-agenda-d1.mjs'
      - '!cloudflare/app-api/migrations/0006_tennis_europe_oop.sql'
      - '!cloudflare/app-api/migrations/0007_app_match_candidates.sql'
      - 'src/v3/build-universal-database.mjs'
      - 'src/v3/historical-tournament-catalogue.mjs'
      - 'dist/v3/universal/**'
      - 'data.json'
      - 'players.json'
      - 'dist/v3/tournament_entries.json'
      - 'dist/v3/tournaments.json'
      - 'dist/v3/agenda.json'
      - 'dist/v3/results.json'
      - '.github/workflows/courtwatch-cloudflare-app-api.yml'
      - '.github/workflows/courtwatch-authenticated-crud-smoke.yml'
      - '.github/workflows/courtwatch-tennis-europe-agenda.yml'

permissions:
  contents: read

concurrency:
  group: courtwatch-app-refresh${{ ((github.event_name == 'workflow_dispatch' && inputs.full_refresh) || (github.event_name == 'push' && (github.event.head_commit.message == 'Sync official Court Watch players' || startsWith(github.event.head_commit.message, 'Repair D1 observed index')))) && '-full' || '' }}-${{ github.event.workflow_run.conclusion || 'success' }}
  cancel-in-progress: false
  queue: single

jobs:
  check-source:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check source outside the D1 writer queue
        working-directory: cloudflare/app-api
        run: npm run check
  release-safety:
    needs: check-source
    uses: ./.github/workflows/courtwatch-release-safety.yml
    with:
      source_sha: ${{ needs.check-source.outputs.source_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  migrate-import-verify-deploy:
    needs: [check-source, release-safety]
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # D1_WRITE_POLICY: incremental
      # A newly synchronized player must rebuild the observed index once; routine runs keep the no-op path.
      D1_SKIP_OBSERVED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_refresh) || (github.event_name == 'push' && (github.event.head_commit.message == 'Sync official Court Watch players' || startsWith(github.event.head_commit.message, 'Repair D1 observed index')))) && '0' || '1' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Block deployment unless exact code passed required safety
        working-directory: .
        run: node tools/ensure-release-safety.mjs --expect "${{ needs.release-safety.outputs.code_fingerprint }}"
      - name: Configure private R2 reads
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --quiet awscli
      - run: npm install
      - name: Recheck source only when code advanced during the wait
        if: env.COURTWATCH_RELEASE_RECHECKED != 'true'
        env:
          CHECKED_SHA: ${{ needs.check-source.outputs.source_sha }}
        run: |
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CHECKED_SHA"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$CHECKED_SHA" HEAD -- cloudflare/app-api src/v3 tools/tests v3.js v3.html v3.css .github/workflows; then
            npm run check
          fi
      - name: Create or reuse Court Watch D1
        id: d1
        run: npm run configure
      - name: Verify D1 runtime content before the early Worker deployment
        run: node scripts/sync-runtime-documents-d1.mjs
      - name: Deploy read-compatible Worker before database maintenance
        run: npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc
      - name: Apply D1 migrations
        if: github.event_name != 'workflow_run'
        run: npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Verify personal-history indexed read plans
        run: node scripts/verify-personal-history-read-plans.mjs
      - name: Restore current observed-player indexes from R2
        if: env.D1_SKIP_OBSERVED != '1'
        run: bash scripts/restore-observed-indexes.sh
      - name: Restore FITP and ITF opponent-entry indexes from R2
        run: bash scripts/restore-opponent-entry-indexes.sh
      - name: Restore verified Europe OOP history and live snapshot
        run: bash scripts/restore-tennis-europe-oop.sh
      - name: Build universal observed-player index
        if: env.D1_SKIP_OBSERVED != '1'
        run: node scripts/build-observed-player-index.mjs
      - name: Rebuild current universal projection
        working-directory: .
        run: |
          node --test tools/tests/historical-tournament-catalogue.test.mjs
          node src/v3/build-universal-database.mjs
          node src/v3/validate-universal-database.mjs
      - name: Build and import universal generation
        id: import
        run: |
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --json \
            --command "SELECT json_extract(counts_json, '$.importHash') AS import_hash,counts_json FROM generations WHERE id='current'" \
            > remote-import-hash.json
          D1_REMOTE_GENERATION_FILE=remote-import-hash.json npm run seed
          LOCAL_IMPORT_HASH=$(tr -d '\r\n' < seed-universal/import-hash.txt)
          REMOTE_IMPORT_HASH=$(node -e "const fs=require('fs'),x=JSON.parse(fs.readFileSync('remote-import-hash.json','utf8'));let found='';const walk=v=>{if(!v||found)return;if(Array.isArray(v))return v.forEach(walk);if(typeof v==='object'){if(typeof v.import_hash==='string')found=v.import_hash;else Object.values(v).forEach(walk)}};walk(x);process.stdout.write(found)")
          if [ -n "$REMOTE_IMPORT_HASH" ] && [ "$LOCAL_IMPORT_HASH" = "$REMOTE_IMPORT_HASH" ]; then
            VERIFIED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc               --command "UPDATE generations SET generated_at='$VERIFIED_AT' WHERE id='current' AND json_extract(counts_json, '$.importHash')='$LOCAL_IMPORT_HASH'"
            echo "D1_IMPORT_SKIPPED unchanged=$LOCAL_IMPORT_HASH rows_written=0"
            echo "D1_METADATA_REFRESHED rows_written=1 verified_at=$VERIFIED_AT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/guard-d1-import.mjs seed-universal/*.sql
            for sql_file in seed-universal/*.sql; do
              echo "Importing $sql_file"
              npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and import opponent tournament entries
        run: |
          node scripts/generate-opponent-entry-seed.mjs --prepare
          LOCAL_ENTRY_HASH=$(tr -d '\r\n' < seed-opponent-entries/hash.txt)
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --json \
            --command "SELECT value FROM app_state WHERE key='opponentEntryHash'" > remote-opponent-entry-hash.json
          REMOTE_ENTRY_HASH=$(node -e "const fs=require('fs'),x=JSON.parse(fs.readFileSync('remote-opponent-entry-hash.json','utf8'));let found='';const walk=v=>{if(!v||found)return;if(Array.isArray(v))return v.forEach(walk);if(typeof v==='object'){if(typeof v.value==='string')found=v.value;else Object.values(v).forEach(walk)}};walk(x);process.stdout.write(found)")
          if [ -n "$REMOTE_ENTRY_HASH" ] && [ "$LOCAL_ENTRY_HASH" = "$REMOTE_ENTRY_HASH" ]; then
            echo "OPPONENT_ENTRY_IMPORT_SKIPPED unchanged=$LOCAL_ENTRY_HASH rows_written=0"
          else
            node scripts/export-opponent-entry-state.mjs
            node scripts/generate-opponent-entry-seed.mjs --from-prepared
            for sql_file in seed-opponent-entries/*.sql; do
              echo "Importing $sql_file"
              npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"
            done
          fi
      - name: Recover missing clubs for personal FITP players
        run: node scripts/sync-personal-fitp-clubs.mjs
      - name: Apply user-confirmed personal birth years
        run: node scripts/sync-confirmed-personal-birth-years.mjs
      - name: Build read-only Europe parity manifests
        if: steps.import.outputs.changed == 'true'
        run: |
          npm run seed:te-oop
          npm run seed:te-candidates
      - name: Verify D1 parity with universal and Europe OOP manifests
        if: steps.import.outputs.changed == 'true'
        run: npm run verify
      - name: Verify fresh D1 runtime release before deployment
        run: node scripts/sync-runtime-documents-d1.mjs
      - name: Validate Worker API
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc
      - name: Deploy Worker API
        id: deploy
        run: |
          npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc 2>&1 | tee deploy-output.txt
          API_URL=$(sed -n 's/.*\(https:\/\/[^[:space:]]*\.workers\.dev\).*/\1/p' deploy-output.txt | tail -1)
          test -n "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Verify live API and legacy app parity
        env:
          API_BASE: ${{ steps.deploy.outputs.api_url }}
        working-directory: .
        run: node src/v3/verify-cloudflare-api-parity.mjs
