name: Court Watch Cloudflare D1 and app API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/**'
      - '!cloudflare/app-api/scripts/generate-tennis-europe-oop-seed.mjs'
      - '!cloudflare/app-api/scripts/generate-tennis-europe-app-candidates.mjs'
      - '!cloudflare/app-api/scripts/restore-tennis-europe-oop.sh'
      - '!cloudflare/app-api/scripts/verify-tennis-europe-agenda-d1.mjs'
      - '!cloudflare/app-api/migrations/0006_tennis_europe_oop.sql'
      - '!cloudflare/app-api/migrations/0007_app_match_candidates.sql'
      - 'dist/v3/universal/**'
      - 'data.json'
      - 'players.json'
      - 'dist/v3/tournament_entries.json'
      - 'dist/v3/tournaments.json'
      - 'dist/v3/agenda.json'
      - 'dist/v3/results.json'
      - '.github/workflows/courtwatch-cloudflare-app-api.yml'

permissions:
  contents: read

concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false

jobs:
  migrate-import-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Configure private R2 reads
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --quiet awscli
      - run: npm install
      - name: Check source
        run: npm run check
      - name: Create or reuse Court Watch D1
        id: d1
        run: npm run configure
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Restore current observed-player indexes from R2
        run: bash scripts/restore-observed-indexes.sh
      - name: Restore verified Europe OOP history and live snapshot
        run: bash scripts/restore-tennis-europe-oop.sh
      - name: Build universal observed-player index
        run: node scripts/build-observed-player-index.mjs
      - name: Rebuild current universal projection
        working-directory: .
        run: |
          node src/v3/build-universal-database.mjs
          node src/v3/validate-universal-database.mjs
      - name: Build and import universal generation
        run: |
          npm run seed
          for sql_file in seed-universal/*.sql; do
            echo "Importing $sql_file"
            imported=0
            for attempt in 1 2 3 4; do
              if npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"; then
                imported=1
                break
              fi
              echo "Retry $attempt for $sql_file after transient D1 state"
              sleep $((attempt * 5))
            done
            test "$imported" -eq 1
          done
      - name: Build read-only Europe parity manifests
        run: |
          npm run seed:te-oop
          npm run seed:te-candidates
      - name: Verify D1 parity with universal and Europe OOP manifests
        run: npm run verify
      - name: Validate Worker API
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc
      - name: Deploy Worker API
        id: deploy
        run: |
          npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc 2>&1 | tee deploy-output.txt
          API_URL=$(sed -n 's/.*\(https:\/\/[^[:space:]]*\.workers\.dev\).*/\1/p' deploy-output.txt | tail -1)
          test -n "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Verify live API and legacy app parity
        env:
          API_BASE: ${{ steps.deploy.outputs.api_url }}
        working-directory: .
        run: node src/v3/verify-cloudflare-api-parity.mjs
