name: Court Watch Europe match profile recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-europe-match-profile-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      # D1_WRITE_POLICY: incremental; exact verified source deltas only.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify source provenance, conflicts, persistence and zero-write replay
        run: node --test test/europe-match-profile-recovery.test.mjs
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - name: Recover the missing Europe IDs and verify the production counter
        run: node scripts/recover-europe-match-profiles.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-match-profile-recovery
          path: cloudflare/app-api/tmp/europe-match-profile-recovery.json
          retention-days: 30
