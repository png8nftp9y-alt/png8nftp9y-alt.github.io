name: Court Watch opponent loading check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/lib/opponent-linked-identity.mjs'
      - 'cloudflare/app-api/lib/opponent-europe-sources.mjs'
      - 'cloudflare/app-api/lib/exact-current-ranking.mjs'
      - 'cloudflare/app-api/lib/opponent-canonical-history.mjs'
      - 'cloudflare/app-api/lib/opponent-profile-check.mjs'
      - 'cloudflare/app-api/lib/opponent-tournament-window.mjs'
      - 'cloudflare/app-api/scripts/verify-opponent-loading.mjs'
      - '.github/workflows/courtwatch-opponent-loading-check.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-opponent-loading-check
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify read-only check and query regression
        run: node --test cloudflare/app-api/test/opponent-tournament-window.test.mjs cloudflare/app-api/test/opponent-europe-display.test.mjs cloudflare/app-api/test/opponent-linked-id.test.mjs cloudflare/app-api/test/opponent-profile-check.test.mjs cloudflare/app-api/test/exact-current-ranking.test.mjs cloudflare/app-api/test/opponent-read-budget.test.mjs
      - name: Replay four real opponent profiles against D1 without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node cloudflare/app-api/scripts/verify-opponent-loading.mjs
