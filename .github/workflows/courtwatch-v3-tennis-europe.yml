name: Court Watch v3 Tennis Europe entries

on:
  workflow_dispatch:
  push:
    paths:
      - 'courtwatch-v3-tennis-europe-trigger.json'
      - 'src/v3/discover-tennis-europe.mjs'
      - 'src/v3/postprocess-tennis-europe-multievent.mjs'
      - 'src/v3/postprocess-tennis-europe-started-rules.mjs'
      - '.github/workflows/courtwatch-v3-tennis-europe.yml'
      - 'players.json'

permissions:
  contents: write

concurrency:
  group: courtwatch-v3-tennis-europe
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set +e
          : > courtwatch-v3-tennis-europe-run.log
          node src/v3/discover-tennis-europe.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
          te_code=$?
          echo "tennisEuropeExit=$te_code" >> courtwatch-v3-tennis-europe-run.log
          multi_code=0
          started_code=0
          if [ "$te_code" -eq 0 ]; then
            node src/v3/postprocess-tennis-europe-multievent.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
            multi_code=$?
            echo "tennisEuropeMultiEventExit=$multi_code" >> courtwatch-v3-tennis-europe-run.log
            if [ "$multi_code" -eq 0 ]; then
              node src/v3/postprocess-tennis-europe-started-rules.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
              started_code=$?
            else
              started_code=99
            fi
            echo "tennisEuropeStartedRulesExit=$started_code" >> courtwatch-v3-tennis-europe-run.log
          fi
          if [ "$te_code" -ne 0 ] || [ "$multi_code" -ne 0 ] || [ "$started_code" -ne 0 ]; then
            exit 1
          fi
      - if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_tennis_europe_entries.json dist/v3/source_tennis_europe_audit.json dist/v3/source_tennis_europe_multievent_audit.json dist/v3/source_tennis_europe_started_rules_audit.json courtwatch-v3-tennis-europe-run.log || true
          git commit -m "Build Court Watch v3 Tennis Europe entries" || echo "No changes"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
