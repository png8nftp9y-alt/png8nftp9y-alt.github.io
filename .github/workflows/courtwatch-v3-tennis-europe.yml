name: Court Watch v3 Tennis Europe entries

on:
  workflow_dispatch:
  push:
    paths:
      - 'courtwatch-v3-tennis-europe-trigger.json'
      - 'src/v3/discover-tennis-europe.mjs'
      - '.github/workflows/courtwatch-v3-tennis-europe.yml'
      - 'players.json'

permissions:
  contents: write

concurrency:
  group: courtwatch-v3-tennis-europe
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set +e
          node src/v3/discover-tennis-europe.mjs > courtwatch-v3-tennis-europe-run.log 2>&1
          echo "tennisEuropeExit=$?" >> courtwatch-v3-tennis-europe-run.log
      - run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_tennis_europe_entries.json courtwatch-v3-tennis-europe-run.log
          git commit -m "Build Court Watch v3 Tennis Europe entries" || echo "No changes"
          git push
