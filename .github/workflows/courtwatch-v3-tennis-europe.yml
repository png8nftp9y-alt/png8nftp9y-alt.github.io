name: Court Watch v3 Tennis Europe entries

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - 'courtwatch-v3-tennis-europe-trigger.json'
      - 'src/v3/discover-tennis-europe-tournaments.mjs'
      - 'src/v3/discover-tennis-europe-acceptance.mjs'
      - 'src/v3/verify-tennis-europe-draws.mjs'
      - 'src/v3/entries-engine.mjs'
      - '.github/workflows/courtwatch-v3-tennis-europe.yml'
      - 'players.json'

permissions:
  contents: write

concurrency:
  group: courtwatch-v3-tennis-europe
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set +e
          : > courtwatch-v3-tennis-europe-run.log

          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-tennis-europe-run.log
          echo "sourceSha=${GITHUB_SHA}" >> courtwatch-v3-tennis-europe-run.log
          echo "runId=${GITHUB_RUN_ID}" >> courtwatch-v3-tennis-europe-run.log

          node src/v3/discover-tennis-europe-tournaments.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
          tournaments_code=$?
          echo "tennisEuropeTournamentsExit=$tournaments_code" >> courtwatch-v3-tennis-europe-run.log

          if [ "$tournaments_code" -eq 0 ]; then
            node src/v3/discover-tennis-europe-acceptance.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
            acceptance_code=$?
          else
            acceptance_code=98
          fi
          echo "tennisEuropeAcceptanceExit=$acceptance_code" >> courtwatch-v3-tennis-europe-run.log

          if [ "$acceptance_code" -eq 0 ]; then
            node src/v3/verify-tennis-europe-draws.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
            draw_code=$?
          else
            draw_code=97
          fi
          echo "tennisEuropeDrawExit=$draw_code" >> courtwatch-v3-tennis-europe-run.log

          if [ "$draw_code" -eq 0 ]; then
            node src/v3/entries-engine.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
            entries_code=$?
          else
            entries_code=96
          fi
          echo "entriesEngineExit=$entries_code" >> courtwatch-v3-tennis-europe-run.log
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-tennis-europe-run.log

          cat courtwatch-v3-tennis-europe-run.log
          if [ "$tournaments_code" -ne 0 ] || [ "$acceptance_code" -ne 0 ] || [ "$draw_code" -ne 0 ] || [ "$entries_code" -ne 0 ]; then exit 1; fi
      - if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_tennis_europe_tournaments.json dist/v3/source_tennis_europe_tournaments_audit.json dist/v3/source_tennis_europe_entries.json dist/v3/source_tennis_europe_acceptance_audit.json dist/v3/source_tennis_europe_draw_audit.json dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/entries_tennis_europe.json dist/v3/sync_status.json dist/v3/diagnostics.json dist/v3/entries_log.json courtwatch-v3-tennis-europe-run.log .github/workflows/courtwatch-v3-tennis-europe.yml src/v3/discover-tennis-europe-tournaments.mjs src/v3/discover-tennis-europe-acceptance.mjs src/v3/verify-tennis-europe-draws.mjs || true
          git commit -m "Refactor Court Watch v3 Tennis Europe engine" || echo "No changes"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
