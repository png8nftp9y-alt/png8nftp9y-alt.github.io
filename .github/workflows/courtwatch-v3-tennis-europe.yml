name: Court Watch v3 Tennis Europe entries

on:
  workflow_dispatch:
  push:
    paths:
      - 'courtwatch-v3-tennis-europe-trigger.json'
      - 'src/v3/discover-tennis-europe.mjs'
      - 'src/v3/postprocess-tennis-europe-started-rules.mjs'
      - '.github/workflows/courtwatch-v3-tennis-europe.yml'
      - 'players.json'

permissions:
  contents: write

concurrency:
  group: courtwatch-v3-tennis-europe
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set +e
          : > courtwatch-v3-tennis-europe-run.log
          node src/v3/discover-tennis-europe.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
          te_code=$?
          echo "tennisEuropeExit=$te_code" >> courtwatch-v3-tennis-europe-run.log
          if [ "$te_code" -eq 0 ]; then
            node src/v3/postprocess-tennis-europe-started-rules.mjs >> courtwatch-v3-tennis-europe-run.log 2>&1
            echo "tennisEuropeStartedRulesExit=$?" >> courtwatch-v3-tennis-europe-run.log
          fi
      - run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_tennis_europe_entries.json dist/v3/source_tennis_europe_audit.json dist/v3/source_tennis_europe_started_rules_audit.json courtwatch-v3-tennis-europe-run.log
          git commit -m "Build Court Watch v3 Tennis Europe entries" || echo "No changes"
          git push
