name: Court Watch v3 Tennis Europe legacy control
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node src/v3/discover-tennis-europe-tournaments.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-europe-legacy-control
          path: |
            dist/v3/source_tennis_europe_tournaments.json
            dist/v3/source_tennis_europe_tournaments_audit.json
