name: Court Watch Tennis Europe OOP route discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-tennis-europe-oop-routes.mjs'
      - '.github/workflows/courtwatch-tennis-europe-oop-discovery.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-tennis-europe-oop-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover official OOP and result routes
        run: node src/v3/discover-tennis-europe-oop-routes.mjs
      - name: Validate diagnostic
        run: |
          node -e "const d=require('./dist/v3/tennis_europe_oop_route_diagnostic.json');if(d.status!=='route_candidates_found'||!d.usefulCandidateCount)process.exit(1);console.log(JSON.stringify({status:d.status,samples:d.sampleCount,candidates:d.usefulCandidateCount}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-europe-oop-route-diagnostic
          path: |
            dist/v3/tennis_europe_oop_route_diagnostic.json
            dist/v3/tennis-europe-oop-html/*.html
          if-no-files-found: error
          retention-days: 7
