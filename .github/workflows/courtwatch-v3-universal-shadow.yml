name: Court Watch v3 universal schema shadow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'players.json'
      - 'former-players.json'
      - 'dist/v3/tournament_entries.json'
      - 'dist/v3/agenda.json'
      - 'dist/v3/results.json'
      - 'src/v3/universal-data-model.mjs'
      - 'src/v3/build-universal-database.mjs'
      - 'src/v3/validate-universal-database.mjs'
      - 'docs/courtwatch-universal-schema-v1.md'
      - '.github/workflows/courtwatch-v3-universal-shadow.yml'
permissions: {contents: write}
concurrency: {group: courtwatch-v3-universal-shadow,cancel-in-progress: true}
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check syntax
        run: |
          node --check src/v3/universal-data-model.mjs
          node --check src/v3/build-universal-database.mjs
          node --check src/v3/validate-universal-database.mjs
      - name: Build universal shadow database
        run: node src/v3/build-universal-database.mjs
      - name: Validate identities references and coverage
        run: node src/v3/validate-universal-database.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: courtwatch-universal-shadow
          path: dist/v3/universal
          retention-days: 14
      - name: Publish consultable universal shadow
        run: |
          git config user.name "courtwatch-bot"
          git config user.email "courtwatch-bot@users.noreply.github.com"
          git add dist/v3/universal
          if git diff --cached --quiet; then
            echo "Universal shadow already current"
            exit 0
          fi
          git commit -m "Publish validated universal shadow database"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            git checkout -B universal-publish origin/main
            node src/v3/build-universal-database.mjs
            node src/v3/validate-universal-database.mjs
            git add dist/v3/universal
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Publish validated universal shadow database"
          done
          exit 1
