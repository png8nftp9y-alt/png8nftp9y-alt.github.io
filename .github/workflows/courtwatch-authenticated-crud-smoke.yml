name: Court Watch authenticated CRUD smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-authenticated-crud-smoke.yml'
      - 'cloudflare/app-api/src/index.js'
      - 'cloudflare/app-api/scripts/verify-analysis-ui.mjs'
  workflow_run:
    workflows: ['Court Watch Cloudflare D1 and app API']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: courtwatch-authenticated-crud-smoke
  cancel-in-progress: false

jobs:
  crud:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloudflare/app-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Configure remote D1
        run: node scripts/configure-d1.mjs
      - name: Verify admin and analysis implementation
        run: |
          npm run check
          grep -q "path==='/admin'" src/index.js
          grep -q "adminAuthorized(request,env)" src/index.js
          grep -q "user_match_analyses" src/index.js
      - name: Verify deployed access boundaries
        working-directory: .
        run: |
          set -euo pipefail
          admin_status="$(curl -sS -o /dev/null -w '%{http_code}' https://courtwatch-app-api.ckrk9ggvrb.workers.dev/admin)"
          test "$admin_status" = 401
          app_status="$(curl -sS -o /dev/null -w '%{http_code}' https://courtwatch-app-api.ckrk9ggvrb.workers.dev/app)"
          case "$app_status" in 200|302|303|307|401|403) ;; *) exit 1;; esac
      - name: Verify isolated user analysis CRUD in remote D1
        run: |
          set -euo pipefail
          key="__courtwatch_ci__:${GITHUB_RUN_ID}"
          sql="DELETE FROM user_match_analyses WHERE user_id='user-courtwatch-ci' AND match_key='$key';
          INSERT INTO user_match_analyses(user_id,match_key,analysis,updated_at) VALUES('user-courtwatch-ci','$key','created',datetime('now'));
          UPDATE user_match_analyses SET analysis='updated',updated_at=datetime('now') WHERE user_id='user-courtwatch-ci' AND match_key='$key';
          SELECT analysis AS crud_value FROM user_match_analyses WHERE user_id='user-courtwatch-ci' AND match_key='$key';
          DELETE FROM user_match_analyses WHERE user_id='user-courtwatch-ci' AND match_key='$key';
          SELECT COUNT(*) AS crud_remaining FROM user_match_analyses WHERE user_id='user-courtwatch-ci' AND match_key='$key';"
          output="$(npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "$sql" --json)"
          test "$(jq -r '[..|objects|select(has("crud_value"))|.crud_value][-1]' <<<"$output")" = updated
          test "$(jq -r '[..|objects|select(has("crud_remaining"))|.crud_remaining][-1]' <<<"$output")" = 0
