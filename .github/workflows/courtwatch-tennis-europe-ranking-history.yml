name: Court Watch Tennis Europe ranking history
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-tennis-europe-ranking-history
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      publications: ${{ steps.history.outputs.publications }}
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - name: Read Europe matches once
        run: npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "SELECT payload FROM app_matches WHERE lower(COALESCE(json_extract(payload,'$.circuit'),json_extract(payload,'$.sourceId'),json_extract(payload,'$.source'),json_extract(payload,'$.sourceName'),'')) LIKE '%tennis%europe%'" --json > te-ranking-matches.json
      - id: history
        name: Discover official historical publications
        run: |
          node scripts/discover-tennis-europe-ranking-history.mjs
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('tennis-europe-ranking-publications.json')).publications.filter(x=>x.rankingDate>='2025-12-01'&&x.rankingDate<=new Date().toISOString().slice(0,10));fs.appendFileSync(process.env.GITHUB_OUTPUT,'publications='+JSON.stringify(p)+'\n');console.log(JSON.stringify({selected:p.length,from:p[0]?.rankingDate,to:p.at(-1)?.rankingDate}))"
      - uses: actions/upload-artifact@v4
        with:
          name: tennis-europe-ranking-history-input
          path: |
            cloudflare/app-api/te-ranking-matches.json
            cloudflare/app-api/tennis-europe-ranking-publications.json
          retention-days: 2
  backfill:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        publication: ${{ fromJSON(needs.discover.outputs.publications) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      TE_TARGET_ONLY: '1'
      TE_PUBLICATION_ID: ${{ matrix.publication.publicationId }}
      TE_RANKING_WEEK: ${{ matrix.publication.week }}
      TE_RANKING_DATE: ${{ matrix.publication.rankingDate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: tennis-europe-ranking-history-input
          path: cloudflare/app-api
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - name: Acquire only rankings needed by Court Watch history
        run: node scripts/sync-tennis-europe-rankings.mjs
      - name: Import differential historical slice
        run: |
          node scripts/guard-d1-import.mjs seed-tennis-europe-rankings/rankings-*.sql
          for sql_file in seed-tennis-europe-rankings/rankings-*.sql; do
            npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"
          done
  verify:
    needs: backfill
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - name: Verify historical coverage and immutable snapshots
        run: |
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "SELECT COUNT(DISTINCT publication_id) AS publications, MIN(ranking_date) AS first_date, MAX(ranking_date) AS last_date, COUNT(*) AS rankings FROM tennis_europe_ranking_history; SELECT COUNT(*) AS snapshots FROM tennis_europe_match_ranking_snapshots" --json > history-verification.json
          node -e "const fs=require('fs'),x=JSON.parse(fs.readFileSync('history-verification.json')),b=x?.[0]?.results?x:(x?.result||[]),a=b[0]?.results?.[0]||{},s=Number(b[1]?.results?.[0]?.snapshots||0);console.log(JSON.stringify({history:a,snapshots:s}));if(Number(a.publications)<2||Number(a.rankings)<1||s<1)process.exit(1)"
