name: Court Watch manual Aug 5 corrections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['manual-aug5-trigger.json','manual-aug5-corrections.mjs','.github/workflows/courtwatch-manual-aug5-corrections.yml']
permissions: {contents: write}
concurrency: {group: court-watch-manual-aug5-corrections,cancel-in-progress: true}
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply corrections
        run: |
          set +e
          : > manual-aug5-corrections.log
          timeout 60 node manual-aug5-corrections.mjs >> manual-aug5-corrections.log 2>&1; CORR=$?
          timeout 30 node courtwatch-audit.mjs >> manual-aug5-corrections.log 2>&1; AUDIT=$?
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data.json','utf8'));fs.writeFileSync('manual-aug5-corrections-heartbeat.json',JSON.stringify({at:new Date().toISOString(),corrections:process.argv[1],audit:process.argv[2],manualAug5Corrections:d.manualAug5Corrections||null,matches:(d.matches||[]).length},null,2)+'\n')" "$CORR" "$AUDIT"
          exit 0
      - name: Publish corrections
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json courtwatch-data-audit.json manual-aug5-corrections.json manual-aug5-corrections-heartbeat.json manual-aug5-corrections.log
          git commit -m 'Apply manual August 5 agenda corrections' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
