name: Court Watch v3 FITP player card diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/diagnose-fitp-player-card.mjs'
      - 'courtwatch-v3-fitp-player-card-diagnostic-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-player-card-diagnostic.yml'
permissions: {contents: write}
concurrency:
  group: court-watch-v3-fitp-player-card-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run FITP player card diagnostic
        run: |
          set +e
          tmpLog="courtwatch-v3-fitp-player-card-diagnostic-run.tmp.log"
          : > "$tmpLog"
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          echo "sourceSha=${GITHUB_SHA}" >> "$tmpLog"
          echo "runId=${GITHUB_RUN_ID}" >> "$tmpLog"
          node src/v3/diagnose-fitp-player-card.mjs >> "$tmpLog" 2>&1
          code=$?
          echo "diagnosticExit=$code" >> "$tmpLog"
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$tmpLog"
          cat "$tmpLog"
          cp "$tmpLog" courtwatch-v3-fitp-player-card-diagnostic-run.log
          exit "$code"
      - name: Commit FITP player card diagnostic output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          if [ ! -s courtwatch-v3-fitp-player-card-diagnostic-run.log ]; then
            echo "No diagnostic log produced; skipping commit."
            exit 0
          fi
          git add dist/v3/fitp_player_card_diagnostic.json courtwatch-v3-fitp-player-card-diagnostic-run.log .github/workflows/courtwatch-v3-fitp-player-card-diagnostic.yml src/v3/diagnose-fitp-player-card.mjs
          git commit -m "Run Court Watch v3 FITP player card diagnostic" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
