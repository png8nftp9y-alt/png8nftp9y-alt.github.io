name: Court Watch Tennis Europe ranking history audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-tennis-europe-ranking-history-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read official ranking history selector
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const BASE='https://te.tournamentsoftware.com';
          const cookies=new Map();
          const collect=response=>{for(const value of response.headers.getSetCookie?.()||[response.headers.get('set-cookie')||''])for(const part of String(value).split(/,(?=\s*[^;,]+=)/)){const pair=part.split(';')[0].trim(),i=pair.indexOf('=');if(i>0)cookies.set(pair.slice(0,i),pair.slice(i+1))}};
          const cookieHeader=()=>[...cookies].map(([k,v])=>k+'='+v).join('; ');
          const request=async(url,init={})=>{let current=url,method=init.method||'GET',body=init.body||undefined;for(let hop=0;hop<6;hop++){const response=await fetch(current,{...init,method,body,redirect:'manual',headers:{'user-agent':'Mozilla/5.0 CourtWatch ranking history audit','accept':'text/html,application/xhtml+xml','accept-language':'en-GB,en;q=0.9',...(body?{'content-type':'application/x-www-form-urlencoded; charset=UTF-8'}:{}),cookie:cookieHeader()}});collect(response);const text=await response.text(),location=response.headers.get('location')||'';if(response.status>=300&&response.status<400&&location){current=new URL(location,current).href;method='GET';body=undefined;continue}return{response,text}}throw Error('redirect loop')};
          let {response,text}=await request(BASE+'/tournaments');
          if(/CookiePurposes|cookiewall/i.test(text)||/cookiewall/i.test(response.url)){const body=new URLSearchParams({ReturnUrl:'/ranking/ranking.aspx?rid=79',SettingsOpen:'false'});body.append('CookiePurposes','1');await request(BASE+'/cookiewall/Save',{method:'POST',body:body.toString()});}
          ({response,text}=await request(BASE+'/ranking/ranking.aspx?rid=79'));
          console.log(JSON.stringify({status:response.status,url:response.url,bytes:text.length,cookieWall:/CookiePurposes|cookiewall/i.test(text)}));
          const clean=value=>String(value).replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
          const options=[];
          for(const match of text.matchAll(/<option\b([^>]*)>([\s\S]*?)<\/option>/gi)){const attrs=match[1],label=clean(match[2]);if(label)options.push({attrs,label})}
          console.log(JSON.stringify({options},null,2));
          const selected=text.indexOf('value="53550"');
          console.log('SELECT_CONTEXT',selected>=0?text.slice(Math.max(0,selected-1800),selected+900):'value not found');
          console.log('AUDIT_COMPLETE');
          NODE
