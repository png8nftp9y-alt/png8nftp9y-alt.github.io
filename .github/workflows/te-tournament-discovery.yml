name: Discover Tennis Europe tournament list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [te-tournament-discovery.mjs, .github/workflows/te-tournament-discovery.yml]
permissions: {contents: write}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node te-tournament-discovery.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add te-tournament-discovery.json
          if ! git diff --cached --quiet; then git commit -m 'Capture Tennis Europe tournament list routes'; git pull --rebase origin main; git push; fi
