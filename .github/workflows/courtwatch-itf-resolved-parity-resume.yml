name: Court Watch ITF 863 D1 parity resume
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore already verified R2 selection from original run
        uses: actions/download-artifact@v4
        with:
          name: itf-resolved-863-r2-d1-parity
          run-id: 37696656152
          github-token: ${{ github.token }}
          path: /tmp/itf-original-audit
      - name: Apply exactly two user-confirmed D1 exclusions
        run: node src/v3/resume-itf-resolved-parity.mjs /tmp/itf-original-audit
      - name: Locate existing D1 (GET only)
        working-directory: cloudflare/app-api
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database?name=courtwatch-app&per_page=100`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const body=await response.json();if(!response.ok||body.success!==true)throw new Error('Cannot locate existing D1');
          const db=(body.result||[]).find(d=>d.name==='courtwatch-app');if(!db)throw new Error('Existing D1 not found');
          await fs.writeFile('wrangler.generated.jsonc',JSON.stringify({d1_databases:[{binding:'DB',database_id:db.uuid||db.id}]}));
          JS
      - name: Verify exact content of 4892 source documents in D1
        run: node src/v3/verify-itf-draw-documents-d1.mjs
      - name: Certify parity with two explicit user exclusions
        run: node src/v3/prepare-itf-resolved-parity.mjs finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-resolved-863-d1-parity-resumed
          path: dist/v3/audits/itf-*.json
          retention-days: 30
