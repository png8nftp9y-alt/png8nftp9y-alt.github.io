name: Court Watch v3 guarded isolated merge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/merge-isolated-engines.mjs'
      - 'courtwatch-v3-merge-isolated-trigger.json'
      - '.github/workflows/courtwatch-v3-merge-isolated.yml'
permissions: {contents: write}
concurrency:
  group: court-watch-v3-guarded-isolated-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build guarded calendar from isolated engine outputs
        env:
          STABLE_FITP_REF: 55ff89a05c6bdff332045935be79cf49c40c9cbc
          TENNIS_EUROPE_REF: 70ef3384f9159172265817b4e51dbc962c8b88e2
          ITF_REF: 55ff89a05c6bdff332045935be79cf49c40c9cbc
        run: |
          set -euo pipefail
          : > courtwatch-v3-merge-isolated-run.log
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-merge-isolated-run.log
          echo "sourceSha=${GITHUB_SHA}" >> courtwatch-v3-merge-isolated-run.log
          echo "runId=${GITHUB_RUN_ID}" >> courtwatch-v3-merge-isolated-run.log
          node src/v3/merge-isolated-engines.mjs >> courtwatch-v3-merge-isolated-run.log 2>&1
          echo "mergeExit=0" >> courtwatch-v3-merge-isolated-run.log
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> courtwatch-v3-merge-isolated-run.log
          cat courtwatch-v3-merge-isolated-run.log
      - name: Commit guarded merged calendar
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_entries.json dist/v3/source_fitp_tournaments.json dist/v3/source_tennis_europe_entries.json dist/v3/source_tennis_europe_tournaments.json dist/v3/source_itf_entries.json dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/entries_fitp.json dist/v3/entries_tennis_europe.json dist/v3/entries_itf.json dist/v3/agenda.json dist/v3/matches.json dist/v3/results.json dist/v3/opponents.json dist/v3/sync_status.json dist/v3/diagnostics.json dist/v3/entries_log.json courtwatch-v3-merge-isolated-run.log src/v3/merge-isolated-engines.mjs .github/workflows/courtwatch-v3-merge-isolated.yml
          git commit -m "Publish guarded Court Watch v3 isolated calendar merge" || echo "No changes"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
