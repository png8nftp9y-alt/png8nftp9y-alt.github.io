name: Court Watch ITF Pescara alternate verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/lib/opponent-itf-document-history.mjs'
      - 'cloudflare/app-api/test/opponent-itf-document-history.test.mjs'
      - 'tools/verify-itf-pescara.mjs'
      - 'tools/lib/itf-pescara-verification.mjs'
      - 'tools/tests/itf-pescara-verification.test.mjs'
      - '.github/workflows/courtwatch-itf-page-audit.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-itf-pages-readonly-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test targeted evidence verification
        run: node --test cloudflare/app-api/test/opponent-itf-document-history.test.mjs tools/tests/itf-pescara-verification.test.mjs cloudflare/app-api/test/itf-pescara-certification.test.mjs
      - run: npm install
      - run: python -m pip install --disable-pip-version-check --quiet awscli
      - name: Verify Pescara index, three Worker profiles and browser rendering
        timeout-minutes: 4
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: node tools/verify-itf-pescara.mjs
      - name: Publish scoped result
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='artifacts/itf-pescara-verification.json';
          if(!fs.existsSync(file))process.exit(0);
          const r=JSON.parse(fs.readFileSync(file,'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Pescara verification: **${r.status}**\n\nScope: three native IDs at ${r.scope}. Profile replay date: ${r.profileAsOf||'unavailable'}. This is not a global audit.\n\n${r.players.map(p=>`${p.name}: source=${p.sourceExpectation.state}, index=${p.storedStatus}, Worker=${p.workerMatches}, browser=${p.browser?.contains}`).join('\n\n')}\n\nD1 queries: ${r.metrics.queries}; rows read: ${r.metrics.rowsRead}; rows written: ${r.metrics.rowsWritten}.\n`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-pescara-three-player-verification
          path: artifacts/itf-pescara-verification.json
          if-no-files-found: error
          retention-days: 14
