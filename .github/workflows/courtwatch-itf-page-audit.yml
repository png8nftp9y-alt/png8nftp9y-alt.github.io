name: Court Watch ITF acquired presence and pages audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/audit-itf-pages.mjs'
      - 'tools/lib/itf-page-audit.mjs'
      - 'tools/tests/itf-page-audit.test.mjs'
      - '.github/workflows/courtwatch-itf-page-audit.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-itf-pages-readonly-audit
  cancel-in-progress: false
  queue: single
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate missing presence and incomplete evidence detection
        run: node --test tools/tests/itf-page-audit.test.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install --disable-pip-version-check --quiet awscli
      - name: Audit acquired ITF presence against real D1 snapshots and browser without writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: node tools/audit-itf-pages.mjs
      - name: Publish audit verdict in run summary
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p='artifacts/itf-page-audit.json';
          if(!fs.existsSync(p))process.exit(0);
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`ITF page audit: **${r.status}**\n\nPlayers: ${r.players.length}; opponent profiles: ${r.opponents.length}; alternates: ${r.alternates.length}; differences: ${r.issues.length}; unverifiable cases: ${r.unverifiable.length}.\n\nD1 rows read: ${r.metrics.rowsRead}; rows written: ${r.metrics.rowsWritten}.\n\nSee artifact for names, competitions and source gaps. This is not a claim of complete ITF acquisition.\n`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-acquired-presence-pages-audit
          path: artifacts/itf-page-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Require an unambiguous matching verdict
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/itf-page-audit.json','utf8'));
          if(r.status!=='checked_scope_matches')process.exit(1);
          JS
