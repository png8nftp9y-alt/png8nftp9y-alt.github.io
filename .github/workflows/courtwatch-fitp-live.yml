name: Court Watch FITP live data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fitp-order-of-play.mjs','today-agenda.mjs','fitp-brallo-trigger.json','fitp-brallo-agenda.mjs','puc-entries-fast.mjs','puc-results.mjs','puc-opponent-meta.mjs','player-memberships.mjs','courtwatch-finalize.mjs','courtwatch-audit.mjs','players.json','former-players.json','.github/workflows/courtwatch-fitp-live.yml']
  schedule:
    - cron: '*/5 * * * *'
permissions: {contents: write}
concurrency: {group: court-watch-fitp-live,cancel-in-progress: true}
jobs:
  fitp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Sync FITP, Brallo agenda, clubs, memberships
        run: |
          set +e
          : > fitp-live.log
          timeout 300 node run-with-former.mjs puc-entries-fast.mjs >> fitp-live.log 2>&1; FITP=$?
          timeout 120 node fitp-brallo-agenda.mjs >> fitp-live.log 2>&1; BRALLO=$?
          timeout 120 node fitp-order-of-play.mjs >> fitp-live.log 2>&1; OOP=$?
          timeout 240 node run-with-former.mjs puc-results.mjs >> fitp-live.log 2>&1; RESULTS=$?
          timeout 180 node run-with-former.mjs puc-opponent-meta.mjs >> fitp-live.log 2>&1; CLUBS=$?
          timeout 180 node player-memberships.mjs >> fitp-live.log 2>&1; MEMBERS=$?
          timeout 90 node run-with-former.mjs courtwatch-finalize.mjs >> fitp-live.log 2>&1; FINALIZE=$?
          timeout 30 node today-agenda.mjs >> fitp-live.log 2>&1; TODAY=$?
          timeout 30 node courtwatch-audit.mjs >> fitp-live.log 2>&1; AUDIT=$?
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data.json','utf8'));fs.writeFileSync('fitp-live-heartbeat.json',JSON.stringify({at:new Date().toISOString(),fitp:process.argv[1],brallo:process.argv[2],orderOfPlay:process.argv[3],results:process.argv[4],clubs:process.argv[5],memberships:process.argv[6],finalize:process.argv[7],today:process.argv[8],audit:process.argv[9],matches:(d.matches||[]).length,orderOfPlaySync:d.fitpOrderOfPlaySync||null,todayAgenda:d.todayAgendaSync||null,bralloAgenda:d.bralloAgendaSync||null,fitpTournaments:(d.tournaments||[]).filter(t=>t.sourceId==='fitp-puc').length},null,2)+'\n')" "$FITP" "$BRALLO" "$OOP" "$RESULTS" "$CLUBS" "$MEMBERS" "$FINALIZE" "$TODAY" "$AUDIT"
          exit 0
      - name: Publish FITP live data
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json players.json former-players.json alerts.json puc-entries.json puc-results.json puc-opponent-clubs.json player-memberships.json brallo-agenda.json today-agenda.json fitp-order-of-play.json courtwatch-data-audit.json fitp-live-heartbeat.json fitp-live.log
          git commit -m 'Update Court Watch FITP live data' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
