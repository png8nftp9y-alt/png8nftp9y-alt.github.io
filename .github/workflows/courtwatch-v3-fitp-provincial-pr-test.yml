name: Court Watch v3 FITP provincial engine PR test

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp-tournaments-shard.mjs'
      - '.github/workflows/courtwatch-v3-fitp-provincial-pr-test.yml'

permissions:
  contents: read

jobs:
  province-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        province: ['1', '15', '27', '58', '72']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node --check src/v3/discover-fitp-tournaments-shard.mjs
      - name: Run metropolitan province fallback
        env:
          FITP_PROVINCE_ID: ${{ matrix.province }}
        run: node src/v3/discover-fitp-tournaments-shard.mjs
      - name: Verify metropolitan province recovery
        run: |
          case '${{ matrix.province }}' in
            1) code='TO'; expected='' ;;
            15) code='MI'; expected='B9516A9A-7BD3-4933-9CEB-AB1D77ACA93A' ;;
            27) code='VE'; expected='00753945-8679-4066-ACFF-2EE5F354BCB8' ;;
            58) code='RM'; expected='' ;;
            72) code='BA'; expected='9D1CD2AD-432C-47AF-B098-11550E6DAA96' ;;
          esac
          file="dist/v3/shards/source_fitp_tournaments_province_${{ matrix.province }}.json"
          jq -e --arg code "$code" '.tournamentsFound > 0 and ([.tournaments[].location | endswith(" " + $code)] | all)' "$file"
          if [ -n "$expected" ]; then
            jq -e --arg id "$expected" '.tournaments | map(.competitionId) | index($id) != null' "$file"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitp-provincial-pr-test-${{ matrix.province }}
          path: |
            dist/v3/shards/source_fitp_tournaments_province_${{ matrix.province }}.json
            dist/v3/shards/source_fitp_tournaments_province_${{ matrix.province }}_audit.json
