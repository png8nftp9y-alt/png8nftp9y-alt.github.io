name: Court Watch v3 FITP provincial engine PR test

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp-tournaments-shard.mjs'
      - '.github/workflows/courtwatch-v3-fitp-provincial-pr-test.yml'

permissions:
  contents: read

jobs:
  province-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        province: ['1', '15', '27', '58', '72']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node --check src/v3/discover-fitp-tournaments-shard.mjs
      - name: Run metropolitan province fallback
        env:
          FITP_PROVINCE_ID: ${{ matrix.province }}
        run: node src/v3/discover-fitp-tournaments-shard.mjs
      - name: Verify known player tournament recovery
        run: |
          case '${{ matrix.province }}' in
            1) expected='1AD13BB1-D101-4D19-8A97-19BA3168CFCC' ;;
            15) expected='B3110C9E-C6E4-4DE6-A9A3-BAB9B1341D47' ;;
            27) expected='00753945-8679-4066-ACFF-2EE5F354BCB8' ;;
            58) expected='C1CE4A62-CF62-41F9-8BCD-CA3F23055235' ;;
            72) expected='7C9CA85A-81FC-4E05-9C63-FD3A46A635BB' ;;
          esac
          jq -e --arg id "$expected" '.tournaments | map(.competitionId) | index($id) != null' "dist/v3/shards/source_fitp_tournaments_province_${{ matrix.province }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitp-provincial-pr-test-${{ matrix.province }}
          path: |
            dist/v3/shards/source_fitp_tournaments_province_${{ matrix.province }}.json
            dist/v3/shards/source_fitp_tournaments_province_${{ matrix.province }}_audit.json
