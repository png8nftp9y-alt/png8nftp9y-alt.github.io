name: Court Watch Worker deploy only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-worker-deploy-only.yml'
      - 'cloudflare/app-api/src/index.js'

permissions:
  contents: read

concurrency:
  group: courtwatch-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Check source
        run: npm run check
      - name: Reuse Court Watch D1 binding
        run: npm run configure
      - name: Validate Worker API
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc
      - name: Deploy Worker API without rebuilding D1
        run: npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc
