name: Court Watch Tennis Europe OOP and results live
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - 'history/tennis_europe_tournament_catalog.json'
      - 'src/v3/run-tennis-europe-oop-live.mjs'
      - '.github/workflows/courtwatch-tennis-europe-oop-live.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-tennis-europe-oop-live
  cancel-in-progress: true
jobs:
  acquire-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire OOP and results from T-minus-one
        run: node src/v3/run-tennis-europe-oop-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-europe-oop-live
          path: dist/v3/tennis_europe_oop_live.json
          if-no-files-found: error
          retention-days: 7
