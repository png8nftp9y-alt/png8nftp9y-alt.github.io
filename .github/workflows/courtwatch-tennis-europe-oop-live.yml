name: Court Watch Tennis Europe OOP and results live
on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'
  push:
    branches: [main]
    paths:
      - 'history/tennis_europe_tournament_catalog.json'
      - 'src/v3/run-tennis-europe-oop-live.mjs'
      - 'src/v3/compare-tennis-europe-oop-live.mjs'
      - 'src/v3/project-tennis-europe-courtwatch-matches.mjs'
      - 'src/v3/tennis-europe-oop-r2.sh'
      - '.github/workflows/courtwatch-tennis-europe-oop-live.yml'
permissions:
  actions: read
  contents: read
concurrency:
  group: courtwatch-tennis-europe-oop-live
  cancel-in-progress: true
jobs:
  acquire-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure private R2 snapshot storage
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "R2_BUCKET=$R2_BUCKET" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --quiet awscli
      - name: Restore previous snapshot from R2
        run: bash src/v3/tennis-europe-oop-r2.sh restore
      - name: Restore previous successful live snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/v3/previous-tennis-europe-oop/tennis_europe_oop_live.json && exit 0
          previous=$(gh run list --repo "${{ github.repository }}" --workflow courtwatch-tennis-europe-oop-live.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous" ]; then
            mkdir -p dist/v3/previous-tennis-europe-oop
            gh run download "$previous" --repo "${{ github.repository }}" --name tennis-europe-oop-live --dir dist/v3/previous-tennis-europe-oop
          fi
      - name: Acquire OOP and results from T-minus-one
        run: node src/v3/run-tennis-europe-oop-live.mjs
      - name: Build auditable Court Watch player projection
        run: node src/v3/project-tennis-europe-courtwatch-matches.mjs
      - name: Audit changes from previous green snapshot
        run: node src/v3/compare-tennis-europe-oop-live.mjs
      - name: Publish verified generational snapshot to R2
        run: bash src/v3/tennis-europe-oop-r2.sh publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-europe-oop-live
          path: |
            dist/v3/tennis_europe_oop_live.json
            dist/v3/tennis_europe_oop_live_transitions.json
            dist/v3/tennis_europe_courtwatch_matches.json
          if-no-files-found: error
          retention-days: 7
