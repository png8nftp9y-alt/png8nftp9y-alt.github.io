name: Court Watch v3 FITP entries exposure audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/audit-fitp-entries-exposure.mjs'
      - 'courtwatch-v3-fitp-entries-exposure-audit-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-entries-exposure-audit.yml'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-entries-exposure-audit,cancel-in-progress: true}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Audit FITP public entry list exposure
        run: |
          node src/v3/audit-fitp-entries-exposure.mjs > courtwatch-v3-fitp-entries-exposure-audit-run.log 2>&1
          cat courtwatch-v3-fitp-entries-exposure-audit-run.log
      - name: Commit exposure audit output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_entries_exposure_audit.json courtwatch-v3-fitp-entries-exposure-audit-run.log
          git commit -m "Build Court Watch v3 FITP entries exposure audit" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
