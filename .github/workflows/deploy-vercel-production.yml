name: Deploy Court Watch to Vercel production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, app.js, styles.css, data.json, players.json, vercel.json, deploy-version.json, .github/workflows/deploy-vercel-production.yml]
permissions: {contents: write}
concurrency: {group: vercel-production,cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Deploy production
        run: |
          set +e
          : > vercel-deploy.log
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'missing VERCEL_TOKEN' >> vercel-deploy.log
            EXIT=2
          else
            npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" >> vercel-deploy.log 2>&1
            PULL=$?
            if [ $PULL -eq 0 ]; then npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" >> vercel-deploy.log 2>&1; EXIT=$?; else EXIT=$PULL; fi
          fi
          echo "exit=$EXIT" >> vercel-deploy.log
          exit 0
      - name: Save deployment report
        if: always()
        run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add vercel-deploy.log
          if ! git diff --cached --quiet; then git commit -m 'Record Vercel production deployment'; git pull --rebase origin main; git push; fi
