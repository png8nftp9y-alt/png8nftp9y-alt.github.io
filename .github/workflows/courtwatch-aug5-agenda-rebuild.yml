name: Court Watch rebuild Aug 5 agenda
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['aug5-agenda-trigger.json','rebuild-aug5-agenda.mjs','.github/workflows/courtwatch-aug5-agenda-rebuild.yml']
permissions: {contents: write}
concurrency: {group: court-watch-aug5-agenda-rebuild,cancel-in-progress: true}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild Aug 5 agenda
        run: |
          set +e
          : > aug5-agenda-rebuild.log
          timeout 90 node rebuild-aug5-agenda.mjs >> aug5-agenda-rebuild.log 2>&1; REBUILD=$?
          timeout 30 node courtwatch-audit.mjs >> aug5-agenda-rebuild.log 2>&1; AUDIT=$?
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data.json','utf8'));fs.writeFileSync('aug5-agenda-rebuild-heartbeat.json',JSON.stringify({at:new Date().toISOString(),rebuild:process.argv[1],audit:process.argv[2],rebuildInfo:d.aug5AgendaRebuild||null,matches:(d.matches||[]).length},null,2)+'\n')" "$REBUILD" "$AUDIT"
          exit 0
      - name: Publish Aug 5 agenda
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json courtwatch-data-audit.json aug5-agenda-rebuild.json aug5-agenda-rebuild-heartbeat.json aug5-agenda-rebuild.log
          git commit -m 'Rebuild August 5 Brallo agenda' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
