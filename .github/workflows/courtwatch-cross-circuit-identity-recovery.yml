name: Court Watch cross circuit identity review and federation recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-cross-circuit-identity-recovery.yml', 'cloudflare/app-api/scripts/repair-federation-identity-links.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate actual evidence, incremental writes and homonym guards
        run: node --test test/repair-federation-identity-links.test.mjs test/player-identity-mapping.test.mjs test/paginated-player-search.test.mjs test/player-circuit-profiles.test.mjs test/archived-profile-evidence.test.mjs test/audit-split-player-identities.test.mjs
      - run: node scripts/configure-d1.mjs
      - name: Review all 158 audited groups and reconcile only compatible federation aliases
        run: node scripts/repair-federation-identity-links.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-circuit-identity-evidence
          path: cloudflare/app-api/tmp/federation-identity-review.json
          retention-days: 30
