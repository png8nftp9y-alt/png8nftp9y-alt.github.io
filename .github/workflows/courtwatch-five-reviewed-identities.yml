name: Court Watch five reviewed identity decisions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-five-reviewed-identities.yml'
      - 'cloudflare/app-api/scripts/apply-five-reviewed-identities.mjs'
      - 'cloudflare/app-api/data/user-approved-five-reviews-20261028.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact merges, exclusions, AUS, closure and zero-write replay
        run: node --test test/five-reviewed-identities.test.mjs test/player-identity-mapping.test.mjs test/identity-review-queue.test.mjs
      - run: node scripts/configure-d1.mjs
      - name: Apply the five explicit user decisions and verify D1
        run: node scripts/apply-five-reviewed-identities.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-reviewed-identities-readback
          path: cloudflare/app-api/tmp/five-reviewed-identities.json
          retention-days: 30
