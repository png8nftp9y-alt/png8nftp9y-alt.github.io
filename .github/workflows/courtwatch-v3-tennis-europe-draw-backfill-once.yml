name: Court Watch v3 Tennis Europe draw backfill once
# Refresh phase diagnostics after explicit main-draw/round-robin classification.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/courtwatch-v3-tennis-europe-draw-backfill-once.yml'
permissions:
  contents: write
concurrency:
  group: courtwatch-v3-tennis-europe-draw-backfill-once
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Apply verified historical T-1 decisions and rebuild calendar
        env:
          TE_DRAW_BACKFILL: '1'
          TE_DRAW_AUDIT_PATH: 'dist/v3/source_tennis_europe_draw_backfill_audit.json'
        run: |
          set -euo pipefail
          cp dist/v3/source_tennis_europe_entries_sharded.json dist/v3/source_tennis_europe_entries.json
          node src/v3/verify-tennis-europe-draws.mjs
          node src/v3/validate-tennis-europe-live.mjs
          node src/v3/maintain-tennis-europe-database.mjs
          node src/v3/entries-engine.mjs
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('dist/v3/source_tennis_europe_entries.json'));
          const audit = JSON.parse(fs.readFileSync('dist/v3/source_tennis_europe_draw_backfill_audit.json'));
          const te = (source.entries || []).filter(e => e.circuit === 'tennis-europe');
          const removed = (audit.audit || []).filter(e => String(e.decision || '').startsWith('removed_'));
          const inconclusive = (audit.audit || []).filter(e => String(e.decision || '').includes('inconclusive'));
          if (te.length !== 40 || removed.length !== 7 || inconclusive.length !== 0) {
            throw new Error(`Refusing publish: entries=${te.length}, removed=${removed.length}, inconclusive=${inconclusive.length}`);
          }
          NODE
      - name: Publish atomically, preserving last known good
        run: |
          set -euo pipefail
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          mkdir -p /tmp/te-t1/dist/v3 /tmp/te-t1/history
          for f in source_tennis_europe_entries.json source_tennis_europe_draw_backfill_audit.json source_tennis_europe_history_entries.json tournament_entries.json tournaments.json entries_tennis_europe.json sync_status.json diagnostics.json entries_log.json; do
            test -f dist/v3/$f && cp dist/v3/$f /tmp/te-t1/dist/v3/$f
          done
          for f in tennis_europe_tournament_catalog.json tennis_europe_player_tournament_db.json tennis_europe_database_audit.json; do
            test -f history/$f && cp history/$f /tmp/te-t1/history/$f
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/te-t1/dist/v3/* dist/v3/
            cp /tmp/te-t1/history/* history/
            git add dist/v3 history/tennis_europe_tournament_catalog.json history/tennis_europe_player_tournament_db.json history/tennis_europe_database_audit.json
            git commit -m 'Apply validated Tennis Europe T-1 decisions' || exit 0
            git push origin HEAD:main && exit 0
          done
          exit 1
