name: Court Watch v3 Tennis Europe draw backfill once
# Read-only branch audit using current verifier; never publishes to main.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/courtwatch-v3-tennis-europe-draw-backfill-once.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-v3-tennis-europe-draw-backfill-once-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Audit all concluded tracked Tennis Europe entries
        env:
          TE_DRAW_BACKFILL: '1'
          TE_DRAW_AUDIT_ONLY: '1'
        run: |
          cp dist/v3/source_tennis_europe_entries_sharded.json dist/v3/source_tennis_europe_entries.json
          node src/v3/verify-tennis-europe-draws.mjs
      - name: Print audit summary and cases
        run: |
          node -e "const a=require('./dist/v3/source_tennis_europe_draw_backfill_audit.json'); console.log(JSON.stringify(a,null,2))"
