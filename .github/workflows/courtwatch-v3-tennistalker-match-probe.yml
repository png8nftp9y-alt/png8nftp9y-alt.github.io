name: Court Watch v3 TennisTalker Anna match probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/probe-tennistalker-anna-matches.mjs'
      - 'courtwatch-v3-tennistalker-match-trigger.json'
      - '.github/workflows/courtwatch-v3-tennistalker-match-probe.yml'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-tennistalker-match-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe TennisTalker Anna match details
        run: |
          set +e
          : > courtwatch-v3-tennistalker-match-run.log
          node src/v3/probe-tennistalker-anna-matches.mjs >> courtwatch-v3-tennistalker-match-run.log 2>&1
          code=$?
          echo "tennistalkerMatchExit=$code" >> courtwatch-v3-tennistalker-match-run.log
          cat courtwatch-v3-tennistalker-match-run.log
          exit $code
      - name: Commit TennisTalker match probe
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/tennistalker_anna_match_probe.json courtwatch-v3-tennistalker-match-run.log src/v3/probe-tennistalker-anna-matches.mjs .github/workflows/courtwatch-v3-tennistalker-match-probe.yml
          git commit -m "Build TennisTalker Anna match probe" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
