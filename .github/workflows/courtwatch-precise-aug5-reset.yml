name: Court Watch precise Aug 5 reset
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['precise-aug5-trigger.json','precise-aug5-reset.mjs','.github/workflows/courtwatch-precise-aug5-reset.yml']
permissions: {contents: write}
concurrency: {group: court-watch-precise-aug5-reset,cancel-in-progress: true}
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reset precise Aug 5
        run: |
          set +e
          : > precise-aug5-reset.log
          timeout 90 node precise-aug5-reset.mjs >> precise-aug5-reset.log 2>&1; RESET=$?
          timeout 30 node courtwatch-audit.mjs >> precise-aug5-reset.log 2>&1; AUDIT=$?
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data.json','utf8'));fs.writeFileSync('precise-aug5-reset-heartbeat.json',JSON.stringify({at:new Date().toISOString(),reset:process.argv[1],audit:process.argv[2],preciseAug5Reset:d.preciseAug5Reset||null,matches:(d.matches||[]).length},null,2)+'\n')" "$RESET" "$AUDIT"
          exit 0
      - name: Publish precise Aug 5
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json courtwatch-data-audit.json precise-aug5-reset.json precise-aug5-reset-heartbeat.json precise-aug5-reset.log
          git commit -m 'Reset and apply precise August 5 Brallo corrections' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
