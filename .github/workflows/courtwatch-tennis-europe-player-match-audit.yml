name: Court Watch Tennis Europe complete player-match audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'players.json'
      - 'src/v3/audit-tennis-europe-courtwatch-history.mjs'
      - 'cloudflare/app-api/scripts/restore-tennis-europe-oop.sh'
      - '.github/workflows/courtwatch-tennis-europe-player-match-audit.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-tennis-europe-player-match-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Configure private R2 reads
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY" && test -n "$R2_BUCKET"
          echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "R2_BUCKET=$R2_BUCKET" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --quiet awscli
      - name: Restore verified historical and live archives
        working-directory: cloudflare/app-api
        run: bash scripts/restore-tennis-europe-oop.sh
      - name: Audit every Court Watch Europe player match
        run: node src/v3/audit-tennis-europe-courtwatch-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-europe-courtwatch-complete-audit
          path: dist/v3/tennis_europe_courtwatch_complete_audit.json
          if-no-files-found: error
          retention-days: 14
