name: Court Watch runtime documents D1 import and verification
# D1_WRITE_POLICY: incremental
on:
  workflow_run:
    workflows:
      - Court Watch v3 FITP provincial primary
      - Court Watch v3 FITP player entries
      - Court Watch v3 Tennis Europe tournament map
      - Court Watch v3 Tennis Europe live entries
      - Court Watch Tennis Europe agenda D1
      - Court Watch v3 ITF global tournament map
      - Court Watch v3 ITF acceptance discovery 42d
      - Court Watch v3 ITF known labels fast
      - Court Watch v3 ITF acceptance safety 120d
      - Court Watch v3 ITF complete backfill
      - Court Watch ITF Meta engine
      - Court Watch future ITF tournament metadata acquisition
      - Court Watch v3 ITF T-1 complete draws
      - Court Watch ITF T-1 extraordinary concluded recovery
      - Court Watch ITF T-1 artifact persistence recovery
      - Court Watch v3 results engine
      - Court Watch v3 order of play engine
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-runtime-documents-d1.yml'
      - 'cloudflare/app-api/lib/runtime-document-plan.mjs'
      - 'cloudflare/app-api/scripts/sync-runtime-documents-d1.mjs'
      - 'dist/v3/players.json'
      - 'dist/v3/tournaments.json'
      - 'dist/v3/matches.json'
      - 'dist/v3/agenda.json'
      - 'dist/v3/results.json'
      - 'dist/v3/opponents.json'
      - 'dist/v3/tournament_entries.json'
      - 'dist/v3/sync_status.json'
      - 'dist/v3/diagnostics.json'
      - 'dist/v3/manual_matches.json'
      - 'dist/v3/source_itf_history_tournaments.json'
      - 'dist/v3/source_itf_tournaments.json'
      - 'dist/v3/source_fitp_tournaments.json'
      - 'dist/v3/source_tennis_europe_tournaments_sharded.json'
      - 'dist/v3/itf_system_diagnostics.json'
      - 'dist/v3/source_itf_entries.json'
      - 'dist/v3/tennis_europe_system_diagnostics.json'
      - 'dist/v3/source_fitp_entries.json'
      - 'dist/v3/itf_t1_queue_status.json'
      - 'dist/v3/itf_metadata_queue_status.json'
      - 'dist/v3/itf_tournament_metadata_diagnostics.json'
      - 'dist/v3/operational_status.json'
      - 'history/itf_official_metadata.json'
permissions:
  contents: read
concurrency:
  group: courtwatch-runtime-release-${{ github.event.workflow_run.conclusion || 'success' }}
  cancel-in-progress: false
  queue: single
jobs:
  check-source:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check source outside the D1 writer queue
        run: node --test cloudflare/app-api/test/runtime-document-plan.test.mjs cloudflare/app-api/test/runtime-document-reader.test.mjs cloudflare/app-api/test/d1-single-source.test.mjs cloudflare/app-api/test/runtime-source-order.test.mjs tools/tests/d1-workflow-queues.test.mjs
  verify-storage:
    needs: check-source
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recheck source only when code advanced during the wait
        env:
          CHECKED_SHA: ${{ needs.check-source.outputs.source_sha }}
        run: |
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CHECKED_SHA"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$CHECKED_SHA" HEAD -- cloudflare/app-api src/v3 tools/tests v3.js v3.html v3.css .github/workflows; then
            node --test cloudflare/app-api/test/runtime-document-plan.test.mjs cloudflare/app-api/test/runtime-document-reader.test.mjs cloudflare/app-api/test/d1-single-source.test.mjs cloudflare/app-api/test/runtime-source-order.test.mjs tools/tests/d1-workflow-queues.test.mjs
          fi
      - name: Persist complete runtime documents and verify full content in D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/app-api/scripts/sync-runtime-documents-d1.mjs
      - name: Verify authenticated D1-only readers with external requests blocked
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/app-api/scripts/verify-runtime-d1-read-path.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-documents-d1-verification
          path: |
            dist/v3/audits/runtime-documents-d1.json
            dist/v3/audits/runtime-d1-read-path.json
          if-no-files-found: error
          retention-days: 30
