name: Discover Tennis Europe and ITF routes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [international-route-discovery.mjs, .github/workflows/international-route-discovery.yml]
permissions: {contents: write}
concurrency: {group: court-watch-international-routes,cancel-in-progress: true}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node international-route-discovery.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add international-route-discovery.json
          if ! git diff --cached --quiet; then git commit -m 'Capture international official data routes'; git pull --rebase origin main; git push; fi
