name: Court Watch v3 entries engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/entries-engine.mjs'
      - 'courtwatch-v3-entries-trigger.json'
      - '.github/workflows/courtwatch-v3-entries.yml'
      - 'data.json'
      - 'players.json'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-entries
  cancel-in-progress: true
jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run independent v3 entries engine
        run: |
          set +e
          node src/v3/entries-engine.mjs > courtwatch-v3-entries-run.log 2>&1
          code=$?
          echo "exitCode=$code" >> courtwatch-v3-entries-run.log
          cat courtwatch-v3-entries-run.log
          exit $code
      - name: Commit v3 entries output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/sync_status.json dist/v3/entries_log.json courtwatch-v3-entries-run.log .github/workflows/courtwatch-v3-entries.yml
          git commit -m "Build Court Watch v3 entries data" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
