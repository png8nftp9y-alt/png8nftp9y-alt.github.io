name: Verify complete Tennis Europe synchronization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/verify-te-sync.yml]
permissions: {contents: write}
concurrency: {group: verify-te-sync,cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22,cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Execute and capture
        run: |
          set +e
          node --check te-entries.mjs > te-verification.log 2>&1
          CHECK=$?
          if [ $CHECK -eq 0 ]; then node te-entries.mjs >> te-verification.log 2>&1; RUN=$?; else RUN=$CHECK; fi
          echo "exit=$RUN" >> te-verification.log
          node courtwatch-finalize.mjs >> te-verification.log 2>&1 || true
      - name: Save verification
        if: always()
        run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add te-verification.log
          [ -f te-entries.json ] && git add te-entries.json data.json
          if ! git diff --cached --quiet; then git commit -m 'Verify complete Tennis Europe synchronization'; git pull --rebase origin main; git push; fi
