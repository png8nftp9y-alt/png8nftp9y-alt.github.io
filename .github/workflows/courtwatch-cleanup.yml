name: Validate Court Watch data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [courtwatch-cleanup.mjs, build-surname-aliases.mjs, .github/workflows/courtwatch-cleanup.yml]
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node build-surname-aliases.mjs
      - run: node courtwatch-cleanup.mjs
      - run: |
          git config user.name 'courtwatch-bot'
          git config user.email 'courtwatch-bot@users.noreply.github.com'
          git add data.json players.json cleanup-report.json
          if ! git diff --cached --quiet; then git commit -m 'Remove duplicate and unsupported schedule data'; git pull --rebase origin main; git push; fi
