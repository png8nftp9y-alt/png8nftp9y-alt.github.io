name: Sync player database
on:
  issues:
    types: [opened, edited, reopened, closed, deleted]
permissions:
  contents: write
  issues: read
jobs:
  sync:
    if: startsWith(github.event.issue.title, '[Giocatore]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build players.json from open player records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --limit 500 --json number,title,body,url > /tmp/player-issues.json
          node <<'NODE'
          const fs=require('fs');
          const issues=JSON.parse(fs.readFileSync('/tmp/player-issues.json','utf8')).filter(i=>i.title.startsWith('[Giocatore]'));
          function field(body,label){const marker=`### ${label}\n\n`;const at=body.indexOf(marker);if(at<0)return'';const rest=body.slice(at+marker.length);const end=rest.search(/\n\n### /);const value=(end<0?rest:rest.slice(0,end)).trim();return value==='_No response_'?'':value}
          function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
          const players=issues.map(i=>{const name=field(i.body,'Nome e cognome');const parts=name.trim().split(/\s+/);const circuits=field(i.body,'Circuiti').split(/\n|,/).map(x=>x.replace(/^[-*]\s*/, '').trim()).filter(Boolean);return{id:slug(name),name,aliases:[name.toUpperCase(),[...parts].reverse().join(' ').toUpperCase()],birthYear:field(i.body,'Anno di nascita'),club:field(i.body,'Circolo'),circuits,fitpId:field(i.body,'ID FITP'),tennisEuropeId:field(i.body,'ID Tennis Europe'),worldTennisId:field(i.body,'World Tennis ID'),tennisTalkerUrl:field(i.body,'Profilo TennisTalker'),recordUrl:i.url}}).filter(p=>p.name).sort((a,b)=>a.name.localeCompare(b.name,'it'));
          fs.writeFileSync('players.json',JSON.stringify({players},null,2)+'\n');
          NODE
      - name: Save database
        run: |
          if git diff --quiet -- players.json; then exit 0; fi
          git config user.name "courtwatch-bot"
          git config user.email "courtwatch-bot@users.noreply.github.com"
          git add players.json
          git commit -m "Sync monitored players database"
          git push
