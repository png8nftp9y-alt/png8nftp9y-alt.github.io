name: Court Watch ITF T-1 eight-tournament batch proof
on:
  push:
    branches: ['test/itf-t1-batch-15m']
    paths:
      - 'src/v3/build-itf-t1-tournament-matrix.mjs'
      - 'src/v3/build-itf-t1-draw-batch.mjs'
      - 'src/v3/merge-itf-t1-history-method.mjs'
      - 'src/v3/acquire-itf-history-draw-task.mjs'
      - '.github/workflows/courtwatch-itf-t1-batch-proof.yml'
permissions: {contents: read}
concurrency: {group: courtwatch-itf-t1-batch-proof,cancel-in-progress: false}
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          ITF_T1_TOURNAMENT_BATCH: 8
          ITF_T1_COMPETITION_IDS: J-J30-MDV-2026-004,J-J30-MEX-2026-011,J-J60-TTO-2026-002,J-J60-TUN-2026-005,J-J30-ARG-2026-003,J-J30-USA-2026-006,J-J60-BUL-2026-002,J-J30-AUS-2026-004
        run: node src/v3/build-itf-t1-tournament-matrix.mjs
      - uses: actions/upload-artifact@v4
        with: {name: itf-t1-batch-proof-selection, path: dist/v3/itf_t1_tournament_batch.json, retention-days: 14}
  inventory:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Inventory one tournament exactly as history
        continue-on-error: true
        env:
          ITF_COMPETITION_ID: ${{ matrix.competitionId }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 1800
        run: node src/v3/inventory-itf-history-tournament.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'itf-t1-batch-proof-inventory-${{ matrix.index }}', path: 'dist/v3/shards/itf/inventory/*.json', if-no-files-found: error, retention-days: 14}
  queue:
    needs: [select, inventory]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      tasks: ${{ steps.queue.outputs.tasks }}
      tournaments: ${{ steps.queue.outputs.tournaments }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'itf-t1-batch-proof-inventory-*', path: dist/v3/shards/itf/inventory, merge-multiple: true}
      - id: queue
        run: node src/v3/build-itf-t1-draw-batch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t1-batch-proof-queue
          path: |
            dist/v3/itf_t1_draw_batch.json
            dist/v3/shards/itf/t1-inventory/*.json
          retention-days: 14
  acquire:
    needs: queue
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.queue.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Acquire one unresolved draw
        if: matrix.skip != true
        continue-on-error: true
        env:
          ITF_DRAW_TASK_B64: ${{ matrix.task }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUIRE_POPULATED_DRAW: 1
        run: |
          export ITF_DRAW_TASK_JSON="$(printf '%s' "$ITF_DRAW_TASK_B64" | base64 --decode)"
          node src/v3/acquire-itf-history-draw-task.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true
        with: {name: 'itf-t1-batch-proof-draw-${{ matrix.index }}', path: 'dist/v3/shards/itf/draw-tasks/*.json.gz', if-no-files-found: error, retention-days: 14}
  review:
    needs: [queue, acquire]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: itf-t1-batch-proof-queue, path: dist/v3}
      - uses: actions/download-artifact@v4
        if: needs.queue.outputs.tasks != '0'
        with: {pattern: 'itf-t1-batch-proof-draw-*', path: draw-tasks, merge-multiple: true}
      - name: Merge read-only and certify the whole batch
        run: |
          set -euo pipefail
          mkdir -p dist/v3/audits/itf-t1-batch
          for inventory in dist/v3/shards/itf/t1-inventory/*.json; do
            cp "$inventory" dist/v3/itf_t1_section_inventory.json
            node src/v3/merge-itf-t1-history-method.mjs
            id="$(jq -r .competitionId "$inventory")"
            cp dist/v3/source_itf_draw_audit.json "dist/v3/audits/itf-t1-batch/$id.json"
          done
          jq -s '{version:1,tournaments:length,complete:([.[].summary.completeTournaments]|add),pending:([.[].summary.pendingTournaments]|add),technicalErrors:([.[].summary.technicalErrorSections]|add),notPublishedOrIncomplete:([.[].summary.notPublishedOrIncompleteSections]|add),audits:map(.audit[0])}' dist/v3/audits/itf-t1-batch/*.json > dist/v3/audits/itf-t1-batch-proof.json
          test "$(jq -r .tournaments dist/v3/audits/itf-t1-batch-proof.json)" -eq 8
          test "$(jq -r .technicalErrors dist/v3/audits/itf-t1-batch-proof.json)" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-t1-eight-tournament-batch-proof
          path: |
            dist/v3/audits/itf-t1-batch-proof.json
            dist/v3/audits/itf-t1-batch/*.json
            history/itf_draw_target_db.json
          if-no-files-found: error
          retention-days: 14
