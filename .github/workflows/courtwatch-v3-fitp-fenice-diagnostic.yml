name: Court Watch v3 FITP Fenice Anna diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/diagnose-fitp-fenice-anna.mjs'
      - 'courtwatch-v3-fitp-fenice-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-fenice-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          set +e
          : > courtwatch-v3-fitp-fenice-run.log
          node src/v3/diagnose-fitp-fenice-anna.mjs >> courtwatch-v3-fitp-fenice-run.log 2>&1
          code=$?
          echo "feniceExit=$code" >> courtwatch-v3-fitp-fenice-run.log
          cat courtwatch-v3-fitp-fenice-run.log
          exit $code
      - if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/fitp_fenice_anna_diagnostic.json courtwatch-v3-fitp-fenice-run.log src/v3/diagnose-fitp-fenice-anna.mjs .github/workflows/courtwatch-v3-fitp-fenice-diagnostic.yml
          git commit -m "Build FITP Fenice Anna diagnostic" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
