name: Court Watch ITF resolved 863 R2 D1 parity
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze resolved coverage (863 tournaments)
        run: |
          set -euo pipefail
          python -m pip install --quiet awscli
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" /tmp/itf-parity-coverage.json --only-show-errors
          node src/v3/prepare-itf-resolved-parity.mjs scope /tmp/itf-parity-coverage.json 863
      - name: Download and checksum-verify the current archive
        run: |
          set -euo pipefail
          python -m pip install --quiet awscli
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="itf/history-draws"
          mkdir -p /tmp/itf-draw-archive /tmp/itf-live-draws /tmp/itf-blocks
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/pointers/current.json" /tmp/itf-pointer.json --only-show-errors
          generation="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/itf-pointer.json')).generation")"
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/generations/$generation/manifest.json" /tmp/itf-manifest.json --only-show-errors
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/generations/$generation/blocks/" /tmp/itf-blocks --recursive --exclude "*" --include "*.tar.gz" --only-show-errors
          python src/v3/extract-itf-draw-archive.py

      - name: Fetch one complete live version per required draw
        run: python3 src/v3/download-itf-resolved-live.py
      - name: Select full documents without changing source content
        run: node src/v3/prepare-itf-resolved-parity.mjs select /tmp/itf-draw-archive /tmp/itf-parity-live
      - name: Locate existing D1 (GET only)
        working-directory: cloudflare/app-api
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database?name=courtwatch-app&per_page=100`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const body=await response.json();if(!response.ok||body.success!==true)throw new Error('Cannot locate existing D1');
          const db=(body.result||[]).find(d=>d.name==='courtwatch-app');if(!db)throw new Error('Existing D1 not found');
          await fs.writeFile('wrangler.generated.jsonc',JSON.stringify({d1_databases:[{binding:'DB',database_id:db.uuid||db.id}]}));
          JS
      - name: Verify acquired document content in D1 (not aggregate row counts)
        run: node src/v3/verify-itf-draw-documents-d1.mjs
      - name: Certify parity for the frozen resolved scope
        run: node src/v3/prepare-itf-resolved-parity.mjs finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-resolved-863-r2-d1-parity
          path: |
            dist/v3/audits/itf-draw-d1-sync.json
            dist/v3/audits/itf-draw-d1-content-verification.json
            dist/v3/audits/itf-resolved-parity*.json
            /tmp/itf-manifest.json
          retention-days: 30

