name: Court Watch GitHub D1 historical data reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-github-d1-completeness.yml'
      - 'cloudflare/app-api/scripts/audit-github-d1-completeness.mjs'
      - 'cloudflare/app-api/scripts/github-d1-reconciliation.mjs'
      - 'tools/tests/github-d1-reconciliation.test.mjs'
      - 'cloudflare/app-api/lib/read-only-d1-client.mjs'
      - 'cloudflare/app-api/test/read-only-d1-client.test.mjs'
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-readonly-reconciliation
  cancel-in-progress: false
  queue: single
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify missing-data detection and enforced read-only adapter
        run: node --test tools/tests/github-d1-reconciliation.test.mjs cloudflare/app-api/test/read-only-d1-client.test.mjs
      - name: Compare GitHub historical records with stored D1 data without writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/app-api/scripts/audit-github-d1-completeness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-d1-historical-reconciliation
          path: dist/v3/audits/github-d1-completeness.json
          if-no-files-found: error
          retention-days: 30
