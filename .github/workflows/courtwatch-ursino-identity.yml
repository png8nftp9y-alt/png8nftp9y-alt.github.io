name: Court Watch approved Ursino FITP Europe link
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-ursino-identity.yml', 'cloudflare/app-api/scripts/approve-ursino-identity.mjs', 'cloudflare/app-api/test/approve-ursino-identity.test.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test test/approve-ursino-identity.test.mjs test/player-identity-mapping.test.mjs test/identity-review-queue.test.mjs
      - run: node scripts/configure-d1.mjs
      - run: node scripts/approve-ursino-identity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ursino-identity-readback
          path: cloudflare/app-api/tmp/ursino-identity.json
          retention-days: 30
