name: Court Watch fix Ghislotti double
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fix-ghislotti-double-trigger.json','fix-ghislotti-double.mjs','.github/workflows/courtwatch-fix-ghislotti-double.yml']
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set +e
          node fix-ghislotti-double.mjs
          node courtwatch-audit.mjs
          exit 0
      - run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add data.json courtwatch-data-audit.json fix-ghislotti-double.json
          git commit -m 'Remove duplicate Ghislotti August 5 double' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
