name: Court Watch search identity split diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-search-identity-split.yml', 'cloudflare/app-api/scripts/inspect-search-identity-split.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-search-identity-split-readonly
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare/app-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify read-only evidence and homonym separation
        run: node --test test/search-identity-split.test.mjs
      - name: Read David Dumitru source records and compare current mapping without writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
        run: node scripts/inspect-search-identity-split.mjs 'David Dumitru'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: david-dumitru-identity-evidence
          path: cloudflare/app-api/tmp/search-identity-split.json
          retention-days: 14
