          total_versions = total_bytes = 0
          candidate_digest = hashlib.sha256()
          for path, (expected_count, expected_digest, old, encoded) in baseline.items():
              prefixes = {encoded[i:i+12] for i in range(0, len(encoded), 12)}
              if len(prefixes) != expected_count:
                  raise SystemExit('Invalid baseline prefix count')
              cursor, matched = '', []
              while True:
                  page = select(
                      'SELECT content_hash AS hash, COUNT(*) AS chunks, '
                      'SUM(LENGTH(CAST(data AS BLOB))) AS bytes FROM runtime_document_chunks '
                      'WHERE path=? AND content_hash>? GROUP BY content_hash '
                      'ORDER BY content_hash LIMIT 100', path, cursor)
                  matched.extend(row for row in page if row['hash'][:12] in prefixes)
                  if len(page) < 100:
                      break
                  cursor = page[-1]['hash']
              actual_digest = hashlib.sha256(''.join(row['hash'] for row in matched).encode()).hexdigest()
              if len(matched) != expected_count or actual_digest != expected_digest:
                  raise SystemExit(f'Live baseline differs from inventory: {path}, matched {len(matched)} of {expected_count}')
              protected = {active[path]['hash'], old, last_observed[path], *backup[path]}
              for digest in sorted(protected):
                  expected = active[path]['chunks'] if digest == active[path]['hash'] else 2
                  rows = select('SELECT seq,data FROM runtime_document_chunks WHERE path=? AND content_hash=? ORDER BY seq', path, digest)
                  if [row['seq'] for row in rows] != list(range(expected)):
                      raise SystemExit(f'Missing protected chunks: {path}')
                  raw = gzip.decompress(base64.b64decode(''.join(row['data'] for row in rows), validate=True))
                  if hashlib.sha256(raw).hexdigest() != digest:
                      raise SystemExit(f'Protected content hash mismatch: {path}')
              candidates = [row for row in matched if row['hash'] not in protected]
              size = sum(row['bytes'] for row in candidates)
              for row in candidates:
                  candidate_digest.update(f"{path}\t{row['hash']}\t{row['chunks']}\t{row['bytes']}\n".encode())
              total_versions += len(candidates)
              total_bytes += size
              print(f'{path}: {len(candidates)} candidates, {size} bytes', flush=True)
          if manifest() != before:
              raise SystemExit('Release changed during audit')
          print('CANDIDATES_VERIFIED ' + json.dumps({
              'release': release['fingerprint'], 'versions': total_versions,
              'bytes': total_bytes, 'sha256': candidate_digest.hexdigest(),
          }), flush=True)
