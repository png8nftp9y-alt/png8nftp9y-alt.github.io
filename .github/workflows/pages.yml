name: Deploy CourtWatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Load CourtWatch site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CourtWatch release guard
        run: node tools/courtwatch-release-guard.mjs
      - name: Save guard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courtwatch-release-guard
          path: artifacts/courtwatch-release-guard.json
          if-no-files-found: error
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published app and access gate
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          APP_URL: https://courtwatch-app-api.ckrk9ggvrb.workers.dev/app
        run: node tools/courtwatch-post-deploy-smoke.mjs
