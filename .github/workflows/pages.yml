name: Deploy CourtWatch
on:
  # GitHub Pages already publishes main automatically. Keep this guarded
  # deployment manual to avoid a second concurrent CDN purge on every bot commit.
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  release-safety:
    uses: ./.github/workflows/courtwatch-release-safety.yml
    with:
      source_sha: ${{ github.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  deploy:
    needs: release-safety
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Load CourtWatch site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require exact approved code before Pages upload
        run: node tools/release-code-fingerprint.mjs --expect "${{ needs.release-safety.outputs.code_fingerprint }}"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published app and access gate
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          APP_URL: https://courtwatch-app-api.ckrk9ggvrb.workers.dev/app
        run: node tools/courtwatch-post-deploy-smoke.mjs
