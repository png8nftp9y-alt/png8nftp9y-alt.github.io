name: Court Watch ITF complete draw archive D1 backfill
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Court Watch v3 archive 4291 ITF historical draws to R2]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/courtwatch-itf-draw-d1-backfill.yml'
      - 'src/v3/itf-draw-document-d1.mjs'
      - 'src/v3/build-itf-draw-d1-seed.mjs'
      - 'src/v3/verify-itf-draw-documents-d1.mjs'
      - 'src/v3/extract-itf-draw-archive.py'
      - 'cloudflare/app-api/migrations/0025_itf_draw_documents.sql'

permissions:
  contents: read

concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download and checksum-verify the current archive and live draws
        run: |
          set -euo pipefail
          python -m pip install --quiet awscli
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="itf/history-draws"
          mkdir -p /tmp/itf-draw-archive /tmp/itf-live-draws /tmp/itf-blocks
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/pointers/current.json" /tmp/itf-pointer.json --only-show-errors
          generation="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/itf-pointer.json')).generation")"
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/generations/$generation/manifest.json" /tmp/itf-manifest.json --only-show-errors
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$prefix/generations/$generation/blocks/" /tmp/itf-blocks --recursive --exclude "*" --include "*.tar.gz" --only-show-errors
          python src/v3/extract-itf-draw-archive.py
          aws --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/itf/live-draws/" /tmp/itf-live-draws --recursive --only-show-errors
      - name: Build idempotent ITF-only D1 seed
        env:
          ITF_D1_REQUIRED_ARCHIVE_ROOT: /tmp/itf-draw-archive
        run: node src/v3/build-itf-draw-d1-seed.mjs /tmp/itf-draw-archive /tmp/itf-live-draws
      - name: Configure D1
        working-directory: cloudflare/app-api
        run: |
          npm install
          node scripts/configure-d1.mjs
          npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Import every acquired ITF match without rewriting identical rows
        working-directory: cloudflare/app-api
        run: |
          set -euo pipefail
          shopt -s nullglob
          sql_files=(../../seed-itf-draws/*.sql)
          for sql_file in "${sql_files[@]}"; do
            echo "Importing $sql_file"
            imported=0
            for attempt in 1 2 3 4; do
              if npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"; then imported=1; break; fi
              sleep $((attempt * 5))
            done
            test "$imported" -eq 1
          done
      - name: Verify acquired document content in D1 (not aggregate row counts)
        run: node src/v3/verify-itf-draw-documents-d1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-complete-draw-d1-backfill-audit
          path: |
            dist/v3/audits/itf-draw-d1-sync.json
            dist/v3/audits/itf-draw-d1-content-verification.json
            /tmp/itf-manifest.json
          retention-days: 30
