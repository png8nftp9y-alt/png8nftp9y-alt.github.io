name: Court Watch ITF T-1 extraordinary concluded recovery
run-name: ITF extraordinary lane ${{ inputs.lane }}
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Extraordinary lane a or b
        required: false
        type: string
        default: a
      remaining:
        description: Maximum remaining automatic batches
        required: false
        type: number
        default: 200
      previous_ids:
        description: Previous batch IDs used by the progress guard
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: courtwatch-itf-t1-extraordinary-dispatch-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ vars.ITF_T1_COVERAGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Restore coverage official draw audit
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m pip install --quiet awscli
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp "s3://$R2_BUCKET/itf/audits/official-draw-parity/coverage-v3-current.json" /tmp/itf-audit-state.json --only-show-errors
          echo "ITF_AUDIT_STATE_FILE=/tmp/itf-audit-state.json" >> "$GITHUB_ENV"
      - id: select
        name: Select two concluded pending tournaments
        env:
          ITF_EXCLUDE_IDS: ${{ inputs.previous_ids }}
          ITF_EXTRAORDINARY_LANE: ${{ inputs.lane }}
        run: node src/v3/build-itf-t1-extraordinary-batch.mjs
      - name: Publish live T-1 queue counters
        run: |
          set -euo pipefail
          node src/v3/build-itf-t1-admin-status.mjs
          snapshot=/tmp/itf-t1-live-status
          rm -rf "$snapshot"; mkdir -p "$snapshot/dist/v3"
          cp dist/v3/itf_t1_extraordinary_batch.json "$snapshot/dist/v3/"
          cp dist/v3/itf_t1_queue_status.json "$snapshot/dist/v3/"
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot/dist/v3/"*.json dist/v3/
            git add dist/v3/itf_t1_extraordinary_batch.json dist/v3/itf_t1_queue_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish live ITF T-1 queue counters"
            git push origin HEAD:main && exit 0
          done
          exit 1
      - name: Dispatch isolated T-1 recovery
        if: steps.select.outputs.selected != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.select.outputs.competition_ids }}
          REMAINING: ${{ inputs.remaining }}
          NEXT_PREVIOUS_IDS: ${{ steps.select.outputs.next_previous_ids }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [ "${REMAINING:-0}" -le 0 ]; then echo "Extraordinary chain safety limit reached"; exit 0; fi
          NEXT_REMAINING=$((REMAINING - 1))
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/courtwatch-v3-itf-t-minus-one.yml/dispatches" \
            -d "$(jq -n --arg ref main --arg ids "$IDS" --arg lane "$LANE" --arg remaining "$NEXT_REMAINING" --arg previous "$NEXT_PREVIOUS_IDS" '{ref:$ref,inputs:{competition_id:$ids,chain_lane:("extraordinary-"+$lane),extraordinary_chain:true,extraordinary_remaining:$remaining,extraordinary_previous_ids:$previous}}')"
          echo "Dispatched extraordinary ITF T-1 recovery for $IDS; remaining guard $NEXT_REMAINING"
      - uses: actions/upload-artifact@v4
        with:
          name: itf-t1-extraordinary-selection
          path: dist/v3/itf_t1_extraordinary_batch.json
          retention-days: 14
