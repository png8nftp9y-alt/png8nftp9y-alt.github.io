name: Court Watch ITF tournament session proof
on:
  push:
    branches: ['test/itf-session-per-tournament']
    paths: ['.github/workflows/courtwatch-itf-tournament-session-proof.yml']
permissions: {contents: read}
jobs:
  inventory:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {index: 0, competitionId: J-J30-DEN-2026-004}
          - {index: 1, competitionId: J-J30-SVK-2026-004}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - env:
          ITF_COMPETITION_ID: ${{ matrix.competitionId }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 2500
        run: node src/v3/inventory-itf-history-tournament.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: session-inventory-${{ matrix.index }}
          path: dist/v3/shards/itf/inventory/*.json
  queue:
    needs: inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.focus.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'session-inventory-*', path: dist/v3/shards/itf/inventory, merge-multiple: true}
      - id: build
        run: node src/v3/build-itf-t1-draw-batch.mjs
      - id: focus
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const wanted=new Set(['G-D-M-KO','G-S-M-KO','G-S-Q-KO']),groups=new Map();
          const docs=fs.readdirSync('dist/v3/shards/itf/t1-inventory').map(f=>JSON.parse(fs.readFileSync('dist/v3/shards/itf/t1-inventory/'+f)));
          for(const doc of docs)for(const section of doc.sections||[])if(wanted.has(section.event)&&!section.resolved){
            const task={...section.combo,event:section.event,competitionId:doc.competitionId,sourceUrl:doc.tournament?.sourceUrl||section.combo?.sourceUrl||'',taskId:doc.competitionId+'__'+section.event};
            if(!groups.has(doc.competitionId))groups.set(doc.competitionId,[]);groups.get(doc.competitionId).push(task);
          }
          const rows=[...groups].map(([competitionId,tasks],index)=>({index,competitionId,event:tasks.map(x=>x.event).join(','),task:Buffer.from(JSON.stringify(tasks)).toString('base64')}));
          if(rows.length!==2||rows.reduce((n,x)=>n+JSON.parse(Buffer.from(x.task,'base64')).length,0)!==6)throw Error('expected two tournaments and six draws');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:rows})+'\n');
          NODE
  acquire:
    needs: queue
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.queue.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - continue-on-error: true
        env:
          ITF_DRAW_TASK_B64: ${{ matrix.task }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 2500
          ITF_REQUIRE_POPULATED_DRAW: 1
        run: |
          export ITF_TOURNAMENT_TASKS_JSON="$(printf '%s' "$ITF_DRAW_TASK_B64" | base64 --decode)"
          node src/v3/acquire-itf-history-tournament-tasks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-result-${{ matrix.index }}
          path: dist/v3/shards/itf/draw-tasks/*.json.gz
          if-no-files-found: error
  gate:
    needs: acquire
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'session-result-*', path: results, merge-multiple: true}
      - run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import zlib from 'node:zlib';
          const rows=fs.readdirSync('results').map(f=>JSON.parse(zlib.gunzipSync(fs.readFileSync('results/'+f))));
          const technical=rows.filter(x=>x.failureType==='technical_error'),incapsula=rows.filter(x=>/incapsula/i.test(String(x.error||'')));
          console.log(JSON.stringify(rows.map(x=>({competitionId:x.competitionId,event:x.event,status:x.status,failureType:x.failureType,error:x.error})),null,2));
          if(rows.length!==6||technical.length||incapsula.length)throw Error('session proof failed');
          NODE
