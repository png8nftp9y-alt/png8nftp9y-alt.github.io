name: Court Watch ITF acquisition v2 test
on:
  workflow_dispatch:
  push:
    branches:
      - test/itf-acquisition-v2
    paths:
      - .github/workflows/courtwatch-v3-itf-acquisition-v2-test.yml
permissions:
  contents: read
concurrency:
  group: courtwatch-itf-acquisition-v2-test
  cancel-in-progress: false
jobs:
  inspect-current-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/itf-acquisition-v2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify current T-1 implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "branch=$(git branch --show-current)"
          echo "commit=$(git rev-parse HEAD)"
          test -f .github/workflows/courtwatch-v3-itf-t-minus-one.yml
          echo '--- T-1 workflow references ---'
          grep -nE 'node |\.mjs|\.json|R2|draw|section|pending|technical' .github/workflows/courtwatch-v3-itf-t-minus-one.yml || true
      - name: Build isolated v2 inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/itf-v2/out
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          wf_path=Path('.github/workflows/courtwatch-v3-itf-t-minus-one.yml')
          wf=wf_path.read_text()
          # Only executable repository dependencies are required at checkout time.
          # JSON/state paths in the workflow include generated artifacts, snapshots and /tmp files.
          scripts=sorted(set(re.findall(r'\bnode\s+([A-Za-z0-9_./-]+\.(?:mjs|js))\b',wf)))
          existing=[x for x in scripts if Path(x).is_file()]
          missing=[x for x in scripts if not Path(x).is_file()]
          all_refs=sorted(set(re.findall(r'[A-Za-z0-9_./-]+\.(?:json|mjs|js)',wf)))
          runtime_refs=[x for x in all_refs if x.startswith('/tmp/') or x.startswith('snapshot/')]
          data_refs=[x for x in all_refs if x.endswith('.json') and x not in runtime_refs]
          out={
            'mode':'read_only_test',
            'workflow':str(wf_path),
            'executable_dependencies':scripts,
            'existing_executable_dependencies':existing,
            'missing_executable_dependencies':missing,
            'data_or_generated_references':data_refs,
            'runtime_references':runtime_refs
          }
          Path('ops/itf-v2/out/inventory.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if missing:
              raise SystemExit('Missing executable T-1 dependencies: '+', '.join(missing))
          PY
      - name: Upload v2 inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: itf-acquisition-v2-inventory
          path: ops/itf-v2/out/inventory.json
          if-no-files-found: error
