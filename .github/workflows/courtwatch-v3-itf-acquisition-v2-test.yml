name: Court Watch ITF acquisition v2 test
on:
  workflow_dispatch:
  push:
    branches:
      - test/itf-acquisition-v2
    paths:
      - .github/workflows/courtwatch-v3-itf-acquisition-v2-test.yml
permissions:
  contents: read
concurrency:
  group: courtwatch-itf-acquisition-v2-test
  cancel-in-progress: false
jobs:
  real-section-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/itf-acquisition-v2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run one real ITF tournament section probe
        env:
          ITF_REQUEST_DELAY_MS: 1800
          ITF_REQUEST_TIMEOUT_MS: 20000
          ITF_V2_COMPETITION_ID: J-J30-ITA-2026-002
          ITF_V2_TOURNAMENT_NAME: J30 Cuneo
          ITF_V2_SOURCE_URL: https://www.itftennis.com/en/tournament/j30-cuneo/ita/2026/j-j30-ita-2026-002/
          ITF_V2_SECTION_SLOT: 0
        run: node src/v3/itf-acquisition-v2-probe.mjs
      - name: Verify probe classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='ops/itf-v2/out/section-probe.json'
          data=json.load(open(p))
          allowed={'complete','not_published','blocked_incapsula','network_error','invalid_response'}
          assert data['mode']=='read_only_single_tournament_single_section'
          assert data['status'] in allowed
          print(json.dumps(data,indent=2))
          PY
      - name: Prove no repository publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "test/itf-acquisition-v2"
          git status --short
          test -f ops/itf-v2/out/section-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: itf-acquisition-v2-real-section-probe
          path: ops/itf-v2/out/section-probe.json
          if-no-files-found: error
          retention-days: 14
