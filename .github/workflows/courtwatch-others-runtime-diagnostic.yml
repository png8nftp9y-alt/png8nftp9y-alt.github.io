name: Court Watch Others runtime error diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-others-runtime-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: courtwatch-others-readonly-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - name: Observe runtime errors for 65 seconds without storing user requests
        run: node ../../tools/inspect-others-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: others-runtime-errors
          path: cloudflare/app-api/tmp/others-runtime.json
          retention-days: 3
