name: Court Watch Virginia FITP v4 discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/discover-virginia-fitp-v4.mjs','.github/workflows/courtwatch-virginia-fitp-v4.yml','courtwatch-virginia-fitp-v4-trigger.json']
permissions: {contents: write}
concurrency: {group: court-watch-virginia-fitp-v4,cancel-in-progress: true}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Discover Virginia FITP fast without expected count
        run: node src/discover-virginia-fitp-v4.mjs | tee virginia-fitp-v4.log
      - name: Publish v4 discovery
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add virginia-fitp-final.json virginia-fitp-candidates.json virginia-fitp-discovery-log.json virginia-fitp-v4.log || true
          git commit -m 'Run fast Virginia FITP discovery without expected count' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
