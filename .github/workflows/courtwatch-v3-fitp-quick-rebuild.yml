name: Court Watch v3 FITP quick rebuild
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp.mjs'
      - 'src/v3/entries-engine.mjs'
      - 'players.json'
      - '.github/workflows/courtwatch-v3-fitp-quick-rebuild.yml'
permissions:
  contents: write
concurrency:
  group: court-watch-v3-fitp-quick-rebuild
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild FITP and merge existing V3 sources
        run: |
          set +e
          : > /tmp/courtwatch-v3-fitp-quick-rebuild-run.log
          echo "startedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/courtwatch-v3-fitp-quick-rebuild-run.log
          echo "sourceSha=${GITHUB_SHA}" >> /tmp/courtwatch-v3-fitp-quick-rebuild-run.log
          node src/v3/discover-fitp.mjs >> /tmp/courtwatch-v3-fitp-quick-rebuild-run.log 2>&1
          fitp_code=$?
          echo "fitpExit=$fitp_code" >> /tmp/courtwatch-v3-fitp-quick-rebuild-run.log
          if [ "$fitp_code" -eq 0 ]; then
            node src/v3/entries-engine.mjs >> /tmp/courtwatch-v3-fitp-quick-rebuild-run.log 2>&1
            merge_code=$?
          else
            merge_code=$fitp_code
          fi
          echo "entriesMergeExit=$merge_code" >> /tmp/courtwatch-v3-fitp-quick-rebuild-run.log
          echo "finishedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/courtwatch-v3-fitp-quick-rebuild-run.log
          cat /tmp/courtwatch-v3-fitp-quick-rebuild-run.log
          exit $merge_code
      - name: Commit FITP quick rebuild output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_entries.json dist/v3/source_fitp_entries_audit.json dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/entries_fitp.json dist/v3/entries_tennis_europe.json dist/v3/entries_itf.json dist/v3/sync_status.json dist/v3/diagnostics.json dist/v3/entries_log.json .github/workflows/courtwatch-v3-fitp-quick-rebuild.yml
          git commit -m "Rebuild Court Watch v3 FITP entries quickly" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
