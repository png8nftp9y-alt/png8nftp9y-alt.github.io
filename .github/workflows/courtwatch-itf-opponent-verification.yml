name: Court Watch ITF opponent scope verification
on:
  workflow_dispatch:
    inputs:
      opponent_ids:
        description: 'Optional comma-separated native IDs: fresh targeted check, not a full-scope certificate'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'tools/verify-itf-opponent-scope.mjs'
      - 'tools/lib/audit-read-evidence.mjs'
      - 'tools/lib/audit-d1-batch.mjs'
      - 'tools/lib/audit-time-budget.mjs'
      - 'tools/lib/audit-opponent-checkpoints.mjs'
      - 'tools/lib/audit-pending-opponents.mjs'
      - 'tools/tests/audit-pending-opponents.test.mjs'
      - 'tools/tests/audit-opponent-checkpoints.test.mjs'
      - 'tools/lib/itf-page-audit.mjs'
      - 'tools/tests/audit-time-budget.test.mjs'
      - 'tools/tests/itf-page-audit.test.mjs'
      - 'tools/lib/audit-itf-entry-profiles.mjs'
      - 'tools/tests/audit-itf-entry-profiles.test.mjs'
      - 'tools/lib/audit-latest-itf-documents.mjs'
      - 'tools/lib/audit-opponent-failure.mjs'
      - 'tools/tests/audit-latest-itf-documents.test.mjs'
      - 'tools/tests/audit-opponent-failure.test.mjs'
      - 'tools/lib/audit-opponent-selection.mjs'
      - 'tools/tests/audit-opponent-selection.test.mjs'
      - 'tools/tests/audit-d1-batch.test.mjs'
      - 'tools/lib/itf-audit-read-session.mjs'
      - 'tools/tests/itf-audit-read-session.test.mjs'
      - 'tools/lib/opponent-native-history-check.mjs'
      - 'tools/tests/opponent-native-history-check.test.mjs'
      - 'tools/tests/audit-read-evidence.test.mjs'
      - '.github/workflows/courtwatch-itf-opponent-verification.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-itf-opponent-scope-readonly
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test targeted evidence verification
        run: node --test tools/tests/audit-pending-opponents.test.mjs tools/tests/audit-opponent-checkpoints.test.mjs tools/tests/audit-time-budget.test.mjs tools/tests/audit-itf-entry-profiles.test.mjs tools/tests/audit-latest-itf-documents.test.mjs tools/tests/audit-opponent-failure.test.mjs tools/tests/audit-opponent-selection.test.mjs tools/tests/audit-d1-batch.test.mjs tools/tests/opponent-native-history-check.test.mjs tools/tests/audit-read-evidence.test.mjs tools/tests/itf-page-audit.test.mjs tools/tests/itf-audit-read-session.test.mjs cloudflare/app-api/test/opponent-itf-document-history.test.mjs
      - run: npm install
      - run: python -m pip install --disable-pip-version-check --quiet awscli
      - name: Verify scoped opponents, source inputs and browser rendering
        timeout-minutes: 22
        env:
          ITF_AUDIT_OPPONENT_IDS: ${{ inputs.opponent_ids || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: cc3b23ac-7f90-4a4d-9ec3-44f0f22e6fda
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: node tools/verify-itf-opponent-scope.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-opponent-scope-verification
          path: artifacts/itf-opponent-verification.json
          if-no-files-found: error
          retention-days: 14
