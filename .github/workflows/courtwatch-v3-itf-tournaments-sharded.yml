name: Court Watch v3 ITF global tournament map
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions: {contents: write, actions: write}
concurrency: {group: courtwatch-v3-itf-map,cancel-in-progress: false}
jobs:
  engine-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  shard:
    needs: [engine-source]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: {region: [europe, americas, asia_pacific, africa_middle_east, other]}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ needs.engine-source.outputs.sha }}"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: ITF_REGION_SHARD=${{ matrix.region }} node src/v3/discover-itf-tournaments-shard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'itf-tournaments-${{ matrix.region }}', path: 'dist/v3/shards/itf/tournaments-${{ matrix.region }}.json'}
  publish:
    needs: [engine-source, shard]
    concurrency: {group: courtwatch-itf-meta-state, cancel-in-progress: false, queue: max}
    outputs:
      new_count: ${{ steps.publish.outputs.new_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ needs.engine-source.outputs.sha }}"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {path: dist/v3/shards/itf, merge-multiple: true}
      - run: node src/v3/merge-itf-tournament-shards.mjs
      - id: publish
        name: Publish atomically
        run: |
          set -euo pipefail
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          cp dist/v3/source_itf_tournaments.json /tmp/itf-map.json
          cp dist/v3/source_itf_tournaments_audit.json /tmp/itf-map-audit.json
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            cp dist/v3/source_itf_tournaments.json /tmp/itf-map-previous.json
            cp /tmp/itf-map.json dist/v3/source_itf_tournaments.json
            cp /tmp/itf-map-audit.json dist/v3/source_itf_tournaments_audit.json
            node src/v3/run-itf-metadata-engine.mjs --discovery
            git add dist/v3/source_itf_tournaments*.json history/itf_metadata_queue.json dist/v3/itf_metadata_queue_status.json docs/CourtWatch_v3_handoff_report.md
            git commit -m 'Publish validated ITF global tournament map' || exit 0
            git push origin HEAD:main && exit 0
          done
          exit 1

  metadata:
    needs: publish
    if: needs.publish.outputs.new_count != '0' && needs.publish.outputs.new_count != ''
    uses: ./.github/workflows/courtwatch-itf-meta-engine.yml
    with: {mode: ordinary}
    secrets: inherit
