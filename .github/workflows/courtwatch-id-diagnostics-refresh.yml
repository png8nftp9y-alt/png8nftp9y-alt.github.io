name: Court Watch ID diagnostics current lists
on:
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-id-diagnostics-refresh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify current own-circuit counts anonymously without writes
        run: node scripts/per-circuit-player-id-audit.mjs
  refresh:
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      # D1_WRITE_POLICY: incremental. Reuse guarded acceptance deltas; anonymous logs only.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test unsaved names, ID guard and admin diagnostics
        run: node --test test/acceptance-import-diagnostics.test.mjs test/sync-acceptance-player-profiles.test.mjs test/admin-player-id-diagnostics.test.mjs
      - name: Verify existing database and current circuit counts anonymously
        run: node scripts/per-circuit-player-id-audit.mjs
      - name: Configure existing D1 and R2
        run: |
          npm install
          node scripts/configure-d1.mjs
      - name: Refresh diagnostics from all three current lists incrementally
        run: |
          set -euo pipefail
          mkdir -p tmp/acceptance
          failed=0
          for circuit in fitp tennis-europe itf; do
            case "$circuit" in
              fitp) prefix=fitp/cache; file=fitp_participant_cache.json.gz ;;
              tennis-europe) prefix=tennis-europe/cache; file=tennis_europe_participant_cache.json.gz ;;
              itf) prefix=itf/database; file=itf_participant_cache.json.gz ;;
            esac
            npx wrangler r2 object get "$R2_BUCKET/$prefix/pointers/current.json" --remote --config wrangler.generated.jsonc --file tmp/acceptance/pointer.json
            generation=$(jq -er .generation tmp/acceptance/pointer.json)
            npx wrangler r2 object get "$R2_BUCKET/$prefix/generations/$generation/$file" --remote --config wrangler.generated.jsonc --file "tmp/acceptance/$file"
            gzip -t "tmp/acceptance/$file"
            ACCEPTANCE_CIRCUIT="$circuit" ACCEPTANCE_CACHE_FILE="tmp/acceptance/$file" node scripts/sync-acceptance-player-profiles.mjs || failed=1
          done
          node scripts/per-circuit-player-id-audit.mjs
          test "$failed" -eq 0
