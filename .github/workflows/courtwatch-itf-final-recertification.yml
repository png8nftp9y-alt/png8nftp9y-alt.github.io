name: Court Watch ITF final recertification
on:
  push:
    branches: ['audit/itf-final-recertification']
    paths: ['.github/workflows/courtwatch-itf-final-recertification.yml']
permissions: {contents: read}
concurrency: {group: courtwatch-itf-final-recertification,cancel-in-progress: true}
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: select
        env: {ITF_T1_TOURNAMENT_BATCH: 100}
        run: node src/v3/build-itf-t1-tournament-matrix.mjs
  inventory:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.skip != true
        continue-on-error: true
        env:
          ITF_COMPETITION_ID: ${{ matrix.competitionId }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 1800
        run: node src/v3/inventory-itf-history-tournament.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true
        with:
          name: recert-inventory-${{ matrix.index }}
          path: dist/v3/shards/itf/inventory/*.json
          if-no-files-found: error
  queue:
    needs: [select, inventory]
    if: always() && needs.select.outputs.selected != '0'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      tasks: ${{ steps.queue.outputs.tasks }}
      tournaments: ${{ steps.queue.outputs.tournaments }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {pattern: 'recert-inventory-*', path: dist/v3/shards/itf/inventory, merge-multiple: true}
      - id: queue
        run: node src/v3/build-itf-t1-draw-batch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: recert-queue
          path: |
            dist/v3/itf_t1_draw_batch.json
            dist/v3/shards/itf/t1-inventory/*.json
          if-no-files-found: error
  acquire:
    needs: queue
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.queue.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - if: matrix.skip != true
        continue-on-error: true
        env:
          ITF_DRAW_TASK_B64: ${{ matrix.task }}
          ITF_REQUEST_TIMEOUT_MS: 30000
          ITF_REQUEST_DELAY_MS: 1800
          ITF_REQUIRE_POPULATED_DRAW: 1
        run: |
          export ITF_TOURNAMENT_TASKS_JSON="$(printf '%s' "$ITF_DRAW_TASK_B64" | base64 --decode)"
          node src/v3/acquire-itf-history-tournament-tasks.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.skip != true
        with:
          name: recert-draw-${{ matrix.index }}
          path: dist/v3/shards/itf/draw-tasks/*.json.gz
          if-no-files-found: error
  certify:
    needs: [queue, acquire]
    if: always() && needs.queue.outputs.tournaments != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with: {name: recert-queue, path: dist/v3}
      - uses: actions/download-artifact@v4
        if: needs.queue.outputs.tasks != '0'
        with: {pattern: 'recert-draw-*', path: draw-tasks, merge-multiple: true}
      - name: Merge only inside disposable runner
        run: |
          set -euo pipefail
          mkdir -p dist/v3/audits/itf-final-recertification
          for inventory in dist/v3/shards/itf/t1-inventory/*.json; do
            cp "$inventory" dist/v3/itf_t1_section_inventory.json
            node src/v3/merge-itf-t1-history-method.mjs
            id="$(jq -r .competitionId "$inventory")"
            cp dist/v3/source_itf_draw_audit.json "dist/v3/audits/itf-final-recertification/$id.json"
          done
          node src/v3/maintain-itf-database.mjs
          node src/v3/validate-itf-system.mjs
      - name: Certify history gap and current residues
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('history/itf_draw_target_db.json','utf8'));
          const gapLabels=['J30 Male','J30 Nuevo Leon','J30 Skopje','J30 Panama','J30 Cluj Napoca','J30 Dushanbe','J300 College Park','J60 Sao Paulo','J60 Vina del Mar','J60 Shenzhen','J60 Hyderabad','J60 Macau','J60 Singapore','J60 Kreuzlingen','J100 Barcelona','J60 Megrine','J60 Tacarigua'];
          const norm=v=>String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
          const source=JSON.parse(fs.readFileSync('dist/v3/source_itf_tournaments.json','utf8')),sourceRows=[];
          (function walk(v){if(Array.isArray(v))return v.forEach(walk);if(!v||typeof v!=='object')return;if(v.competitionId)sourceRows.push(v);for(const x of Object.values(v))if(x&&typeof x==='object')walk(x)})(source);
          const known={'J30 MALE':'J-J30-MDV-2026-004','J30 PANAMA':'J-J30-PAN-2026-002','J30 DUSHANBE':'J-J30-TJK-2026-005','J60 TACARIGUA':'J-J60-TTO-2026-002'};
          const allRows=[...Object.values(state.tournaments||{}),...sourceRows],gapIds=[],unresolvedGapLabels=[];
          for(const label of gapLabels){const n=norm(label),tokens=n.split(' '),ids=new Set(allRows.filter(row=>tokens.every(token=>norm(JSON.stringify(row)).includes(token))).map(row=>String(row.competitionId||'')).filter(Boolean));if(known[n]){gapIds.push(known[n]);continue}if(ids.size===1)gapIds.push([...ids][0]);else unresolvedGapLabels.push({label,candidates:[...ids]})}
          const tournaments=Object.values(state.tournaments||{}),rows=[];
          for(const t of tournaments)if(t?.decision==='pending'){
            const events=(t.families||[]).flatMap(f=>(f.events||[]).map(e=>({...e,family:f.family})));
            for(const e of events)if(!e.resolved)rows.push({competitionId:t.competitionId,event:e.event||null,family:e.family,category:e.failureType==='technical_error'?'technical':'publication',reason:e.error||e.failureType||'pending'});
            if(!events.length)rows.push({competitionId:t.competitionId,event:null,family:null,category:t.eventFailure?'technical':'publication',reason:t.eventFailure||'pending_without_detail'});
          }
          const gap=gapIds.map(competitionId=>({competitionId,decision:state.tournaments?.[competitionId]?.decision||'missing',missingSections:state.tournaments?.[competitionId]?.missingSections??null}));
          const finland=state.tournaments?.['J-J30-FIN-2026-004'];
          const report={generatedAt:new Date().toISOString(),unresolvedGapLabels,history:{tournaments:tournaments.length,complete:tournaments.filter(x=>x?.decision==='complete').length,pending:tournaments.filter(x=>x?.decision==='pending').length,technicalPending:rows.filter(x=>x.category==='technical').length},gap,finland:finland?{decision:finland.decision,missingSections:finland.missingSections}:null,currentResidues:rows};
          fs.writeFileSync('itf-final-recertification.json',JSON.stringify(report,null,2)+'\n');
          console.log('ITF_FINAL_RECERTIFICATION='+JSON.stringify(report));
          const gapBad=gap.filter(x=>x.decision!=='complete'),technical=rows.filter(x=>x.category==='technical');
          if(unresolvedGapLabels.length||gapBad.length||technical.length)throw Error('recertification failed: unresolvedGapLabels='+unresolvedGapLabels.map(x=>x.label).join(',')+' gap='+gapBad.map(x=>x.competitionId).join(',')+' technical='+technical.map(x=>x.competitionId+':'+x.event).join(','));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-final-recertification
          path: |
            itf-final-recertification.json
            history/itf_database_audit.json
            history/itf_draw_target_db.json
            dist/v3/audits/itf-final-recertification/*.json
          retention-days: 14
