name: Court Watch Tennis Europe D1 agenda audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/scripts/audit-tennis-europe-agenda-d1.mjs'
      - '.github/workflows/courtwatch-tennis-europe-agenda-audit.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-te-agenda-read-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check audit syntax
        run: node --check scripts/audit-tennis-europe-agenda-d1.mjs
      - name: Compare existing D1 Tennis Europe matches and Agenda projections
        run: node scripts/audit-tennis-europe-agenda-d1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-europe-agenda-d1-audit
          path: cloudflare/app-api/audit-tennis-europe-agenda-d1
          retention-days: 7
          if-no-files-found: error
