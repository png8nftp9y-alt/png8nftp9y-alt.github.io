name: Court Watch Cloudflare D1 usage audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-cloudflare-d1-usage-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Cloudflare D1 usage
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'NODE'
          const now=new Date(),from=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1)).toISOString().slice(0,10),to=now.toISOString().slice(0,10);
          const variants=[
            `query($accountTag:String!,$from:Date!,$to:Date!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$from,date_leq:$to},orderBy:[date_ASC]){dimensions{date databaseId}sum{rowsRead rowsWritten readQueries writeQueries}}}}}`,
            `query($accountTag:String!,$from:Date!,$to:Date!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$from,date_leq:$to}){dimensions{date databaseId}sum{rowsRead rowsWritten}}}}}`
          ];
          let body;for(const query of variants){const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,from,to}})});body=await response.json();if(response.ok&&!body.errors?.length)break}
          if(body?.errors?.length||!body?.data)throw new Error(`Cloudflare Analytics API: ${JSON.stringify(body?.errors||body)}`);
          const rows=body.data.viewer.accounts?.[0]?.d1AnalyticsAdaptiveGroups||[],daily={};for(const row of rows){const key=row.dimensions?.date||'unknown',out=daily[key]||={rowsRead:0,rowsWritten:0,readQueries:0,writeQueries:0};for(const field of Object.keys(out))out[field]+=Number(row.sum?.[field]||0)}
          const totals=Object.values(daily).reduce((out,row)=>{for(const field of Object.keys(out))out[field]+=row[field];return out},{rowsRead:0,rowsWritten:0,readQueries:0,writeQueries:0});
          console.log('CLOUDFLARE_D1_USAGE '+JSON.stringify({from,to,totals,daily}));
          NODE
