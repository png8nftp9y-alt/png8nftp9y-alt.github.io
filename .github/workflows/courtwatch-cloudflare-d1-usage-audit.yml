name: Court Watch Cloudflare D1 usage audit
# Diagnostic trigger: 2026-09-19 (billing projection through 2026-10-15)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/courtwatch-cloudflare-d1-usage-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Cloudflare D1 usage
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'NODE'
          const now=new Date(),from=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1)).toISOString().slice(0,10),to=now.toISOString().slice(0,10);
          const variants=[
            `query($accountTag:String!,$from:Date!,$to:Date!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$from,date_leq:$to},orderBy:[date_ASC]){dimensions{date databaseId}sum{rowsRead rowsWritten readQueries writeQueries}}}}}`,
            `query($accountTag:String!,$from:Date!,$to:Date!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{date_geq:$from,date_leq:$to}){dimensions{date databaseId}sum{rowsRead rowsWritten}}}}}`
          ];
          let body;for(const query of variants){const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{accountTag:process.env.CLOUDFLARE_ACCOUNT_ID,from,to}})});body=await response.json();if(response.ok&&!body.errors?.length)break}
          if(body?.errors?.length||!body?.data)throw new Error(`Cloudflare Analytics API: ${JSON.stringify(body?.errors||body)}`);
          const rows=body.data.viewer.accounts?.[0]?.d1AnalyticsAdaptiveGroups||[],empty=()=>({rowsRead:0,rowsWritten:0,readQueries:0,writeQueries:0}),add=(out,row)=>{for(const field of Object.keys(out))out[field]+=Number(row.sum?.[field]||row[field]||0);return out};
          const databaseResponse=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const databaseBody=await databaseResponse.json(),databaseNames=new Map((databaseBody.result||[]).map(database=>[database.uuid,database.name]));
          const daily={},byDatabase={};for(const row of rows){const date=row.dimensions?.date||'unknown',databaseId=row.dimensions?.databaseId||'unknown';add(daily[date]||=empty(),row);const database=byDatabase[databaseId]||={databaseId,name:databaseNames.get(databaseId)||databaseId,totals:empty(),daily:{}};add(database.totals,row);add(database.daily[date]||=empty(),row)}
          const totals=Object.values(daily).reduce((out,row)=>add(out,row),empty());
          const databases=Object.values(byDatabase).sort((a,b)=>b.totals.rowsWritten-a.totals.rowsWritten||b.totals.rowsRead-a.totals.rowsRead).map(database=>({...database,overageRateCost:{readsUsd:Number((database.totals.rowsRead/1e9).toFixed(6)),writesUsd:Number((database.totals.rowsWritten/1e6).toFixed(6))}}));
          console.log('CLOUDFLARE_D1_USAGE '+JSON.stringify({from,to,totals,daily}));
          console.log('CLOUDFLARE_D1_USAGE_BY_DATABASE '+JSON.stringify({from,to,databaseListStatus:databaseResponse.status,databases}));
          const subscriptionResponse=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/subscriptions`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
          const subscriptionBody=await subscriptionResponse.json();
          const subscriptions=(subscriptionBody.result||[]).map(({status,frequency,current_period_start,current_period_end,price,rate_plan})=>({status,frequency,current_period_start,current_period_end,price,plan:rate_plan?{public_name:rate_plan.public_name,currency:rate_plan.currency,externally_managed:rate_plan.externally_managed}:null}));
          console.log('CLOUDFLARE_SUBSCRIPTIONS '+JSON.stringify({success:subscriptionBody.success,status:subscriptionResponse.status,subscriptions,errors:subscriptionBody.errors||[]}));
          NODE
