name: Court Watch v3 ex novo discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/discover-fitp.mjs'
      - 'src/v3/discover-itf.mjs'
      - 'src/v3/entries-engine.mjs'
      - 'courtwatch-v3-discovery-trigger.json'
      - '.github/workflows/courtwatch-v3-discovery.yml'
      - 'players.json'
permissions: {contents: write}
concurrency: {group: court-watch-v3-discovery,cancel-in-progress: true}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run ex novo discovery engines
        run: |
          set +e
          node src/v3/discover-fitp.mjs > courtwatch-v3-discovery-run.log 2>&1
          echo "fitpExit=$?" >> courtwatch-v3-discovery-run.log
          echo "teSkipped=owned_by_sharded_tennis_europe_live_workflow" >> courtwatch-v3-discovery-run.log
          node src/v3/discover-itf.mjs >> courtwatch-v3-discovery-run.log 2>&1
          echo "itfExit=$?" >> courtwatch-v3-discovery-run.log
          node src/v3/entries-engine.mjs >> courtwatch-v3-discovery-run.log 2>&1
          echo "entriesExit=$?" >> courtwatch-v3-discovery-run.log
          cat courtwatch-v3-discovery-run.log
      - name: Commit v3 discovery output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_entries.json dist/v3/source_itf_entries.json dist/v3/players.json dist/v3/tournament_entries.json dist/v3/tournaments.json dist/v3/entries_fitp.json dist/v3/entries_tennis_europe.json dist/v3/entries_itf.json dist/v3/sync_status.json dist/v3/entries_log.json courtwatch-v3-discovery-run.log .github/workflows/courtwatch-v3-discovery.yml
          git commit -m "Build Court Watch v3 ex novo discovery data" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
