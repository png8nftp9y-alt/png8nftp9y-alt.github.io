      - name: Inventory one concluded tournament
        env:
          ITF_TOURNAMENT_SLOT: ${{ matrix.slot }}
          ITF_TOURNAMENT_OFFSET: '0'
          ITF_REQUEST_TIMEOUT_MS: '30000'
        run: ITF_TOURNAMENT_INDEX=$((ITF_TOURNAMENT_SLOT + ITF_TOURNAMENT_OFFSET)) node src/v3/inventory-itf-history-tournament.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itf-inventory-0-${{ matrix.slot }}
          path: dist/v3/shards/itf/inventory/*.json
