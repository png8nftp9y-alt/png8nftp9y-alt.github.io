name: Court Watch Tennis Europe rankings
# Certification trigger: 2026-09-11
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/scripts/sync-tennis-europe-rankings.mjs'
      - '.github/workflows/courtwatch-tennis-europe-rankings.yml'
permissions:
  contents: read
concurrency:
  group: courtwatch-tennis-europe-rankings
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - name: Read Tennis Europe matches
        run: |
          read_ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "SELECT payload FROM app_matches WHERE lower(COALESCE(json_extract(payload,'$.circuit'),json_extract(payload,'$.sourceId'),json_extract(payload,'$.source'),json_extract(payload,'$.sourceName'),'')) LIKE '%tennis%europe%'" --json > te-ranking-matches.pending.json; then
              mv te-ranking-matches.pending.json te-ranking-matches.json
              read_ok=1
              break
            fi
            rm -f te-ranking-matches.pending.json
            sleep $((attempt * 5))
          done
          test "$read_ok" -eq 1
      - name: Acquire official rankings
        run: node scripts/sync-tennis-europe-rankings.mjs
      - name: Import history and immutable match rankings
        run: |
          for sql_file in seed-tennis-europe-rankings/rankings-*.sql; do
            imported=0
            for attempt in 1 2 3 4 5; do
              if npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"; then
                imported=1
                break
              fi
              sleep $((attempt * 10))
            done
            test "$imported" -eq 1
          done
      - name: Verify rankings really reached D1
        run: |
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "SELECT COUNT(*) AS ranking_history_count FROM tennis_europe_ranking_history" --json > te-ranking-verification.json
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('te-ranking-verification.json','utf8'));const rows=data?.[0]?.results||data?.result?.[0]?.results||[];const count=Number(rows[0]?.ranking_history_count||0);console.log(JSON.stringify({rankingHistoryCount:count}));if(!Number.isInteger(count)||count<1)process.exit(1)"
      - name: Deploy ranking-aware API
        run: |
          npm run check
          npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc
