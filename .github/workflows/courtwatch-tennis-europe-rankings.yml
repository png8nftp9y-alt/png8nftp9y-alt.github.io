# D1_WRITE_POLICY: incremental
name: Court Watch Tennis Europe rankings
# Certification trigger: 2026-09-11
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 1,2'
  push:
    branches: [main]
    paths:
      - 'cloudflare/app-api/scripts/sync-tennis-europe-rankings.mjs'
      - '.github/workflows/courtwatch-tennis-europe-rankings.yml'
      - 'cloudflare/app-api/scripts/export-all-app-ranking-input.mjs'
      - 'cloudflare/app-api/lib/all-app-ranking-input.mjs'
permissions:
  contents: read
concurrency:
  group: courtwatch-te-rankings
  cancel-in-progress: false
  queue: single
jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check source outside the D1 writer queue
        working-directory: cloudflare/app-api
        run: npm run check
  release-safety:
    needs: check-source
    uses: ./.github/workflows/courtwatch-release-safety.yml
    with:
      source_sha: ${{ needs.check-source.outputs.source_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  sync:
    needs: [check-source, release-safety]
    concurrency:
      group: courtwatch-d1-writes
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      GITHUB_TOKEN: ${{ github.token }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Block deployment unless exact code passed required safety
        working-directory: .
        run: node tools/ensure-release-safety.mjs --expect "${{ needs.release-safety.outputs.code_fingerprint }}"
      - run: npm install
      - name: Recheck source only when code advanced during the wait
        if: env.COURTWATCH_RELEASE_RECHECKED != 'true'
        env:
          CHECKED_SHA: ${{ needs.check-source.outputs.source_sha }}
        run: |
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CHECKED_SHA"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$CHECKED_SHA" HEAD -- cloudflare/app-api src/v3 tools/tests v3.js v3.html v3.css .github/workflows; then
            npm run check
          fi
      - run: node scripts/configure-d1.mjs
      - name: Read all selected app players and their Tennis Europe matches
        run: node scripts/export-all-app-ranking-input.mjs
      - name: Acquire official rankings
        env:
          TE_REQUIRE_APP_EXPORT: '1'
        run: node scripts/sync-tennis-europe-rankings.mjs
      - name: Import history and immutable match rankings
        run: |
          node scripts/guard-d1-import.mjs seed-tennis-europe-rankings/rankings-*.sql
          for sql_file in seed-tennis-europe-rankings/rankings-*.sql; do
            imported=0
            for attempt in 1 2 3 4 5; do
              if npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file "$sql_file"; then
                imported=1
                break
              fi
              sleep $((attempt * 10))
            done
            test "$imported" -eq 1
          done
      - name: Verify rankings really reached D1
        run: |
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "SELECT category, COUNT(*) AS ranking_count FROM tennis_europe_ranking_history WHERE publication_id=(SELECT publication_id FROM tennis_europe_ranking_history ORDER BY ranking_date DESC, captured_at DESC LIMIT 1) GROUP BY category ORDER BY category; SELECT COUNT(*) AS match_snapshot_count FROM tennis_europe_match_ranking_snapshots" --json > te-ranking-verification.json
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('te-ranking-verification.json','utf8'));const blocks=data?.[0]?.results?data:(data?.result||[]),counts=Object.fromEntries((blocks[0]?.results||[]).map(row=>[row.category,Number(row.ranking_count)])),snapshots=Number(blocks[1]?.results?.[0]?.match_snapshot_count||0);console.log(JSON.stringify({rankingCounts:counts,matchSnapshotCount:snapshots}));if(['B14','G14','B16','G16'].some(category=>!Number.isInteger(counts[category])||counts[category]<=100)||!Number.isInteger(snapshots)||snapshots<1)process.exit(1)"
      - name: Verify fresh D1 runtime release before deployment
        run: node scripts/sync-runtime-documents-d1.mjs
      - name: Deploy ranking-aware API
        run: |
          npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc

      - name: Verify actual Agenda ranking links after import
        env:
          CW_REQUIRE_COMPLETE: '1'
        run: node scripts/inspect-agenda-ranking-link.mjs
