name: Court Watch Tennis Europe rankings
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  workflow_run:
    workflows:
      - Court Watch Cloudflare D1 and app API
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: courtwatch-d1-writes
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloudflare/app-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: node scripts/configure-d1.mjs
      - run: npx wrangler d1 migrations apply courtwatch-app --remote --config wrangler.generated.jsonc
      - name: Read Tennis Europe matches
        run: npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "SELECT payload FROM app_matches WHERE json_extract(payload,'$.circuit')='tennis-europe'" --json > te-ranking-matches.json
      - name: Acquire official rankings
        run: node scripts/sync-tennis-europe-rankings.mjs
      - name: Import history and immutable match rankings
        run: npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --file seed-tennis-europe-rankings/rankings.sql
      - name: Verify rankings really reached D1
        run: |
          npx wrangler d1 execute courtwatch-app --remote --config wrangler.generated.jsonc --command "SELECT COUNT(*) AS ranking_history_count FROM tennis_europe_ranking_history" --json > te-ranking-verification.json
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('te-ranking-verification.json','utf8'));const rows=data?.[0]?.results||data?.result?.[0]?.results||[];const count=Number(rows[0]?.ranking_history_count||0);console.log(JSON.stringify({rankingHistoryCount:count}));if(!Number.isInteger(count)||count<1)process.exit(1)"
      - name: Deploy ranking-aware API
        run: |
          npm run check
          npx wrangler deploy --minify --keep-vars --config wrangler.generated.jsonc
