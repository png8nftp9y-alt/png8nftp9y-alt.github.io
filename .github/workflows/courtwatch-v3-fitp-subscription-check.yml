name: Court Watch v3 FITP subscription check probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/v3/audit-fitp-subscription-check.mjs'
      - 'courtwatch-v3-fitp-subscription-check-trigger.json'
      - '.github/workflows/courtwatch-v3-fitp-subscription-check.yml'
permissions: {contents: write}
concurrency: {group: court-watch-v3-fitp-subscription-check,cancel-in-progress: true}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Probe subscription check
        run: |
          node src/v3/audit-fitp-subscription-check.mjs > courtwatch-v3-fitp-subscription-check-run.log 2>&1
          cat courtwatch-v3-fitp-subscription-check-run.log
      - name: Commit subscription check output
        if: always()
        run: |
          git config user.name courtwatch-bot
          git config user.email courtwatch-bot@users.noreply.github.com
          git add dist/v3/source_fitp_subscription_check_probe.json courtwatch-v3-fitp-subscription-check-run.log
          git commit -m "Build Court Watch v3 FITP subscription check probe" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
