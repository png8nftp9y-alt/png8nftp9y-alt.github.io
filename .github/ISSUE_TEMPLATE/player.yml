name: Aggiungi giocatore
about: Inserisce un giocatore nel monitor Court Watch
body:
  - type: input
    id: name
    attributes:
      label: Nome e cognome
    validations:
      required: true
  - type: input
    id: birth
    attributes:
      label: Anno di nascita
  - type: input
    id: club
    attributes:
      label: Circolo
  - type: textarea
    id: circuits
    attributes:
      label: Circuiti
      description: FITP, Tennis Europe e/o ITF
  - type: input
    id: fitp
    attributes:
      label: ID FITP
  - type: input
    id: te
    attributes:
      label: ID Tennis Europe
  - type: input
    id: itf
    attributes:
      label: World Tennis ID
  - type: textarea
    id: tournaments
    attributes:
      label: Tornei ufficiali confermati
      description: Una riga per torneo nel formato Nome | YYYY-MM-DD | YYYY-MM-DD | URL ufficiale
  - type: checkboxes
    id: authorization
    attributes:
      label: Autorizzazione
      options:
        - label: Confermo di avere l’autorizzazione necessaria.
          required: true
