<!doctype html>
<html lang="it">
  <head>
    <script>
      if (location.hostname === "png8nftp9y-alt.github.io")
        location.replace(
          "https://courtwatch-app-api.ckrk9ggvrb.workers.dev/app" +
            location.hash,
        );
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="preload" as="fetch" href="https://png8nftp9y-alt.github.io/dist/v3/players.json" crossorigin="anonymous" />
    <link rel="preload" as="fetch" href="https://png8nftp9y-alt.github.io/dist/v3/tournaments.json" crossorigin="anonymous" />
    <link rel="preload" as="fetch" href="https://png8nftp9y-alt.github.io/dist/v3/agenda.json" crossorigin="anonymous" />
    <link rel="preload" as="fetch" href="https://png8nftp9y-alt.github.io/dist/v3/tournament_entries.json" crossorigin="anonymous" />
    <link rel="preload" as="fetch" href="https://png8nftp9y-alt.github.io/dist/v3/results.json" crossorigin="anonymous" />
    <title>Court Watch</title>
    <link rel="stylesheet" href="v3.css?v=2026092002" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <div class="logo">CW</div>
          <div><h1>Court Watch</h1></div>
        </div>
        <button id="resetHome" class="btn">Home · Oggi</button>
        <div class="status" id="syncStatus">Caricamento…</div>
        <div class="accountControl" id="accountControl">
          <button
            type="button"
            class="accountAvatar"
            id="accountMenuButton"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span id="accountInitials">FQ</span>
          </button>
          <div class="accountMenu" id="accountMenu" role="menu" hidden>
            <button type="button" id="accountLogout" role="menuitem">
              Logout
            </button>
          </div>
        </div>
      </header>
      <div id="dataAlert" class="dataAlert" hidden></div>
      <main id="homeView" class="view active">
        <section class="card agendaCard">
          <div class="cardHead agendaHead">
            <div>
              <h2>Agenda</h2>
              <select
                id="agendaMode"
                class="agendaMode"
                aria-label="Ordinamento Agenda"
              >
                <option value="tournament">Per torneo</option>
                <option value="chronological">Cronologico</option>
              </select>
            </div>
            <div class="nav agendaNav">
              <button
                id="prevAgendaMonth"
                class="btn icon"
                aria-label="Mese precedente"
              >
                ≪</button
              ><button
                id="prevAgenda"
                class="btn icon"
                aria-label="Giorno precedente"
              >
                ‹</button
              ><button id="agendaToday" class="btn dateBtn">Oggi</button
              ><button
                id="nextAgenda"
                class="btn icon"
                aria-label="Giorno successivo"
              >
                ›</button
              ><button
                id="nextAgendaMonth"
                class="btn icon"
                aria-label="Mese successivo"
              >
                ≫
              </button>
            </div>
          </div>
          <div id="datePopover" class="datePopover" hidden></div>
          <div id="dailyAgenda"></div>
        </section>
        <section class="layout">
          <div class="card calendarCard" id="calendarCard">
            <div class="cardHead calendarHead">
              <h2>Calendario</h2>
              <div class="demographicFilters">
                <details id="calendarCategory">
                  <summary>
                    Categoria: <span id="categoryFilterLabel">Tutte</span>
                  </summary>
                  <div class="categoryFilterMenu">
                    <label
                      ><input
                        type="checkbox"
                        value="U10"
                        data-category-filter
                      />
                      U10</label
                    ><label
                      ><input
                        type="checkbox"
                        value="U12"
                        data-category-filter
                      />
                      U12</label
                    ><label
                      ><input
                        type="checkbox"
                        value="U14"
                        data-category-filter
                      />
                      U14</label
                    ><label
                      ><input
                        type="checkbox"
                        value="U16"
                        data-category-filter
                      />
                      U16</label
                    ><label
                      ><input
                        type="checkbox"
                        value="U18"
                        data-category-filter
                      />
                      U18</label
                    ><label
                      ><input
                        type="checkbox"
                        value="O18"
                        data-category-filter
                      />
                      O18</label
                    >
                  </div>
                </details>
                <label
                  >Sesso<select
                    id="calendarSex"
                    aria-label="Filtra giocatori per sesso"
                  >
                    <option value="all">Tutti</option>
                    <option value="M">M</option>
                    <option value="F">F</option>
                  </select></label
                >
              </div>
              <button id="toggleAll" class="btn">Deseleziona tutti</button>
            </div>
            <div class="filters">
              <div id="playerFilters" class="chips"></div>
            </div>
            <div id="calendarMonthLabel" class="calendarMonthLabel"></div>
            <div class="legend">
              <span class="fitp">FITP</span
              ><span class="tennis-europe">Tennis Europe</span
              ><span class="itf">ITF</span>
            </div>
            <div id="calendar"></div>
          </div>
          <aside>
            <div class="card playersCard" id="playersCard">
              <div class="cardHead playersCardHead">
                <h3>Giocatori</h3>
                <div class="playersHeaderActions" aria-label="Azioni giocatori">
                  <button
                    type="button"
                    id="addPlayer"
                    class="playersHeaderAction"
                    aria-label="Aggiungi giocatore"
                    title="Aggiungi giocatore"
                  >
                    +</button
                  ><button
                    type="button"
                    id="removePlayer"
                    class="playersHeaderAction"
                    aria-label="Rimuovi giocatore"
                    title="Rimuovi giocatore"
                  >
                    −</button
                  ><button
                    type="button"
                    class="playersHeaderAction"
                    aria-label="Altri giocatori"
                  >
                    Altri
                  </button>
                </div>
                <span id="playerTotal"></span>
              </div>
              <div id="playersList" class="playersList"></div>
            </div>
          </aside>
        </section>
      </main>
      <main id="profileView" class="view">
        <div class="profileNav">
          <button id="backHome" class="btn back">← Indietro</button
          ><button
            id="removeProfilePlayer"
            class="btn removeProfilePlayer"
            title="Rimuovi giocatore"
            aria-label="Rimuovi giocatore"
          >
            Rimuovi giocatore
          </button>
        </div>
        <div id="profileContent"></div>
      </main>
    </div>
    <script src="v3.js?v=2026092002"></script>
  </body>
</html>
